<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#04070f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Deep</title>
  <meta name="arcade-home" content="../../index.html#em">
  <meta name="arcade-title" content="Deep">
<meta name="arcade-accent" content="#4de0c8">
<script src="../../audio.js"></script>
<script src="../../arcade.js"></script>
<style>
/* Self-hosted — no network call at launch, so a wrapped native build
   and the offline PWA both render correctly. Generated by fonts.py.
   Variable families ship whole with a weight RANGE: instancing each
   weight separately produced files the browser silently refused. */
@font-face{font-family:"Bricolage Grotesque";font-style:normal;font-weight:200 800;font-display:swap;src:url("../../fonts/bricolagegrotesque-var.woff2") format("woff2")}
@font-face{font-family:"DM Mono";font-style:normal;font-weight:400;font-display:swap;src:url("../../fonts/dmmono-400.woff2") format("woff2")}
@font-face{font-family:"DM Mono";font-style:normal;font-weight:500;font-display:swap;src:url("../../fonts/dmmono-500.woff2") format("woff2")}


  :root{
    --abyss:#04070f;
    --deep:#0a1526;
    --rock:#16202f;
    --lume:#4de0c8;
    --spark:#ffb454;
    --alarm:#ff5a6e;
    --pale:#dff5ef;
    --display:"Bricolage Grotesque","Helvetica Neue",Helvetica,Arial,sans-serif;
    --mono:"DM Mono",ui-monospace,"SF Mono",Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{
    height:100%;width:100%;overflow:hidden;position:fixed;
    background:#020307;color:var(--pale);
    font-family:var(--display);
    overscroll-behavior:none;touch-action:none;
    -webkit-user-select:none;user-select:none;
  }
  #stage{
    position:absolute;inset:0;display:grid;place-items:center;
  }
  #frame{
    position:relative;
    width:min(100dvw, calc(var(--stage-h, 100dvh) * 0.62));height:var(--stage-h, 100dvh);
    overflow:hidden;
    box-shadow:0 0 120px rgba(77,224,200,.06);
  }
  canvas{display:block;width:100%;height:100%;touch-action:none}

  /* ---- HUD ---- */
  #hud{
    position:absolute;top:0;left:0;right:0;
    padding:calc(var(--safe-top, env(safe-area-inset-top,0px)) + 14px) 18px 0 18px;
    display:flex;justify-content:space-between;align-items:flex-start;
    pointer-events:none;
  }
  .readout{font-family:var(--mono);font-size:13px;letter-spacing:.06em}
  .readout .label{
    display:block;font-size:9px;letter-spacing:.22em;text-transform:uppercase;
    color:rgba(223,245,239,.38);margin-bottom:3px;
  }
  #depth{font-size:30px;font-weight:500;line-height:1;color:var(--pale);font-variant-numeric:tabular-nums}
  #depth small{font-size:13px;color:rgba(223,245,239,.45);margin-left:2px}
  #sparks{text-align:right;font-size:20px;line-height:1;color:var(--spark);font-variant-numeric:tabular-nums}

  /* ---- Panels ---- */
  /* Nothing in an overlay may reach past it. The title is set in a display
   face that may or may not have loaded — a fallback with wider metrics used
   to push the word off the side of the screen, and it is invisible on any
   machine where the real font is available. Cap everything and let long words
   break rather than trusting the typeface. */
#veil{overflow-x:hidden;}
#veil *{max-width:100%;overflow-wrap:anywhere}
#veil h1{overflow-wrap:break-word;hyphens:auto}
#veil{
    position:absolute;inset:0;display:grid;place-items:center;
    padding:32px 26px calc(env(safe-area-inset-bottom,0px) + 32px);
    background:radial-gradient(120% 80% at 50% 45%,rgba(4,7,15,.72),rgba(2,3,7,.94));
    backdrop-filter:blur(2px);
    text-align:center;
    /* This was a tap-anywhere panel, so it deliberately let taps fall through
       to the canvas. Now it holds a MENU, and pointer-events:none made every
       button unclickable — the canvas was winning elementFromPoint. */
    pointer-events:auto;
    z-index:30;
    transition:opacity .28s ease;
  }
  #veil.hidden{opacity:0;pointer-events:none;display:none}
  .eyebrow{
    font-family:var(--mono);font-size:10px;letter-spacing:.34em;text-transform:uppercase;
    color:var(--lume);opacity:.75;margin-bottom:18px;
  }
  h1{
    font-family:var(--display);font-weight:800;
    font-size:clamp(46px,15vw,78px);line-height:.86;letter-spacing:-.035em;
    margin-bottom:6px;
  }
  h1 em{font-style:normal;display:block;color:var(--lume)}
  .sub{
    font-family:var(--mono);font-size:13px;line-height:1.7;
    color:rgba(223,245,239,.62);max-width:26ch;margin:20px auto 0;
  }
  .sub b{color:var(--pale);font-weight:500}
  .cue{
    margin-top:30px;font-family:var(--mono);font-size:11px;letter-spacing:.24em;
    text-transform:uppercase;color:rgba(223,245,239,.5);
    animation:pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  @media (prefers-reduced-motion:reduce){.cue{animation:none;opacity:.7}}

  /* game over specifics */
  .final{
    font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;
    color:rgba(223,245,239,.4);margin-bottom:10px;
  }
  .big{
    font-family:var(--mono);font-weight:500;font-size:clamp(56px,18vw,88px);
    line-height:1;color:var(--pale);font-variant-numeric:tabular-nums;letter-spacing:-.02em;
  }
  .big u{text-decoration:none;font-size:.3em;color:rgba(223,245,239,.45);margin-left:4px}
  .tally{
    margin-top:22px;display:flex;gap:26px;justify-content:center;
    font-family:var(--mono);font-size:12px;color:rgba(223,245,239,.55);
  }
  .tally b{display:block;font-size:19px;color:var(--pale);font-weight:500;margin-top:4px}
  .tally .amber b{color:var(--spark)}
  .rule{width:44px;height:1px;background:rgba(77,224,200,.35);margin:26px auto 0}

/* ---- the title menu -------------------------------------------------
   These were never styled: an earlier insert missed its anchor, so the
   buttons rendered as bare 37x19 <button> elements — below any reasonable
   tap target and invisible against the panel. */
.tmenu{
  display:flex;flex-direction:column;gap:9px;
  width:min(250px,78vw);margin:22px auto 0;
}
.mbtn{
  width:100%;min-height:48px;padding:15px 14px;
  font:inherit;font-size:12px;letter-spacing:.18em;
  border:0;border-radius:4px;cursor:pointer;
  background:#9fe3ff;color:#04121b;
}
.mbtn.ghost{
  background:transparent;color:#9fe3ff;
  border:1px solid rgba(159,227,255,.38);
}
.mbtn:active{opacity:.82;transform:translateY(1px)}
.ctrls{margin:16px auto 0;max-width:290px}
.crow{
  display:flex;justify-content:space-between;gap:12px;align-items:baseline;
  padding:8px 2px;border-bottom:1px solid rgba(255,255,255,.08);
  font-size:12px;text-align:left;
}
.crow b{font-weight:600;white-space:nowrap}
.crow i{font-style:normal;opacity:.62;text-align:right}

/* ---------------------------------------------------------------------------
   PORTRAIT ON A PHONE, WIDE ON A DESKTOP

   The manifest pins the INSTALLED app to portrait, but a browser tab cannot be
   forced — `screen.orientation.lock()` only works from fullscreen and throws
   everywhere else. So: on a touch device held sideways, a panel asks for it
   back. On a desktop there is no such thing as the wrong orientation, and a
   wide window is exactly what we want, so the panel never appears there.

   The test is POINTER TYPE, not width. A landscape phone and a small laptop
   window are the same number of pixels and want opposite things.
   --------------------------------------------------------------------------- */
#rotate{
  position:fixed;inset:0;z-index:9000;display:none;
  place-items:center;text-align:center;padding:28px;
  background:#07050b;color:#e8e2f4;
  font-family:var(--px,ui-monospace,monospace);
}
#rotate b{display:block;font-size:12px;letter-spacing:.22em;color:var(--gold,#e8b23a);margin-bottom:14px}
#rotate span{display:block;font-size:10px;letter-spacing:.14em;color:#8a8296;line-height:2}
#rotate i{display:block;width:52px;height:82px;margin:0 auto 22px;
  border:2px solid rgba(232,178,58,.65);border-radius:8px;
  transform:rotate(90deg);animation:rot 2.4s ease-in-out infinite}
@keyframes rot{0%,40%{transform:rotate(90deg)}60%,100%{transform:rotate(0deg)}}
@media (orientation:landscape) and (pointer:coarse){
  body.lock-portrait #rotate{display:grid}
}

#titleArt{position:absolute;inset:0;z-index:29;display:none;width:100%;height:100%}
body.titling #titleArt{display:block}
body.titling #veil{
  background:linear-gradient(180deg, rgba(1,5,10,0) 0%, rgba(1,5,10,0) 44%,
    rgba(1,5,10,.60) 62%, rgba(1,5,10,.94) 82%, rgba(1,5,10,.98) 100%);
  align-items:end;padding-bottom:34px}
body.titling #veil h1{display:none}
.legal{margin-top:14px;font-size:8px;letter-spacing:.14em;
  color:rgba(255,255,255,.24);text-align:center}
</style>
</head>
<body>
<div id="stage">
  <div id="frame">
    <canvas id="game"></canvas>

    <div id="hud">
      <div class="readout">
        <span class="label">Depth</span>
        <span id="depth">0<small>m</small></span>
      </div>
      <div class="readout">
        <span class="label">Sparks</span>
        <span id="sparks">0</span>
      </div>
    </div>

    <canvas id="titleArt"></canvas>
<div id="veil">
      <div id="veilBody">
        <div class="eyebrow" id="eyebrow">Descent log — 001</div>
        <div id="panel"><h1>Deep</h1></div>
        <div class="rule"></div>
        <div class="cue" id="cue"></div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

/* ------------------------------------------------------------------ *
 *  Sounding — a one-thumb descent.
 *  Logical space is 600 units wide; height derives from the viewport.
 *  10 logical units = 1 metre.
 * ------------------------------------------------------------------ */

const cv  = document.getElementById('game');
const ctx = cv.getContext('2d');
const veil = document.getElementById('veil');
const panel = document.getElementById('panel');
const eyebrow = document.getElementById('eyebrow');
const cue = document.getElementById('cue');
const depthEl = document.getElementById('depth');
const sparkEl = document.getElementById('sparks');

const W = 600;                 // logical width, fixed
let   H = 1000;                // logical height, from viewport
let   scale = 1, dpr = 1;

const UPM   = 10;              // units per metre
const R     = 15;              // diver radius
let WATERLINE = 0;             // set on resize: where the surface sits
const TH    = 24;              // ledge thickness
const ORB_R = 9;

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let state = 'ready';           // ready | diving | lost
let dives = 0;
let best = 0;

let px, targetX, playerY, vxSmoothed;
let dist, speed, obstacles, orbs, fish, motes, bits, sparks, threads;
let shake, flash, deadAt, toast, lastTime, acc, cause;

/* ---------------------------------------------------------------- */
/*  Sound — a cold room with something breathing at the bottom       */
/* ---------------------------------------------------------------- */
const AR = window.Arcade;
const PENT = [329.63, 392.00, 440.00, 493.88, 587.33];   // E minor pentatonic

const snd = {
  drone: null,
  armed: false,
  arm(){
    if (snd.armed || !AR.audio.onReset) return;
    snd.armed = true;
    AR.audio.onReset(() => { snd.drone = null; snd.wash = null; snd.begin(); });
  },

  /* ---- surface -----------------------------------------------------------
     Above the water it is wash and gulls. The deep drone does NOT start here:
     it belongs to the water, and starting it on the boat gave away where the
     game was going before the sub had left the hook.
     ------------------------------------------------------------------------ */
  surface(){
    if (!AR) return;
    AR.audio.init();
    if (!AR.audio.ctx) return;
    snd.arm();
    /* the wash: broad low noise that breathes with the swell */
    if (!snd.wash) snd.wash = AR.sfx.holdNoise({ freq:520, q:0.5, bus:'music' });
    snd.wash.set(520, 0.075, 0.9);
    snd.gullT = 0;
  },
  /* called every frame while on the surface */
  swell(dt, phase){
    if (!AR || !snd.wash) return;
    /* the wash rises and falls with the same swell the boat is riding */
    const s2 = 0.5 + Math.sin(phase * 0.95) * 0.5;
    snd.wash.set(420 + s2*420, 0.050 + s2*0.055, 0.25);
    /* gulls, at irregular intervals so they never feel metered */
    snd.gullT = (snd.gullT || 0) - dt;
    if (snd.gullT <= 0){
      snd.gullT = 1.1 + Math.random()*2.4;
      snd.gull();
    }
  },
  gull(){
    if (!AR) return;
    /* two or three descending cries, each a quick up-then-down */
    const n = 2 + ((Math.random()*2)|0);
    const base = 900 + Math.random()*380;
    for (let i=0;i<n;i++){
      const t0 = AR.audio.now() + i*(0.17 + Math.random()*0.09);
      const f  = base * Math.pow(0.88, i);
      AR.sfx.tone({ t:t0,       freq:f*0.72, to:f,      dur:0.075, type:'sawtooth',
                    gain:0.028, cutoff:2600, verb:0.45 });
      AR.sfx.tone({ t:t0+0.07,  freq:f,      to:f*0.62, dur:0.16,  type:'sawtooth',
                    gain:0.034, cutoff:2200, verb:0.55 });
    }
  },
  /* the surface fades out as the water takes over */
  submerge(){
    if (snd.wash) snd.wash.set(300, 0, 0.7);
  },

  begin(){
    if (!AR) return;
    AR.audio.init();
    if (!AR.audio.ctx) return;  // no engine yet; a real gesture will call us back
    snd.arm();
    if (!snd.drone) snd.drone = AR.sfx.hold({ freq:41.2, type:'sawtooth', cutoff:230, q:2.4, verb:0.5, bus:'music' });
    snd.drone.set(41.2, 0.15, 230, 1.4);
    AR.music.start(62, 4, snd.bed);
  },

  bed(step, t){
    if (!AR) return;
    const s = step % 64;
    const deep = Math.min(1, metres()/900);

    if (s % 16 === 0)
      AR.sfx.tone({ t, freq:55, dur:1.9, type:'sine', gain:0.13, bus:'music', attack:0.05, verb:0.45 });

    if (s === 4 || s === 20 || s === 44 || (s === 52 && deep > 0.4)){
      const f = PENT[(Math.random()*PENT.length)|0] * (Math.random() < 0.3 ? 0.5 : 1);
      AR.sfx.tone({ t, freq:f, dur:2.4, type:'sine', gain:0.055, bus:'music',
                    attack:0.03, verb:0.85, cutoff:2400 });
    }
    if (s === 32)
      AR.sfx.tone({ t, freq:1180, to:760, dur:0.55, type:'sine', gain:0.045, bus:'music', verb:0.9 });

    if (deep > 0.55 && s === 24)
      AR.sfx.noise({ t, freq:150, dur:2.6, gain:0.035, filter:'lowpass', q:3, bus:'music' });

    if (snd.drone) snd.drone.set(41.2 - deep*6.5, 0.15 + deep*0.05, 230 - deep*110, 2.5);
  },

  spark(n){
    if (!AR) return;
    AR.sfx.tone({ freq:880 * Math.pow(1.055, Math.min(n, 14)), to:1340, dur:0.19,
                  type:'sine', gain:0.15, verb:0.35 });
    AR.sfx.tone({ freq:1760, dur:0.08, type:'sine', gain:0.045 });
  },
  clean(){
    if (!AR) return;
    const t = AR.audio.now();
    AR.sfx.tone({ t,        freq:987.77, dur:0.24, type:'sine', gain:0.13, verb:0.55 });
    AR.sfx.tone({ t:t+0.085, freq:1318.5, dur:0.34, type:'sine', gain:0.11, verb:0.7 });
    AR.sfx.noise({ t, freq:6000, dur:0.18, gain:0.03, filter:'highpass' });
  },
  pass(){ if (AR) AR.sfx.noise({ freq:240, dur:0.09, gain:0.05, filter:'lowpass', q:1.5 }); },
  creak(){
    if(!AR) return;
    /* wire and winch under load: a low groan with a metal edge */
    AR.sfx.tone({ freq:74, to:66, dur:1.5, type:'sawtooth', gain:0.045, cutoff:340 });
    AR.sfx.noise({ freq:900, dur:1.3, gain:0.022, filter:'bandpass' });
  },
  release(){
    if(!AR) return;
    /* the catch lets go: a hard clack and the wire whipping free */
    AR.sfx.noise({ freq:2600, to:600, dur:0.16, gain:0.09, filter:'bandpass' });
    AR.sfx.tone({ freq:320, to:90, dur:0.20, type:'square', gain:0.06, cutoff:1200 });
  },
  splash2(){
    if(!AR) return;
    AR.sfx.noise({ freq:1800, to:180, dur:0.55, gain:0.10, filter:'lowpass' });
    AR.sfx.tone({ freq:220, to:70, dur:0.45, type:'sine', gain:0.055 });
  },
  dive(){ if (AR) AR.sfx.noise({ freq:2200, to:220, dur:0.75, gain:0.13, filter:'bandpass', q:0.7 }); },

  end(how){
    if (!AR) return;
    const t = AR.audio.now();
    if (how === 'fish'){
      AR.sfx.noise({ t, freq:520, to:120, dur:0.34, gain:0.30, filter:'bandpass', q:1.2 });
      AR.sfx.tone({ t:t+0.03, freq:280, to:70, dur:0.5, type:'sawtooth', gain:0.16, cutoff:900 });
    } else {
      AR.sfx.noise({ t, freq:900, to:80, dur:0.85, gain:0.28, filter:'lowpass', q:2 });
    }
    AR.sfx.tone({ t:t+0.05, freq:170, to:32, dur:1.3, type:'sawtooth', gain:0.18, cutoff:520, verb:0.4 });
    if (snd.drone) snd.drone.set(28, 0.02, 110, 0.8);
  }
};

/* ---------------------------------------------------------------- */
/*  Sizing                                                           */
/* ---------------------------------------------------------------- */
function resize(){
  const r = cv.getBoundingClientRect();
  if (!r.width || !r.height) return;
  dpr = Math.min(2, window.devicePixelRatio || 1);
  scale = r.width / W;
  H = r.height / scale;
  cv.width  = Math.round(r.width  * dpr);
  cv.height = Math.round(r.height * dpr);
  ctx.setTransform(scale*dpr, 0, 0, scale*dpr, 0, 0);
  playerY = H * 0.30;
  WATERLINE = H * 0.42;
  if (motes) seedMotes();
}
window.addEventListener('resize', resize);
window.addEventListener('load', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 150));

/* ---------------------------------------------------------------- */
/*  Helpers                                                          */
/* ---------------------------------------------------------------- */
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const lerp  = (a,b,t) => a + (b-a)*t;
const rand  = (a,b) => a + Math.random()*(b-a);

function difficulty(){ return clamp(metres()/650, 0, 1); }
function hexA(hex, a){
  const h = (hex || '#7de3ff').replace('#','');
  const n = parseInt(h, 16);
  return 'rgba(' + ((n>>16)&255) + ',' + ((n>>8)&255) + ',' + (n&255) + ',' + a + ')';
}
function metres(){ return Math.floor(dist / UPM); }

/* Below this the surface light is gone entirely. Nothing that lives in the lit
   water comes down here, and nothing that lives down here goes up.

   Paced against the clock rather than the tape measure. The descent covers
   100m every 2.4 seconds or so, so the old 300m line put you in pitch black
   about seven seconds into a dive — before the run had really started. The
   light now drains across most of a good dive: it is noticeably dimmer around
   eight seconds, genuinely dark past twelve, and fully black only on a run
   that lasts. */
const DARK_M = 900, FADE_M = 550;
function darkness(){                    /* 0 in the shallows, 1 in the black */
  return clamp((metres() - (DARK_M - FADE_M)) / FADE_M, 0, 1);
}
function inTheBlack(){ return darkness() > 0.985; }
function speedAt(t){ return lerp(340, 620, t); }
function gapAt(t){ return lerp(212, 142, t); }
function spacingAt(t){ return speedAt(t) * lerp(0.98, 0.68, t); }

function circleHitsRect(cx, cy, r, rx, ry, rw, rh){
  const nx = clamp(cx, rx, rx+rw);
  const ny = clamp(cy, ry, ry+rh);
  const dx = cx-nx, dy = cy-ny;
  return dx*dx + dy*dy < r*r;
}

function gapCenter(o){
  if (!o.amp) return o.x;
  const c = o.x + Math.sin(o.t*o.w + o.phase) * o.amp;
  return clamp(c, o.gw/2 + 24, W - o.gw/2 - 24);
}

/* ---------------------------------------------------------------- */
/*  World                                                            */
/* ---------------------------------------------------------------- */
function seedMotes(){
  motes = [];
  for (let i=0;i<64;i++){
    motes.push({
      x: rand(0,W), y: rand(0,H),
      r: rand(0.7,2.6),
      p: rand(0.12,0.55)            // parallax factor
    });
  }
}

function spawnLedge(y){
  const t = difficulty();
  const gw = gapAt(t);
  const margin = gw/2 + 34;
  const moving = metres() > 140 && Math.random() < 0.26;
  const amp = moving ? Math.min(78, (W/2 - margin) * 0.55) : 0;
  const o = {
    y, gw,
    x: rand(margin + amp, W - margin - amp),
    amp, phase: rand(0, Math.PI*2), w: rand(1.3, 1.9), t: 0,
    passed: false
  };
  obstacles.push(o);
  lastLedgeY = y;

  if (!moving && Math.random() < 0.55){
    orbs.push({ x: o.x + rand(-gw*0.22, gw*0.22), y: y + spacingAt(t)*0.46, got:false, spin: rand(0,6) });
  }

  /* Two populations, and they do not mix. Above the dark line it is all
     shallow-water fish; below it, only the ones that carry their own light. */
  const chance = metres() > 60 ? Math.min(0.55, 0.18 + metres()/1400) : 0;
  if (Math.random() < chance){
    const deep = darkness() > 0.35 && Math.random() < darkness();
    const big  = deep && Math.random() < 0.34;
    const rx = big ? 34 : 24, ry = big ? 15 : 11;
    fish.push({
      x: rand(rx + 12, W - rx - 12),
      y: y + spacingAt(t) * rand(0.36, 0.64),
      vx: (Math.random() < 0.5 ? -1 : 1) * rand(70, 120 + Math.min(90, metres()*0.22)),
      rx, ry, tail: rand(0, 6.28), lure: rand(0, 6.28), big,
      deep,
      hue: deep ? (Math.random() < 0.5 ? '#7de3ff' : '#b39bff') : null
    });
  }
}

let lastLedgeY = 0;

function reset(){
  dist = 0; sparks = 0; threads = 0;
  px = W/2; targetX = W/2; vxSmoothed = 0;
  obstacles = []; orbs = []; fish = []; bits = [];
  shake = 0; flash = 0; toast = null; cause = 'ledge';
  acc = 0;
  seedMotes();
  lastLedgeY = H + 340;
  updateHud();
}

/* ---------------------------------------------------------------- */
/*  Input — relative drag, so your thumb never covers the diver      */
/* ---------------------------------------------------------------- */
let dragging = false, grabPointer = 0, grabPlayer = 0;
const keys = Object.create(null);

function localX(clientX){
  const r = cv.getBoundingClientRect();
  return (clientX - r.left) / scale;
}

/* steering is relative and page-wide: put your thumb anywhere and pull */
if (AR && AR.gesture) AR.gesture.onDrag(g => {
  if (state !== 'diving') return;   /* the state is 'diving'; guessing it cost the controls */
  targetX = clamp(targetX + (g.dx / scale) * 1.5, R + 8, W - R - 8);
});

/* and a tap anywhere begins the dive — this used to live on the canvas */
window.addEventListener('pointerdown', e => {
  if (AR && AR.paused && AR.paused()) return;
  if (e.target.closest && e.target.closest('button, a, input')) return;
  if (state === 'launch') release();
  else if (state === 'ready' && !menuOpen) start();
  else if (state === 'lost' && performance.now() - deadAt > 550) start();
}, { passive:true });

cv.addEventListener('contextmenu', e => e.preventDefault());

window.addEventListener('keydown', e => {
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault();
  keys[e.key] = true;
  if (e.key === ' ' || e.key === 'Enter'){
    if (state === 'launch') release();
    else if (state === 'ready' && !menuOpen) start();
    else if (state === 'lost' && performance.now() - deadAt > 550) start();
  }
});
window.addEventListener('keyup', e => { keys[e.key] = false; });

if (AR && AR.pad) AR.pad.onPress(name => {
  if (AR.paused && AR.paused()) return;
  if (name !== 'a' && name !== 'rt' && name !== 'x') return;
  if (state === 'ready' && !menuOpen) start();
  else if (state === 'lost' && performance.now() - deadAt > 550) start();
});

/* ---------------------------------------------------------------- */
/*  State transitions                                                */
/* ---------------------------------------------------------------- */
const veilBody = document.getElementById('veilBody');
let menuOpen = true;          /* the title is a menu, not a "tap anywhere" screen */

function paintMenu(html, acts){
  veilBody.innerHTML = html;
  veil.classList.remove('hidden');
  menuOpen = true;
  veilBody.querySelectorAll('[data-act]').forEach(b => {
    b.addEventListener('click', ev => {
      ev.stopPropagation();
      const fn = acts && acts[b.dataset.act];
      if(fn) fn();
    });
  });
}


/* ---- TITLE: black water ---------------------------------------------------
   No horizon, no sun, no grid. The whole picture is the one thing the game is
   about: pressure and dark. Light from ABOVE only, falling off fast; the sub
   hanging in it; and everything below the beam is nothing at all.

   The letters are ETCHED rather than lit — a hard highlight on the top edge, a
   dark bevel under it, like something stamped into a steel plate. Tall and
   narrow, because the game is a descent.
   -------------------------------------------------------------------------- */
let titleCv = null, titleT = 0, refCv = null;
function drawTitleArt(){
  if(!titleCv) titleCv = document.getElementById('titleArt');
  if(!titleCv) return;
  if(!titleT) titleT = performance.now();
  const T = (performance.now() - titleT) / 1000;
  const g = titleCv.getContext('2d');
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = titleCv.clientWidth, h = titleCv.clientHeight;
  if(titleCv.width !== w*dpr){ titleCv.width = w*dpr; titleCv.height = h*dpr; }
  g.setTransform(dpr,0,0,dpr,0,0);

  /* ---- the water column --------------------------------------------------
     Six stops, weighted to the top: all of the light lives in the first
     quarter and everything below it is a long slow march into nothing. */
  const wg = g.createLinearGradient(0,0,0,h);
  wg.addColorStop(0,   '#1a4a63');
  wg.addColorStop(0.10,'#10344a');
  wg.addColorStop(0.24,'#08202f');
  wg.addColorStop(0.46,'#03101c');
  wg.addColorStop(0.72,'#01070f');
  wg.addColorStop(1,   '#000308');
  g.fillStyle = wg; g.fillRect(0,0,w,h);

  /* ---- the surface, seen from beneath -------------------------------------
     Caustics: overlapping sine bands that slide across each other, brightest
     right at the top and gone within a fifth of the screen. */
  g.save();
  g.globalCompositeOperation = 'lighter';
  for(let i=0;i<26;i++){
    const y  = (i/26) * h*0.20;
    const a  = 0.10 * (1 - i/26);
    const ph = Math.sin(T*0.9 + i*0.7) * w*0.18;
    const cg = g.createLinearGradient(0,y,w,y);
    cg.addColorStop(0,'rgba(150,220,245,0)');
    cg.addColorStop(0.5,'rgba(150,220,245,'+a+')');
    cg.addColorStop(1,'rgba(150,220,245,0)');
    g.fillStyle = cg;
    g.fillRect(ph - w*0.3, y, w*1.6, h*0.20/26 + 1);
  }
  g.restore();

  /* ---- the shaft of surface light, swaying -------------------------------- */
  const sway = Math.sin(T*0.45)*w*0.05;
  g.save();
  g.globalCompositeOperation = 'lighter';
  /* the surface light dims and shortens in a slow cycle, as though the sub is
     dropping away from it and catching it again */
  const dive = 0.80 + 0.20*Math.sin(T*0.30);
  const beam = g.createLinearGradient(0,0,0,h*0.62*dive);
  beam.addColorStop(0,'rgba(130,205,240,.22)');
  beam.addColorStop(0.5,'rgba(110,185,225,.07)');
  beam.addColorStop(1,'rgba(100,170,210,0)');
  g.fillStyle = beam;
  g.beginPath();
  g.moveTo(w*0.18 + sway*0.3, 0); g.lineTo(w*0.82 + sway*0.3, 0);
  g.lineTo(w*0.60 + sway, h*0.62*dive); g.lineTo(w*0.40 + sway, h*0.62*dive);
  g.closePath(); g.fill();
  g.restore();

  /* ---- MARINE SNOW, RISING ------------------------------------------------
     This drifted DOWN, which is what snow does when the camera is still. If
     the sub is falling then everything in the water RISES past it, and the
     nearer it is the faster it goes — parallax is the whole illusion.

     Three layers: far specks barely moving, mid, and near streaks that are
     drawn as short vertical LINES because at that speed a particle is a
     streak, not a dot.
     ------------------------------------------------------------------------ */
  const FALL = 210;                       /* how fast the sub is going down */
  for(const layer of [
    { n: 46, k: 0.22, a: 0.16, len: 0,   sz: 1.0 },
    { n: 34, k: 0.55, a: 0.26, len: 4,   sz: 1.4 },
    { n: 20, k: 1.00, a: 0.34, len: 13,  sz: 1.9 }
  ]){
    for(let i=0;i<layer.n;i++){
      const seed = i*i*29 + layer.n*7;
      const span = h + 60;
      /* +T so it travels UPWARD past us */
      const y = span - (((seed + T*FALL*layer.k) % span));
      const x = ((seed*37) % w);
      const fade = Math.min(1, (h - y)/(h*0.25)) * Math.min(1, y/(h*0.06));
      g.strokeStyle = 'rgba(206,238,255,' + (layer.a * fade) + ')';
      g.lineWidth = layer.sz;
      if(layer.len){
        g.beginPath(); g.moveTo(x, y); g.lineTo(x, y + layer.len); g.stroke();
      } else {
        g.fillStyle = 'rgba(206,238,255,' + (layer.a * fade) + ')';
        g.fillRect(x, y, layer.sz, layer.sz);
      }
    }
  }

  /* The angler is gone. It swam ACROSS, which implies a camera holding still
     and watching it — and this card is supposed to be a descent. Anything that
     moves sideways here argues against the one thing the picture is for. The
     effort went into the fall instead.
     ------------------------------------------------------------------------ */

  /* ---- the submersible ---------------------------------------------------
     Built from the reference: a vertical hull, nose DOWN, because that is how
     one of these descends. A domed bow, a ribbed instrument bay behind it, a
     lamp cluster throwing forward, thruster pods on outriggers, and a plume of
     bubbles leaving the top. The old shape was a dome over a cone of light,
     which is the silhouette of a flying saucer.
     ------------------------------------------------------------------------ */
  /* a fast, small tremble rather than a slow bob — a vehicle under way, not
     one hanging still */
  const bob = Math.sin(T*0.7)*3 + Math.sin(T*7.3)*0.8;
  const cy  = h*0.52 + bob, cx = w*0.5 + sway*0.40 + Math.sin(T*5.1)*0.6;
  const L   = Math.min(h*0.30, 210);            /* nose to tail */
  const R   = L*0.17;                           /* hull radius */

  /* the lamps first, so the hull sits over them */
  g.save();
  g.globalCompositeOperation = 'lighter';
  const lampY = cy - L*0.06;
  const lamp = g.createLinearGradient(0, lampY, 0, h);
  lamp.addColorStop(0,'rgba(210,246,255,.46)');
  lamp.addColorStop(0.35,'rgba(150,215,248,.14)');
  lamp.addColorStop(1,'rgba(120,190,230,0)');
  g.fillStyle = lamp;
  g.beginPath();
  g.moveTo(cx - R*0.75, lampY); g.lineTo(cx + R*0.75, lampY);
  g.lineTo(cx + R*5.2, h);      g.lineTo(cx - R*5.2, h);
  g.closePath(); g.fill();
  g.restore();

  /* the hull: a capsule standing on end, domed at the bottom */
  const hullTop = cy - L*0.52, hullBot = cy + L*0.48;
  /* METALLIC WHITE, not green. The sub you actually drive is pale steel, and
     a title card that shows you a different vehicle is lying about the game.
     Five stops across the barrel: shadowed at both edges, a hot specular line
     just off centre where the surface light lands. */
  const hull = g.createLinearGradient(cx-R, 0, cx+R, 0);
  hull.addColorStop(0,   '#2c3d47');
  hull.addColorStop(0.22,'#7d949f');
  hull.addColorStop(0.44,'#e8f2f6');
  hull.addColorStop(0.62,'#aab9c2');
  hull.addColorStop(0.84,'#4d6069');
  hull.addColorStop(1,   '#22303a');
  g.fillStyle = hull;
  g.beginPath();
  g.moveTo(cx - R, hullTop + R*0.9);
  g.quadraticCurveTo(cx - R, hullTop, cx, hullTop);
  g.quadraticCurveTo(cx + R, hullTop, cx + R, hullTop + R*0.9);
  g.lineTo(cx + R, hullBot - R*1.1);
  g.quadraticCurveTo(cx + R, hullBot, cx, hullBot);
  g.quadraticCurveTo(cx - R, hullBot, cx - R, hullBot - R*1.1);
  g.closePath(); g.fill();

  /* the ribbed instrument bay, a band around the middle */
  g.fillStyle = 'rgba(18,28,34,.62)';
  g.fillRect(cx - R*0.92, cy - L*0.18, R*1.84, L*0.24);
  g.strokeStyle = 'rgba(205,225,235,.22)'; g.lineWidth = 1;
  for(let k=0;k<7;k++){
    const ry = cy - L*0.17 + k*(L*0.22/7);
    g.beginPath(); g.moveTo(cx - R*0.88, ry); g.lineTo(cx + R*0.88, ry); g.stroke();
  }

  /* the lamp cluster on the bay, throwing down-forward */
  for(const lx2 of [-0.34, 0.34]){
    g.fillStyle = '#eafcff';
    g.beginPath(); g.arc(cx + R*lx2, cy - L*0.02, R*0.13, 0, 6.2832); g.fill();
    g.save();
    g.globalCompositeOperation = 'lighter';
    /* Two haloes: a tight hot core and a wide soft one. The wide pass is what
       eats the hull around the lamps, which is the point — a working light at
       depth burns out whatever it is bolted to, and leaving the middle of the
       sub to the imagination is better than drawing every panel on it. */
    const core = g.createRadialGradient(cx+R*lx2, cy-L*0.02, 0, cx+R*lx2, cy-L*0.02, R*0.85);
    core.addColorStop(0,'rgba(255,255,255,.90)');
    core.addColorStop(1,'rgba(200,240,255,0)');
    g.fillStyle = core;
    g.beginPath(); g.arc(cx+R*lx2, cy-L*0.02, R*0.85, 0, 6.2832); g.fill();
    const wide = g.createRadialGradient(cx+R*lx2, cy-L*0.02, 0, cx+R*lx2, cy-L*0.02, R*2.6);
    wide.addColorStop(0,'rgba(190,235,255,.34)');
    wide.addColorStop(0.45,'rgba(160,215,250,.12)');
    wide.addColorStop(1,'rgba(150,205,245,0)');
    g.fillStyle = wide;
    g.beginPath(); g.arc(cx+R*lx2, cy-L*0.02, R*2.6, 0, 6.2832); g.fill();
    g.restore();
  }

  /* the sail on top, and the hatch ring */
  g.fillStyle = '#5a6c76';
  g.fillRect(cx - R*0.22, hullTop - L*0.10, R*0.44, L*0.11);
  g.fillStyle = 'rgba(235,246,252,.32)';
  g.fillRect(cx - R*0.22, hullTop - L*0.10, R*0.14, L*0.11);

  /* thruster pods on outriggers, low and wide */
  for(const sx2 of [-1, 1]){
    g.strokeStyle = '#3c4c56'; g.lineWidth = Math.max(1.4, R*0.13);
    g.beginPath();
    g.moveTo(cx + sx2*R*0.8, cy + L*0.24);
    g.lineTo(cx + sx2*R*1.9, cy + L*0.34);
    g.stroke();
    g.fillStyle = '#8fa2ad';
    g.beginPath();
    g.ellipse(cx + sx2*R*2.0, cy + L*0.35, R*0.30, R*0.22, 0, 0, 6.2832);
    g.fill();
    g.fillStyle = 'rgba(10,18,14,.7)';
    g.beginPath();
    g.ellipse(cx + sx2*R*2.0, cy + L*0.35, R*0.13, R*0.13, 0, 0, 6.2832);
    g.fill();
  }

  /* a lit edge down the side facing the surface */
  g.strokeStyle = 'rgba(226,242,252,.38)'; g.lineWidth = 1.4;
  g.beginPath();
  g.moveTo(cx - R*0.82, hullTop + R*0.8);
  g.lineTo(cx - R*0.82, hullBot - R*1.0);
  g.stroke();

  /* the bubble plume, leaving the sail and swelling as it rises */
  for(let i2=0;i2<16;i2++){
    const bt = ((T*0.95 + i2*0.062) % 1);
    const by = (hullTop - L*0.12) - bt*h*0.80;
    const bx2 = cx + Math.sin(bt*9 + i2)*R*0.9*bt;
    g.fillStyle = 'rgba(200,240,255,' + (0.40*(1-bt)) + ')';
    g.beginPath(); g.arc(bx2, by, 1.2 + bt*3.4, 0, 6.2832); g.fill();
    g.strokeStyle = 'rgba(230,250,255,' + (0.24*(1-bt)) + ')';
    g.lineWidth = 0.8;
    g.beginPath(); g.arc(bx2, by, 1.2 + bt*3.4, 0, 6.2832); g.stroke();
  }

  /* ---- pressure: the dark closing in at the edges ------------------------- */
  const vg = g.createRadialGradient(w*0.5, h*0.34, h*0.14, w*0.5, h*0.5, h*0.86);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.72)');
  g.fillStyle = vg; g.fillRect(0,0,w,h);

  /* ---- the name ----------------------------------------------------------- */
  const DG = {
    D:[[[0,0],[0,14]],[[0,0],[6,0],[9,3],[9,11],[6,14],[0,14]]],
    E:[[[9,0],[0,0],[0,14],[9,14]],[[0,7],[6,7]]],
    P:[[[0,14],[0,0],[6,0],[9,3],[9,6],[6,9],[0,9]]]
  };
  AR.wordmark(g, 'DEEP', w*0.5, h*0.20, Math.min(w*0.19, 84), {
    glyphs: DG, box: 8, gap: 0.30, maxW: w*0.68, rake: 0,
    passes: ['cut','plate','lip'],
    paint: (gg, pass) => {
      gg.lineCap = 'butt'; gg.lineJoin = 'miter'; gg.miterLimit = 2;
      if(pass === 'cut'){
        gg.strokeStyle = 'rgba(1,6,12,.95)'; gg.lineWidth = 6.4;
        gg.translate(0, 1.0);
      } else if(pass === 'plate'){
        gg.strokeStyle = '#5d7f92'; gg.lineWidth = 5.0;
      } else {
        /* the highlight BREATHES with the caustics overhead */
        const k = 0.6 + 0.4*Math.sin(T*0.9);
        gg.strokeStyle = 'rgba(198,236,255,' + (0.55 + 0.35*k) + ')';
        gg.lineWidth = 1.5;
        gg.translate(0, -1.4);
      }
    }
  });

  /* ---- REFRACTION --------------------------------------------------------
     Everything above is painted flat, then the whole картина is taken apart
     into horizontal bands and put back with each band shifted sideways by a
     travelling sine. That is what looking through moving water does, and it
     costs one drawImage per band rather than any per-pixel work.

     The amplitude falls off with depth, because the surface is what is
     disturbing the light and there is less of it further down.
     ------------------------------------------------------------------------ */
  if(!refCv){ refCv = document.createElement('canvas'); }
  if(refCv.width !== titleCv.width){ refCv.width = titleCv.width; refCv.height = titleCv.height; }
  const rg = refCv.getContext('2d');
  rg.setTransform(1,0,0,1,0,0);
  rg.clearRect(0,0,refCv.width,refCv.height);
  rg.drawImage(titleCv, 0, 0);

  g.setTransform(dpr,0,0,dpr,0,0);
  g.clearRect(0,0,w,h);
  const BAND = 4;
  for(let y=0; y<h; y+=BAND){
    const depth = 1 - y/h;
    /* 6.4px of swing at the top was smearing detail rather than shimmering
       it — the sub lost its ribs and outriggers. Half that reads as water. */
    const amp = (0.9 + 2.2*depth*depth);
    const dx = Math.sin(T*1.15 + y*0.045) * amp
             + Math.sin(T*0.61 + y*0.017) * amp*0.55;
    g.drawImage(refCv,
      0, y*dpr, refCv.width, BAND*dpr,
      dx, y,    w,           BAND);
  }

  if(document.body.classList.contains('titling'))
    requestAnimationFrame(drawTitleArt);
}

  titleT = 0;
  requestAnimationFrame(drawTitleArt);
  paintMenu(

    '<div id="panel"><h1>Deep</h1></div>' +

      '<button class="mbtn" data-act="play">PLAY</button>' +
      '<button class="mbtn ghost" data-act="opts">OPTIONS</button>' +

    '</div>' +
    '<div class="legal">\u00A9 2026 EFFIGY MEDIA</div>',

    '<div class="tmenu">' +

}

  ];

/* ---- the launch ---------------------------------------------------------
   You do not begin in the water. You begin hanging off a hook under a boat on
   the surface, swinging, with the swell moving under you — and PLAY releases
   the cable and drops you in. It costs three seconds and it tells the player
   where they are, which nothing else in the game does.
   -------------------------------------------------------------------------- */
let launchT = 0, launched = false, splashT = 0, swing = 0;

function start(){
  dives++;
  reset();
  menuOpen = false;
  state = 'launch';
  launchT = 0; launched = false; splashT = 0; swing = 0;
  document.body.classList.remove('titling');
  veil.classList.add('hidden');
  snd.surface();          /* wash and gulls; the deep comes later */
  snd.creak();
}

/* released: the hook lets go and gravity takes over */
function release(){
  if(state !== 'launch' || launched) return;
  launched = true;
  snd.release();
}

function beginDive(){
  state = 'diving';
  snd.submerge();        /* the surface goes */
  snd.begin();           /* and the drone and the bed come in under it */
  snd.dive();
}

function lose(){
  state = 'lost';
  menuOpen = false;
  snd.end(cause);
  deadAt = performance.now();
  shake = reduceMotion ? 0.25 : 1;
  flash = 1;
  for (let i=0;i<26;i++){
    const a = rand(0, Math.PI*2), s = rand(60, 420);
    bits.push({ x:px, y:playerY, vx:Math.cos(a)*s, vy:Math.sin(a)*s - 90,
                life:rand(.5,1.15), age:0, r:rand(1.5,4.5), c:'#dff5ef' });
  }
  const m = metres();
  best = Math.max(best, m);
  if (AR && AR.save) AR.save.merge('deep', {
    best: best, dives: dives, sparks: sparks,
    label: 'BEST ' + best + ' M'
  });
  showEnd(m);
}

function showEnd(m){
  eyebrow.textContent = 'Descent log — ' + String(dives).padStart(3,'0');
  panel.innerHTML =
    '<div class="final">'+(cause==='fish' ? 'Something took you at' : 'You struck a ledge at')+'</div>' +
    '<div class="big">' + m + '<u>m</u></div>' +
    '<div class="tally">' +
      '<div>Deepest<b>' + best + 'm</b></div>' +
      '<div class="amber">Sparks<b>' + sparks + '</b></div>' +
      '<div>Clean gaps<b>' + threads + '</b></div>' +
    '</div>';
  cue.textContent = 'Touch to dive again';
  setTimeout(() => { if (state === 'lost') veil.classList.remove('hidden'); }, 520);
}

function updateHud(){
  depthEl.innerHTML = metres() + '<small>m</small>';
  sparkEl.textContent = sparks;
}

/* ---------------------------------------------------------------- */
/*  Simulation                                                       */
/* ---------------------------------------------------------------- */
function step(dt){
  // keyboard steering folds into the same target
  let kd = 0;
  if (keys.ArrowLeft || keys.a || keys.A) kd -= 1;
  if (keys.ArrowRight|| keys.d || keys.D) kd += 1;
  const pax = AR && AR.pad ? AR.pad.axis().x : 0;
  if (pax) kd = pax;
  else if (AR && AR.pad){
    if (AR.pad.down('left'))  kd = -1;
    if (AR.pad.down('right')) kd =  1;
  }
  if (kd) targetX = clamp(targetX + kd * 880 * dt, R+8, W-R-8);

  // smooth follow, capped so it still feels like a body in water
  const k = 1 - Math.exp(-18 * dt);
  let move = (targetX - px) * k;
  const cap = 1150 * dt;
  move = clamp(move, -cap, cap);
  px += move;
  vxSmoothed = lerp(vxSmoothed, move/dt, 0.25);

  const t = difficulty();
  speed = speedAt(t);
  dist += speed * dt;

  // scroll + spawn
  const spacing = spacingAt(t);
  for (const o of obstacles){ o.y -= speed*dt; o.t += dt; }
  lastLedgeY -= speed*dt;   // the spawn cursor has to scroll with the water too
  for (const b of orbs){ b.y -= speed*dt; b.spin += dt*3; }
  while (lastLedgeY < H + spacing) spawnLedge(lastLedgeY + spacing);
  obstacles = obstacles.filter(o => o.y > -120);
  orbs = orbs.filter(o => o.y > -60 && !o.got);

  for (const f of fish){
    f.y -= speed*dt;
    f.x += f.vx*dt;
    if (f.x < f.rx + 8){ f.x = f.rx + 8; f.vx = Math.abs(f.vx); }
    if (f.x > W - f.rx - 8){ f.x = W - f.rx - 8; f.vx = -Math.abs(f.vx); }
    f.tail += dt * (6 + Math.abs(f.vx)*0.03);
    f.lure += dt*2.4;
  }
  fish = fish.filter(f => f.y > -80);

  // motes drift up with the current
  for (const m of motes){
    m.y -= speed * m.p * dt;
    if (m.y < -6){ m.y = H + rand(0,60); m.x = rand(0,W); }
  }

  // trail
  if (!reduceMotion && Math.random() < 0.9){
    bits.push({ x:px + rand(-4,4), y:playerY + rand(2,8),
                vx: -vxSmoothed*0.25 + rand(-30,30), vy: -speed*0.55 + rand(-40,40),
                life: rand(.28,.6), age:0, r: rand(1.2,3.4), c:'#4de0c8' });
  }
  for (const b of bits){ b.age += dt; b.x += b.vx*dt; b.y += b.vy*dt; b.vy += 120*dt; }
  bits = bits.filter(b => b.age < b.life);

  // orbs
  for (const b of orbs){
    if (b.got) continue;
    const dx = b.x-px, dy = b.y-playerY;
    if (dx*dx + dy*dy < (R+ORB_R+4)*(R+ORB_R+4)){
      b.got = true; sparks++;
      snd.spark(sparks);
      for (let i=0;i<9;i++){
        const a = rand(0,Math.PI*2), s = rand(40,190);
        bits.push({ x:b.x, y:b.y, vx:Math.cos(a)*s, vy:Math.sin(a)*s - speed*0.4,
                    life:rand(.25,.5), age:0, r:rand(1,3), c:'#ffb454' });
      }
    }
  }

  // ledges: scoring + collision
  for (const o of obstacles){
    const c = gapCenter(o);
    if (!o.passed && o.y + TH < playerY - R){
      o.passed = true;
      snd.pass();
      const off = Math.abs(px - c);
      if (off < 16){
        threads++; sparks += 3;
        snd.clean();
        toast = { text:'CLEAN', age:0 };
      }
    }
    if (o.y < playerY + R + TH && o.y + TH > playerY - R){
      const leftW  = c - o.gw/2;
      const rightX = c + o.gw/2;
      if (circleHitsRect(px, playerY, R, 0, o.y, leftW, TH) ||
          circleHitsRect(px, playerY, R, rightX, o.y, W-rightX, TH)){
        lose(); return;
      }
    }
  }

  for (const f of fish){
    const dx = (px - f.x) / (f.rx + R*0.72);
    const dy = (playerY - f.y) / (f.ry + R*0.72);
    if (dx*dx + dy*dy < 1){ cause = 'fish'; lose(); return; }
  }

  if (toast){ toast.age += dt; if (toast.age > 0.9) toast = null; }
  shake = Math.max(0, shake - dt*2.6);
  flash = Math.max(0, flash - dt*2.2);
  updateHud();
}

/* ---------------------------------------------------------------- */
/*  Render                                                           */
/* ---------------------------------------------------------------- */
function draw(now){
  const t = state === 'ready' ? 0 : difficulty();

  /* water column: the surface light drains away as you go down, and past the
     dark line there is none of it left — the column goes to flat black so the
     only things on screen are the ones making their own light */
  const dk = darkness();
  const dim = v => Math.round(v * (1 - dk));
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, `rgb(${dim(lerp(18,4,t))},${dim(lerp(49,10,t))},${dim(lerp(74,20,t))})`);
  g.addColorStop(0.55,`rgb(${dim(lerp(8,3,t))},${dim(lerp(21,6,t))},${dim(lerp(38,14,t))})`);
  g.addColorStop(1,   dk > 0.5 ? '#000000' : '#04070f');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);

  ctx.save();
  if (shake > 0){
    const s = shake*shake*13;
    ctx.translate(rand(-s,s), rand(-s,s));
  }

  // shafts of surface light, fading with depth and gone entirely in the black
  const lightAlpha = (1-t) * 0.16 * (1 - darkness());
  if (lightAlpha > 0.005){
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i=0;i<3;i++){
      const x = W*(0.2 + i*0.3) + Math.sin((now/3000)+i)*22;
      const lg = ctx.createLinearGradient(x, 0, x - 60, H*0.75);
      lg.addColorStop(0, `rgba(140,220,235,${lightAlpha})`);
      lg.addColorStop(1, 'rgba(140,220,235,0)');
      ctx.fillStyle = lg;
      ctx.beginPath();
      ctx.moveTo(x-36,0); ctx.lineTo(x+36,0);
      ctx.lineTo(x-30,H*0.8); ctx.lineTo(x-96,H*0.8);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }

  // drifting motes
  for (const m of motes){
    ctx.fillStyle = `rgba(190,225,225,${0.05 + m.p*0.16})`;
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, 6.2832); ctx.fill();
  }

  drawGauge();

  // ledges
  for (const o of obstacles){
    const c = gapCenter(o);
    const leftW  = Math.max(0, c - o.gw/2);
    const rightX = Math.min(W, c + o.gw/2);
    drawLedge(0, o.y, leftW, true);
    drawLedge(rightX, o.y, W-rightX, false);
  }

  drawFish();

  // sparks
  for (const b of orbs){
    if (b.got) continue;
    const pulse = 1 + Math.sin(b.spin)*0.12;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const rg = ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,ORB_R*3.4);
    rg.addColorStop(0,'rgba(255,180,84,.55)');
    rg.addColorStop(1,'rgba(255,180,84,0)');
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.arc(b.x,b.y,ORB_R*3.4,0,6.2832); ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#ffd9a0';
    ctx.beginPath(); ctx.arc(b.x,b.y,ORB_R*pulse,0,6.2832); ctx.fill();
    ctx.fillStyle = '#fff6e6';
    ctx.beginPath(); ctx.arc(b.x-2,b.y-2,ORB_R*0.42,0,6.2832); ctx.fill();
  }

  // particles
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const b of bits){
    const a = 1 - b.age/b.life;
    ctx.globalAlpha = a*a*0.8;
    ctx.fillStyle = b.c;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r*a, 0, 6.2832); ctx.fill();
  }
  ctx.restore();
  ctx.globalAlpha = 1;

  if (state === 'launch') drawLaunch(now);
  if (state !== 'lost') drawDiver(now);

  // clean-gap toast
  if (toast){
    const a = 1 - toast.age/0.9;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle = '#4de0c8';
    ctx.font = '500 15px "DM Mono", monospace';
    ctx.textAlign = 'center';
    ctx.letterSpacing && (ctx.letterSpacing = '4px');
    ctx.fillText('CLEAN  +3', px, playerY - 34 - (1-a)*26);
    ctx.restore();
  }

  ctx.restore();

  // impact flash + vignette
  if (flash > 0){
    ctx.fillStyle = `rgba(255,90,110,${flash*0.3})`;
    ctx.fillRect(0,0,W,H);
  }
  const vg = ctx.createRadialGradient(W/2,H*0.45,H*0.22,W/2,H*0.45,H*0.72);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(0,0,0,.55)');
  ctx.fillStyle = vg;
  ctx.fillRect(0,0,W,H);
}

function drawFish(){
  const dk = darkness();
  for (const f of fish){
    const dir = f.vx < 0 ? -1 : 1;
    const sway = Math.sin(f.tail)*0.16;
    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.scale(dir, 1);
    ctx.rotate(sway*0.25);

    /* Emissive parts keep their strength; everything lit from outside fades
       with the water. A shallow fish that has drifted down is nearly gone. */
    const lit = f.deep ? 1 : (1 - dk * 0.92);
    const glow = f.deep ? 0.34 : 0.22 * lit;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const h = ctx.createRadialGradient(0,0,0,0,0,f.rx*(f.deep ? 3.1 : 2.4));
    h.addColorStop(0, f.deep ? hexA(f.hue, glow) : 'rgba(150,120,220,.22)');
    h.addColorStop(1, f.deep ? hexA(f.hue, 0) : 'rgba(150,120,220,0)');
    ctx.fillStyle = h;
    ctx.beginPath(); ctx.arc(0,0,f.rx*(f.deep ? 3.1 : 2.4),0,6.2832); ctx.fill();
    ctx.restore();

    // tail
    ctx.globalAlpha = f.deep ? 1 : Math.max(0.06, lit);
    ctx.fillStyle = 'rgba(160,140,215,.75)';
    ctx.beginPath();
    ctx.moveTo(-f.rx*0.72, 0);
    ctx.lineTo(-f.rx*1.55, -f.ry*(1.0 + sway*2));
    ctx.quadraticCurveTo(-f.rx*1.15, 0, -f.rx*1.55, f.ry*(1.0 - sway*2));
    ctx.closePath(); ctx.fill();

    // body — in the black, the flesh is nearly invisible and the light is not
    const bg = ctx.createLinearGradient(0,-f.ry,0,f.ry);
    if(f.deep){
      bg.addColorStop(0, hexA(f.hue, 0.50));
      bg.addColorStop(0.55, hexA(f.hue, 0.22));
      bg.addColorStop(1, 'rgba(20,16,34,.85)');
    } else {
      bg.addColorStop(0,'#d8ccff');
      bg.addColorStop(0.55,'#9d88d6');
      bg.addColorStop(1,'#5b4a86');
    }
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.ellipse(0, 0, f.rx, f.ry, sway*0.5, 0, 6.2832); ctx.fill();

    // dorsal fin
    ctx.fillStyle = 'rgba(120,100,180,.8)';
    ctx.beginPath();
    ctx.moveTo(f.rx*0.10, -f.ry*0.85);
    ctx.lineTo(-f.rx*0.30, -f.ry*1.85);
    ctx.lineTo(-f.rx*0.55, -f.ry*0.80);
    ctx.closePath(); ctx.fill();

    // eye
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#1a1226';
    ctx.beginPath(); ctx.arc(f.rx*0.52, -f.ry*0.18, Math.max(1.6, f.ry*0.20), 0, 6.2832); ctx.fill();

    // lure, on the big deep ones
    if (f.big){
      const lx = f.rx*1.05, ly = -f.ry*1.5 + Math.sin(f.lure)*f.ry*0.3;
      ctx.strokeStyle = 'rgba(200,180,255,.5)'; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(f.rx*0.30, -f.ry*0.9);
      ctx.quadraticCurveTo(f.rx*0.9, -f.ry*2.0, lx, ly); ctx.stroke();
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const g = ctx.createRadialGradient(lx,ly,0,lx,ly,10);
      g.addColorStop(0,'rgba(255,214,140,.95)');
      g.addColorStop(1,'rgba(255,190,110,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(lx,ly,10,0,6.2832); ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }
}

/* the signature: a sounding line ruled down the left edge, scrolling with the water */
function drawGauge(){
  const step = 10 * UPM;                 // a tick every 10 m
  const off  = dist % step;
  ctx.save();
  ctx.font = '400 10px "DM Mono", monospace';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(77,224,200,.30)';
  ctx.strokeStyle = 'rgba(77,224,200,.22)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(11, 0); ctx.lineTo(11, H); ctx.stroke();

  // ticks mark the water still below you, so depth grows downward
  let y = playerY + (step - off);
  let m = (Math.floor(dist / step) + 1) * 10;
  while (y < H + step){
    const major = m % 50 === 0;
    ctx.globalAlpha = major ? 0.85 : 0.4;
    ctx.beginPath();
    ctx.moveTo(11, y); ctx.lineTo(major ? 26 : 19, y);
    ctx.stroke();
    if (major) ctx.fillText(m + '', 32, y);
    y += step; m += 10;
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawLedge(x, y, w, isLeft){
  if (w <= 0) return;
  const r = 10;
  const dk = darkness();
  /* In the black the rock itself is invisible — all you get is the crust on
     the lip. The obstacle stops being a shape and becomes two points of light
     you have to steer between. */
  ctx.save();
  ctx.globalAlpha = 1 - dk * 0.94;
  const rock = ctx.createLinearGradient(0, y, 0, y+TH);
  rock.addColorStop(0, '#243349');
  rock.addColorStop(1, '#101a28');
  ctx.fillStyle = rock;
  ctx.beginPath();
  if (isLeft){
    ctx.moveTo(x, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + TH - r);
    ctx.quadraticCurveTo(x + w, y + TH, x + w - r, y + TH);
    ctx.lineTo(x, y + TH);
  } else {
    ctx.moveTo(x + w, y);
    ctx.lineTo(x + r, y);
    ctx.quadraticCurveTo(x, y, x, y + r);
    ctx.lineTo(x, y + TH - r);
    ctx.quadraticCurveTo(x, y + TH, x + r, y + TH);
    ctx.lineTo(x + w, y + TH);
  }
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // bioluminescent crust on the lip you have to miss
  const ex = isLeft ? x + w : x;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const eg = ctx.createRadialGradient(ex, y+TH/2, 0, ex, y+TH/2, 46 + dk*22);
  eg.addColorStop(0, 'rgba(77,224,200,' + (0.34 + dk*0.44) + ')');
  eg.addColorStop(1, 'rgba(77,224,200,0)');
  ctx.fillStyle = eg;
  ctx.fillRect(ex-46, y-24, 92, TH+48);
  ctx.restore();

  ctx.strokeStyle = 'rgba(122,240,215,.7)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(ex, y + 3);
  ctx.lineTo(ex, y + TH - 3);
  ctx.stroke();

  ctx.fillStyle = 'rgba(150,200,215,.18)';
  ctx.fillRect(x, y, w, 1.5);

  /* ---- runner lights ------------------------------------------------------
     Not warning lamps but a CHASE — a pulse of light running along the ledge
     toward the opening, the way approach lighting does on a runway. Marking
     the hazard only tells you where you cannot go; a runner tells you where
     you can, and does it without a word of UI.
     -------------------------------------------------------------------------- */
  const step = 22;
  const n = Math.max(2, Math.floor(w / step));
  /* which end is the gap: the left ledge runs rightward, the right ledge left */
  const toward = isLeft ? 1 : -1;
  /* the pulse position travels 0 -> 1 along the run, and each obstacle is
     offset by its own depth so the whole course does not blink in unison */
  /* tied to how fast you are falling: at depth the course rushes past, and a
     runner still chasing at a fixed 1.7Hz reads as sluggish against it */
  const rate = 0.9 + (speed / 260) * 2.2;
  const cycle = ((performance.now()/1000) * rate + y * 0.004) % 1;

  for (let i = 0; i <= n; i++){
    const lx = x + (w / n) * i;
    /* f is 0 at the far end and 1 at the gap, whichever ledge this is */
    const f = toward > 0 ? i / n : 1 - i / n;
    /* distance from this lamp to the travelling pulse, wrapped, so the chase
       is continuous rather than restarting with a jump */
    let d = f - cycle;
    if (d < -0.5) d += 1;
    if (d >  0.5) d -= 1;
    const hit = Math.max(0, 1 - Math.abs(d) * 5.5);      /* a short bright head */
    /* a low ember so the line is readable between pulses, plus the runner */
    /* Darkness has to bite these too. At full dark the runner was the only
       thing on screen at full strength, so the red flooded a frame that is
       supposed to be almost black — it was washing the darkness out rather
       than reading as a light IN it. */
    const a = (0.16 + hit * 0.84) * (1 - dk * 0.45);

    const ly = y + TH*0.5;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const rad = 7 + hit * 13;
    const gl = ctx.createRadialGradient(lx, ly, 0, lx, ly, rad);
    gl.addColorStop(0, 'rgba(255,70,80,' + (a*0.8) + ')');
    gl.addColorStop(1, 'rgba(255,30,50,0)');
    ctx.fillStyle = gl;
    ctx.beginPath(); ctx.arc(lx, ly, rad, 0, 6.2832); ctx.fill();
    ctx.restore();

    /* the lamp: a small sphere, brighter and whiter as the pulse passes over */
    const bulb = ctx.createRadialGradient(lx-1, ly-1.2, 0, lx, ly, 3.6);
    bulb.addColorStop(0,    'rgba(255,' + Math.round(150+hit*105) + ',' +
                            Math.round(150+hit*105) + ',' + Math.min(1,a+0.2) + ')');
    bulb.addColorStop(0.45, 'rgba(255,64,74,' + Math.min(1, a+0.1) + ')');
    bulb.addColorStop(1,    'rgba(140,10,24,' + (a*0.85) + ')');
    ctx.fillStyle = bulb;
    ctx.beginPath(); ctx.arc(lx, ly, 2.6 + hit*1.4, 0, 6.2832); ctx.fill();
  }
}

/* the boat on the swell, the davit, the wire, and the sub hanging off it */
function drawLaunch(now){
  const t = swing;
  const roll = Math.sin(t*1.15) * 0.075;
  const heave = Math.sin(t*0.95) * H*0.012;
  const wl = WATERLINE + heave;

  /* sky above the line, so the surface reads as a surface */
  const sky = ctx.createLinearGradient(0,0,0,wl);
  sky.addColorStop(0,'#0b1a26'); sky.addColorStop(1,'#16394d');
  ctx.fillStyle = sky; ctx.fillRect(0,0,W,wl);

  /* the swell itself */
  ctx.beginPath();
  ctx.moveTo(0, wl+40);
  for(let x=0;x<=W;x+=8){
    const y = wl + Math.sin(x*0.022 + t*1.8)*5 + Math.sin(x*0.007 - t*1.1)*8;
    x ? ctx.lineTo(x,y) : ctx.moveTo(x,y);
  }
  ctx.lineTo(W, wl+60); ctx.lineTo(0, wl+60); ctx.closePath();
  ctx.fillStyle = 'rgba(20,70,92,.55)'; ctx.fill();
  ctx.strokeStyle = 'rgba(180,240,255,.35)'; ctx.lineWidth = 1.4;
  ctx.beginPath();
  for(let x=0;x<=W;x+=8){
    const y = wl + Math.sin(x*0.022 + t*1.8)*5 + Math.sin(x*0.007 - t*1.1)*8;
    x ? ctx.lineTo(x,y) : ctx.moveTo(x,y);
  }
  ctx.stroke();

  /* the boat, rolling on it */
  const bw = W*0.46, bh = H*0.045;
  ctx.save();
  /* The davit has to put the sub where it will be diving — dead centre —
     or it visibly slides across the screen the moment control is handed over.
     The boat is offset LEFT by exactly the davit reach so the wire hangs on
     the centre line. */
  ctx.translate(W*0.5 - bw*0.62, wl - H*0.012);
  ctx.rotate(roll);
  ctx.fillStyle = '#1d2b34';
  ctx.beginPath();
  ctx.moveTo(-bw/2, -bh); ctx.lineTo(bw/2, -bh);
  ctx.lineTo(bw/2 - bh*0.5, bh*0.6); ctx.lineTo(-bw/2 + bh*0.8, bh*0.6);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#33454f';
  ctx.fillRect(-bw*0.10, -bh*2.1, bw*0.30, bh*1.2);
  ctx.fillStyle = 'rgba(255,225,150,.75)';
  ctx.fillRect(-bw*0.04, -bh*1.85, bw*0.07, bh*0.45);
  ctx.fillStyle = 'rgba(255,255,255,.14)';
  ctx.fillRect(-bw/2, -bh, bw, 2);
  /* the davit arm reaching out over the water */
  ctx.strokeStyle = '#55636d'; ctx.lineWidth = 3.5;
  ctx.beginPath();
  ctx.moveTo(bw*0.24, -bh*0.6);
  ctx.lineTo(bw*0.24, -bh*3.4);
  ctx.lineTo(bw*0.62, -bh*3.4);
  ctx.stroke();
  ctx.restore();

  /* where the wire leaves the davit, in world space */
  const bx0 = W*0.5 - bw*0.62;
  const ax = bx0 + Math.cos(roll)*(bw*0.62) - Math.sin(roll)*(-bh*3.4);
  const ay = wl - H*0.012 + Math.sin(roll)*(bw*0.62) + Math.cos(roll)*(-bh*3.4);

  if(!launched){
    /* the sub swings a beat behind the boat, on a taut wire */
    const lag = Math.sin(t*1.15 - 0.55) * 0.13;
    px = ax + Math.sin(lag) * H*0.10;
    playerY = ay + Math.cos(lag) * H*0.10;
    ctx.strokeStyle = 'rgba(200,225,235,.7)'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(px, playerY); ctx.stroke();
    /* the hook */
    ctx.strokeStyle = '#9fb0bb'; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.arc(px, playerY - 9, 4.5, 0.4, 4.6); ctx.stroke();
  } else if(splashT === 0){
    /* falling: the wire whips back up */
    ctx.strokeStyle = 'rgba(200,225,235,.35)'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(ax, ay);
    ctx.lineTo(ax + Math.sin(t*9)*6, ay + H*0.05); ctx.stroke();
  }

  if(!launched){
    /* it will hang here all day, so say what to do */
    const pulse = 0.55 + Math.abs(Math.sin(swing*2.2))*0.45;
    ctx.save();
    ctx.textAlign = 'center';
    ctx.font = '600 ' + Math.round(H*0.017) + 'px ' +
               getComputedStyle(document.body).getPropertyValue('--px');
    ctx.fillStyle = 'rgba(210,240,255,' + pulse + ')';
    ctx.fillText(AR && AR.touch ? 'TAP TO RELEASE' : 'PRESS TO RELEASE',
                 W/2, H*0.80);
    ctx.restore();
  }

  if(splashT > 0){
    const q = Math.min(1, splashT/0.55);
    ctx.strokeStyle = 'rgba(210,245,255,' + (1-q) + ')';
    ctx.lineWidth = 2;
    for(let i=0;i<3;i++){
      ctx.beginPath();
      ctx.ellipse(px, WATERLINE, q*(30+i*22), q*(9+i*6), 0, 0, 6.2832);
      ctx.stroke();
    }
    for(let i=0;i<10;i++){
      const a = -Math.PI/2 + (i/9-0.5)*2.2;
      const d = q * (34 + (i%3)*16);
      ctx.fillStyle = 'rgba(220,248,255,' + (1-q)*0.9 + ')';
      ctx.fillRect(px + Math.cos(a)*d - 1, WATERLINE + Math.sin(a)*d*0.7 - 1, 2.4, 2.4);
    }
  }
}

function drawDiver(now){
  /* Nose into the turn. It used to bank away from the direction of travel,
     which read as being dragged sideways rather than cutting a line. */
  const tilt = -clamp(vxSmoothed/900, -1, 1);
  /* The halo is drawn BEFORE the tilt and in world space. It used to live
     inside the rotate, so banking sheared the pool of light into an ellipse —
     a lamp throws a round pool whichever way the hull is leaning. */
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const halo = ctx.createRadialGradient(px, playerY, 0, px, playerY, R*4.2);
  halo.addColorStop(0,'rgba(77,224,200,.42)');
  halo.addColorStop(1,'rgba(77,224,200,0)');
  ctx.fillStyle = halo;
  ctx.beginPath(); ctx.arc(px, playerY, R*4.2, 0, 6.2832); ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.translate(px, playerY);
  ctx.rotate(tilt * 0.42);

  // teardrop body, nose down
  ctx.fillStyle = '#eafff8';
  ctx.beginPath();
  ctx.moveTo(0, R*1.5);
  ctx.quadraticCurveTo(R*1.05, R*0.25, R*0.62, -R*0.85);
  ctx.quadraticCurveTo(0, -R*1.35, -R*0.62, -R*0.85);
  ctx.quadraticCurveTo(-R*1.05, R*0.25, 0, R*1.5);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = 'rgba(20,80,90,.55)';
  ctx.beginPath(); ctx.arc(0, -R*0.15, R*0.32, 0, 6.2832); ctx.fill();
  ctx.restore();
}

/* ---------------------------------------------------------------- */
/*  Loop — fixed-step physics so it plays the same on every screen   */
/* ---------------------------------------------------------------- */
const FIXED = 1/120;
function frame(now){
  if (lastTime === undefined) lastTime = now;
  let dt = Math.min(0.05, (now - lastTime)/1000);
  lastTime = now;

  if (state === 'launch'){
    launchT += dt;
    swing += dt;
    /* the boat rolls, and the sub on its wire swings a beat behind it */
    snd.swell(dt, swing);
    /* It used to cut loose on a timer. Now it hangs there, rolling with the
       swell, until YOU let it go — the run starts on your input, not on a
       stopwatch, so nobody arrives in the water still reading the screen. */
    if(launched){
      /* falls, then the water grabs it */
      playerY += (playerY < WATERLINE ? 640 : 190) * dt;
      if(playerY >= WATERLINE && splashT === 0){ splashT = 0.001; snd.splash2(); }
      if(splashT > 0){
        splashT += dt;
        if(splashT > 0.55) beginDive();
      }
    }
    for (const m of motes){
      m.y -= 60 * m.p * dt;
      if (m.y < -6){ m.y = H + rand(0,60); m.x = rand(0,W); }
    }
  } else if (state === 'diving'){
    acc += dt;
    let guard = 0;
    while (acc >= FIXED && state === 'diving' && guard++ < 8){
      step(FIXED);
      acc -= FIXED;
    }
  } else {
    // keep the water alive behind the panels
    for (const m of motes){
      m.y -= 60 * m.p * dt;
      if (m.y < -6){ m.y = H + rand(0,60); m.x = rand(0,W); }
    }
    for (const b of bits){ b.age += dt; b.x += b.vx*dt; b.y += b.vy*dt; b.vy += 120*dt; }
    bits = bits.filter(b => b.age < b.life);
    shake = Math.max(0, shake - dt*2.6);
    flash = Math.max(0, flash - dt*2.2);
  }

  draw(now);
  requestAnimationFrame(frame);
}

/* ---------------------------------------------------------------- */
resize();
reset();
showTitle();      /* the front door, rather than a tap-anywhere panel */
requestAnimationFrame(frame);
})();
</script>

/* only a device with a coarse pointer gets the portrait lock — a desktop
   window is free to be any shape, and wide is the better shape there */
(function(){
  if(matchMedia('(pointer:coarse)').matches) document.body.classList.add('lock-portrait');
  /* an installed app can genuinely lock; a tab cannot, and throwing is fine */
  try{ if(screen.orientation && screen.orientation.lock)
        screen.orientation.lock('portrait').catch(function(){}); }catch(e){}
})();
</script>
