<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#120a24">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Raceway</title>
  <meta name="arcade-home" content="../../index.html#sw">
  <meta name="arcade-title" content="Highway">
<meta name="arcade-accent" content="#ff8a3d">
<script src="../../audio.js"></script>
<script src="../../arcade.js"></script>
<script src="../../road.js"></script>
<style>
/* Self-hosted — no network call at launch, so a wrapped native build
   and the offline PWA both render correctly. Generated by fonts.py.
   Variable families ship whole with a weight RANGE: instancing each
   weight separately produced files the browser silently refused. */
@font-face{font-family:"Saira Condensed";font-style:normal;font-weight:600;font-display:swap;src:url("../../fonts/sairacondensed-600.woff2") format("woff2")}
@font-face{font-family:"Saira Condensed";font-style:normal;font-weight:800;font-display:swap;src:url("../../fonts/sairacondensed-800.woff2") format("woff2")}
@font-face{font-family:"Archivo";font-style:normal;font-weight:100 900;font-display:swap;src:url("../../fonts/archivo-var.woff2") format("woff2")}

:root{
  --sodium:#ff8a3d;
  --pale:#ffeede;
  --dim:rgba(255,238,222,.5);
  --red:#ff3355;
  --blue:#4d8cff;
  --cyan:#5ff0d8;
  --disp:"Saira Condensed","Arial Narrow",sans-serif;
  --lab:"Archivo","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{
  height:100%;width:100%;position:fixed;overflow:hidden;background:#08050f;
  color:var(--pale);font-family:var(--lab);
  overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;
}
#stage{position:absolute;inset:0;display:grid;place-items:center}
#frame{
  position:relative;overflow:hidden;background:#08050f;
  width:min(100dvw, calc(var(--stage-h, 100dvh) * 0.70));height:var(--stage-h, 100dvh);
}
canvas{display:block;width:100%;height:100%;touch-action:none}

/* ------------ HUD ------------ */
#hud{position:absolute;inset:0;pointer-events:none;z-index:10;
  padding:calc(var(--safe-top, env(safe-area-inset-top,0px)) + 12px) 14px calc(env(safe-area-inset-bottom,0px) + 14px);
  display:flex;flex-direction:column;justify-content:space-between}
.toprow{ padding-top:58px; /* clear of the rear-view mirror */ display:flex;justify-content:space-between;align-items:flex-start}
.stat span{display:block;font-size:8.5px;font-weight:700;letter-spacing:.22em;color:var(--dim)}
.stat b{font-family:var(--disp);font-weight:800;font-size:26px;line-height:1.05;
  font-variant-numeric:tabular-nums;letter-spacing:.01em}
.stat i{font-style:normal;font-size:11px;font-weight:600;color:var(--dim);margin-left:2px}
.stat.r{text-align:right}
.stat.c{text-align:center;flex:0 0 auto}
/* the clock is the loudest thing in the HUD, because it is the thing that
   ends the run */
#clockWrap b{font-size:30px;color:#ffb347;letter-spacing:.02em;
  text-shadow:0 0 18px rgba(255,179,71,.55)}
#clockWrap.low b{color:#ff5a4a;text-shadow:0 0 22px rgba(255,90,74,.75)}

#pursuit{
  width:fit-content;margin:10px auto 0;font-size:9.5px;font-weight:700;letter-spacing:.28em;
  padding:5px 12px;border:1px solid var(--red);color:#fff;background:rgba(255,51,85,.16);
  opacity:0;transition:opacity .2s;
}
#pursuit.on{opacity:1;animation:bl .7s steps(2) infinite}
@keyframes bl{0%,100%{border-color:var(--red);background:rgba(255,51,85,.16)}
              50%{border-color:var(--blue);background:rgba(77,140,255,.16)}}

#warn{
  position:absolute;left:0;right:0;top:38%;text-align:center;
  font-family:var(--disp);font-weight:800;font-size:clamp(20px,6.4vw,30px);letter-spacing:.12em;
  color:#fff;text-shadow:0 0 18px var(--red),0 2px 0 #7a0d20;opacity:0;
}
#warn.on{animation:wn 1.9s ease-out 1}
@keyframes wn{0%{opacity:0;transform:scale(1.3)}12%{opacity:1;transform:scale(1)}
              70%{opacity:1}100%{opacity:0}}

.botrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.speedo{display:flex;align-items:baseline;gap:5px}
.speedo b{font-family:var(--disp);font-weight:800;font-size:clamp(46px,15vw,68px);
  line-height:.8;font-variant-numeric:tabular-nums;text-shadow:0 0 26px rgba(255,138,61,.45)}
.speedo span{font-size:9px;font-weight:700;letter-spacing:.2em;color:var(--dim);padding-bottom:4px}
.bars{flex:1;max-width:140px;display:flex;flex-direction:column;gap:5px;margin-bottom:6px}
.bar{display:flex;align-items:center;gap:6px}
.bar em{font-style:normal;font-size:8px;font-weight:700;letter-spacing:.16em;color:var(--dim);width:26px}
.trk{flex:1;height:7px;background:rgba(255,238,222,.10);position:relative;overflow:hidden;
  transform:skewX(-18deg)}
.trk i{position:absolute;inset:0;width:0;display:block;transition:width .12s linear}
#dmgFill{background:linear-gradient(90deg,#7a2233,var(--red))}
#nosFill{background:linear-gradient(90deg,#1d6e73,var(--cyan))}

/* Both controls under one thumb on a steep diagonal: BRAKE low and outboard
   where the thumb rests, NOS above and inboard so it takes a deliberate reach.
   `body.pedals-left` mirrors the pair. */
/* ---- the pedal box ------------------------------------------------------
   Brake and accelerator side by side as actual pedals, hinged at the top and
   tilting when pressed. The nitrous is a bottle lying on its side ABOVE the
   accelerator, because pressing it means gas AND nitrous at once.
   -------------------------------------------------------------------------- */
/* The whole cluster was 150x186 with 62x122 pedals — it covered the player's
   own car and ran off the bottom of the screen. Everything is about 70% of
   what it was, tucked into the corner, and nothing overlaps anything else. */
#pedals{
  position:absolute;z-index:12;pointer-events:none;
  transform-origin:100% 100%;
  transform:scale(var(--ark-ui,1));
  right:calc(env(safe-area-inset-right,0px) + 10px);
  bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  width:104px;height:126px;
}
#pedals button{
  position:absolute;pointer-events:auto;padding:0;border:0;background:none;
  -webkit-tap-highlight-color:transparent;
}
/* the two pedals: rubber pads on a steel arm, tilting on press */
#gas, #brake{
  bottom:0;width:46px;height:84px;
  perspective:170px;
}
#brake{ left:0 }
#gas{ right:0 }
#gas i, #brake i{
  display:block;width:100%;height:100%;border-radius:7px 7px 5px 5px;
  transform-origin:50% 0%;
  transition:transform .07s ease-out, filter .07s ease-out;
  background:
    repeating-linear-gradient(to bottom,
      rgba(255,255,255,.10) 0 3px, rgba(0,0,0,.22) 3px 7px),
    linear-gradient(to bottom, #3a3f47 0%, #23262c 55%, #15171b 100%);
  box-shadow:
    inset 0 2px 0 rgba(255,255,255,.22),
    inset 0 -6px 10px rgba(0,0,0,.6),
    0 5px 0 #0c0d10, 0 10px 16px -6px #000;
  border:1px solid #4a505a;
}
#brake i{ border-color:#6b3436; box-shadow:inset 0 2px 0 rgba(255,150,150,.22),
  inset 0 -6px 10px rgba(0,0,0,.6), 0 5px 0 #2a0e10, 0 10px 16px -6px #000 }
#gas i{ border-color:#3f5f42; box-shadow:inset 0 2px 0 rgba(170,255,180,.20),
  inset 0 -6px 10px rgba(0,0,0,.6), 0 5px 0 #0e2412, 0 10px 16px -6px #000 }
/* pressed: the pad rotates away and drops onto its stop */
#gas.on i, #brake.on i{ transform:rotateX(26deg) translateY(4px); filter:brightness(1.5) }
#brake.on i{ filter:brightness(1.35) saturate(1.5) }

/* the nitrous bottle, lying on its side over the accelerator */
/* a car with no bottle shows no bottle — the LORRY and the CAB had a nitrous
   button and a gauge they could never use */
body.nonos #nitro, body.nonos #nosWrap{ display:none !important }
#nitro{
  /* The dials and the gate were landing on top of it. 92px cleared the pedals
     but nothing above, so it needed the gap raising — not by much, or it
     drifts away from the thumb that presses it. */
  right:0;bottom:84px;width:72px;height:30px;
}

#nitro i{
  display:block;width:100%;height:100%;position:relative;overflow:hidden;
  /* The DOMED BASE is on the right and the tapered shoulder on the left,
     because that is the end the valve screws into — the nozzle was on the
     base, which is the one place a bottle has no opening at all. */
  border-radius:7px 16px 16px 7px;
  /* The bottle IS the gauge now — the old #nosFill bar sat under the pedals
     where nothing could see it. --nos is set every frame; the charge fills
     from the neck end and the empty part reads as dark glass. */
  background:
    /* drains from the valve end, so the charge you have left sits against the
       base — which is the way round a real bottle empties */
    linear-gradient(to right,
      rgba(8,30,32,.92) 0%,
      rgba(8,30,32,.92) calc(100% - var(--nos,40%)),
      transparent      calc(100% - var(--nos,40%))),
    linear-gradient(to bottom,#7ef0dc 0%,#2fbcae 42%,#0e5f60 100%);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.45), inset 0 -6px 10px rgba(0,0,0,.45),
             0 4px 12px -3px #000;
  border:1px solid rgba(140,255,238,.5);
}
/* The neck, valve and NOZZLE. It was a plain block on the end — a bottle needs
   somewhere for the gas to actually leave, so this is a brass valve body with a
   tapered nozzle tip beyond it. */
/* The brass valve body, on the NECK end. It lives on the BUTTON, not on the
   bottle: `#nitro i` carries `overflow:hidden` for the charge fill, which was
   clipping its own pseudo-element clean off. */
#nitro::before{
  content:"";position:absolute;left:-11px;top:50%;transform:translateY(-50%);
  width:13px;height:14px;border-radius:1px 2px 2px 1px;
  background:linear-gradient(to bottom,#e2c98a,#a8843c 55%,#5f4718);
  box-shadow:inset 0 1px 0 rgba(255,240,200,.7), -1px 0 0 rgba(0,0,0,.35);
  z-index:1;
}
#nitro.on::before{ filter:brightness(1.45) }
/* the tip: a short taper past the valve, with a dark bore down the middle */
/* the tapered outlet, beyond the valve and pointing away from the bottle */
#nitro::after{
  content:"";position:absolute;left:-20px;top:50%;
  transform:translateY(-50%);
  width:9px;height:7px;
  background:linear-gradient(to bottom,#d8d2c4,#8a8f98 55%,#41464e);
  clip-path:polygon(100% 0, 0 22%, 0 78%, 100% 100%);
}
#nitro.on::after{ filter:brightness(1.5) }
/* a strap band across the middle, so it reads as a bottle not a pill */
/* the label, as on the real bottle */
#nitro b{
  position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
  text-align:center;pointer-events:none;z-index:2;
  font-family:var(--disp);font-size:9px;font-weight:800;
  letter-spacing:.16em;color:#eafffb;
  text-shadow:0 1px 0 rgba(0,0,0,.55), 0 0 6px rgba(120,255,235,.45);
}
#nitro i::before{
  content:"";position:absolute;left:52%;top:-1px;width:9px;height:calc(100% + 2px);
  background:rgba(10,40,42,.55);border-left:1px solid rgba(160,255,240,.30);
  border-right:1px solid rgba(160,255,240,.30);
}
/* the horn: a chrome boss on the wheel, left of the pedals */
#horn{
  left:-46px;bottom:4px;width:40px;height:40px;
}

/* A POST HORN, drawn from the reference: the bell is a flat vertical mouth on
   the left, the tube sweeps away to the right and narrows, and the coiled loop
   hangs below it as an open ellipse. Nothing about it can be mistaken for a
   speaker, because a speaker has no loop. */
#horn i::after{
  content:"";position:absolute;inset:16%;
  background:rgba(24,28,34,.84);
  -webkit-mask:var(--hornmark) center/contain no-repeat;
          mask:var(--hornmark) center/contain no-repeat;
}
/* The chrome disc itself. My CSS tidy kept the LAST `#horn i` block — which
   only carried the mask variable — and dropped the one with the metal in it,
   so the button was still there and hit-testable but had nothing to see. */
#horn i{
  display:block;width:100%;height:100%;position:relative;border-radius:50%;
  background:
    radial-gradient(circle at 34% 28%, #ffffff 0%, #dfe4ec 22%, #9aa3b0 55%, #5c636e 82%, #3a4049 100%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.85),
    inset 0 -2px 3px rgba(0,0,0,.45),
    0 2px 5px rgba(0,0,0,.55);
  --hornmark:url('data:image/svg+xml;utf8,\
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">\
<rect x="3.4" y="6.2" width="2.6" height="19.6" rx="0.5"/>\
<path d="M6.0 7.2c0.9 3.9 4.4 5.9 10.1 6.8 4.4 0.7 8.4 0.9 11.6 0.7 0.5-0.03 0.9 0.25 1.0 0.6l0-1.1c0-0.5 0.4-0.9 0.9-0.9v5.0c-0.5 0-0.9-0.4-0.9-0.9l0-1.0c-0.15 0.35-0.5 0.6-0.95 0.6-1.5-0.05-3.1-0.02-4.8 0.1l0-2.4c-3.0 0.15-6.6-0.05-10.6-0.7C7.6 12.7 4.6 10.6 3.4 6.9z"/>\
<path d="M6.0 24.8c0.75-3.2 3.3-5.1 7.4-6.1l0 2.5c-3.1 0.8-5.0 2.2-5.6 4.6z"/>\
<path d="M17.4 17.6c4.6 0 8.3 1.9 8.3 4.3s-3.7 4.3-8.3 4.3-8.3-1.9-8.3-4.3 3.7-4.3 8.3-4.3zm0 1.9c-3.4 0-6.1 1.1-6.1 2.4s2.7 2.4 6.1 2.4 6.1-1.1 6.1-2.4-2.7-2.4-6.1-2.4z"/>\
</svg>');
}
#horn.on i{ filter:brightness(1.35); transform:translateY(2px) }
body.pedals-left #horn{ left:auto; right:-58px }

#nitro:disabled{opacity:.32;filter:grayscale(.5)}
#nitro.on i{ filter:brightness(1.5); box-shadow:inset 0 3px 0 rgba(255,255,255,.6),
  0 0 22px rgba(95,240,216,.7), 0 4px 12px -3px #000 }

/* Left-handed moves the CLUSTER, it does not mirror the pedals. Accelerator is
   the right pedal and brake is the left pedal in every car ever built, so
   swapping them for a left-handed player is exactly wrong. Only the bottle,
   the horn and the box position move. */
body.pedals-left #pedals{ right:auto; left:calc(env(safe-area-inset-left,0px) + 10px) }
body.pedals-left #nitro{ right:auto; left:0 }

/* no touch, no pedals — a desktop showing them looks broken */
/* Desktop has a keyboard, so the thumb controls are dead weight and look
   broken. The GAUGES stay — they are instruments, not controls — and the
   dials drop to the bottom of the cluster since there is nothing beneath
   them any more. */
/* Hide the CONTROLS, not the container. `#pedals` is the bottle's parent, so
   hiding the box took the gauge with it and it measured zero on desktop. */
body.no-touch #gas,
body.no-touch #brake,
body.no-touch #horn,
body.no-touch #shifter{ display:none }
body.no-touch #pedals{ pointer-events:none }
/* The bottle is a GAUGE as much as a button — it is the nitrous level — so it
   stays on desktop, just not as something you press. */
body.no-touch #nitro{
  display:block;pointer-events:none;
  right:calc(env(safe-area-inset-right,0px) + 8px);
  bottom:calc(env(safe-area-inset-bottom,0px) + 86px * var(--ark-ui,1));
  left:auto;
}

body.no-touch #dials,
body.no-touch.manual /* ---- the wheel ----------------------------------------------------------
   Bottom-left, opposite the pedals. It ROTATES with the car and it FOLLOWS the
   thumb: press anywhere in its quadrant and the wheel re-centres under your
   finger, so you never have to find it. Steering is by how far you drag from
   where you first pressed, which means the grab point is wherever you happen
   to land rather than a fixed hit target.
   -------------------------------------------------------------------------- */

/* Every touch control follows the same rule, not just the wheel: with a
   keyboard or a pad in use the whole thumb cluster is clutter over the road. */
body.wheeling #wheel{ opacity:1 }
body.no-touch #wheel,
body.hardware #wheel,
body.hardware #gas,
body.hardware #brake,
body.hardware #horn,

/* ---- the shifter ---------------------------------------------------------
   A six-speed H-gate: two rails with three positions each, and reverse below.
   The knob is dragged between them. It sits above the pedals so the same
   thumb can reach it without leaving the wheel hand.
   -------------------------------------------------------------------------- */
/* ---- the instrument binnacle -------------------------------------------
   Two round dials side by side: revs on the left, road speed on the right,
   the way they sit in a car. The linear bar and the separate MPH text were
   two different idioms doing the same job in two different places.
   -------------------------------------------------------------------------- */
/* The cluster stacks bottom-up: pedals, bottle, then the shifter ONLY when the
   manual box is on, then the dials. The dials used to sit at a fixed height and
   the shifter was drawn over them; each now takes its place in the stack and
   the dials drop back down when there is no shifter to clear. */
/* ---- the wheel ----------------------------------------------------------
   Bottom-left, opposite the pedals. It ROTATES with the car and it FOLLOWS the
   thumb: press anywhere in its quadrant and the wheel re-centres under your
   finger, so you never have to find it. Steering is by how far you drag from
   where you first pressed, which means the grab point is wherever you happen
   to land rather than a fixed hit target.
   -------------------------------------------------------------------------- */

/* Every touch control follows the same rule, not just the wheel: with a
   keyboard or a pad in use the whole thumb cluster is clutter over the road. */
body.wheeling #wheel{ opacity:1 }
body.no-touch #wheel,
body.hardware #wheel,
body.hardware #gas,
body.hardware #brake,
body.hardware #horn,

#dials{
  position:absolute;z-index:13;pointer-events:none;
  transform-origin:100% 100%;
  transform:scale(var(--ark-ui,1));
  right:calc(env(safe-area-inset-right,0px) + 8px);
  /* THE OFFSETS HAVE TO LIVE IN THE SAME SCALED SPACE. The bottle sits inside
     #pedals and is scaled by --ark-ui, so ITS distance off the bottom grows
     with the scale — while these were fixed pixels. At any scale above 1 the
     bottle rose into the dials and they covered a third of it. Multiplying the
     offsets by the same variable keeps the stack together at every size. */
  bottom:calc(env(safe-area-inset-bottom,0px) + 132px * var(--ark-ui,1));
  width:115px;height:59px;
  transition:bottom .18s ease-out;
}
body.manual #dials{
  bottom:calc(env(safe-area-inset-bottom,0px) + 240px * var(--ark-ui,1));
}
/* ---- the wheel ----------------------------------------------------------
   Bottom-left, opposite the pedals. It ROTATES with the car and it FOLLOWS the
   thumb: press anywhere in its quadrant and the wheel re-centres under your
   finger, so you never have to find it. Steering is by how far you drag from
   where you first pressed, which means the grab point is wherever you happen
   to land rather than a fixed hit target.
   -------------------------------------------------------------------------- */

/* Every touch control follows the same rule, not just the wheel: with a
   keyboard or a pad in use the whole thumb cluster is clutter over the road. */
body.wheeling #wheel{ opacity:1 }
body.no-touch #wheel,
body.hardware #wheel,
body.hardware #gas,
body.hardware #brake,
body.hardware #horn,

#dials canvas{width:115px;height:59px;display:block}

/* ---- the wheel ----------------------------------------------------------
   Bottom-left, opposite the pedals. It ROTATES with the car and it FOLLOWS the
   thumb: press anywhere in its quadrant and the wheel re-centres under your
   finger, so you never have to find it. Steering is by how far you drag from
   where you first pressed, which means the grab point is wherever you happen
   to land rather than a fixed hit target.
   -------------------------------------------------------------------------- */
#wheel{
  /* Invisible until a thumb arrives. It has no business sitting in the corner
     of the road when nobody is holding it — it fades in on the first touch and
     back out when you let go. */
  opacity:0;
  transition:opacity .16s ease-out, left .10s ease-out, bottom .10s ease-out;
  position:absolute;z-index:12;
  left:calc(env(safe-area-inset-left,0px) + 10px);
  bottom:calc(env(safe-area-inset-bottom,0px) + 8px);
  width:115px;height:115px;
  touch-action:none;
  transition:left .10s ease-out, bottom .10s ease-out;
}
/* Every touch control follows the same rule, not just the wheel: with a
   keyboard or a pad in use the whole thumb cluster is clutter over the road. */
body.wheeling #wheel{ opacity:1 }
body.no-touch #wheel,
body.hardware #wheel,
body.hardware #gas,
body.hardware #brake,
body.hardware #horn,
body.hardware #shifter{ display:none }
body.hardware #pedals{ pointer-events:none }

/* This lost its `body.pedals-left` prefix in an earlier edit, so the LEFT-HANDED
   rule applied to everyone and the dials sat on the left for every player. */
body.pedals-left #dials{ right:auto; left:calc(env(safe-area-inset-left,0px) + 8px) }
/* and the wheel swaps to the other corner with them */
body.pedals-left #wheel{ left:auto; right:calc(env(safe-area-inset-right,0px) + 10px) }
#tachoOLD{
  position:absolute;z-index:13;display:none;
  border-radius:5px;background:#0d0f13;border:1px solid #333941;
  box-shadow:inset 0 2px 4px rgba(0,0,0,.8);
  overflow:hidden;
}
#tacho i{
  position:absolute;left:2px;top:2px;bottom:2px;width:2px;border-radius:2px;
  background:#5ff0d8;
  box-shadow:0 0 7px rgba(95,240,216,.85);
  transform:translateX(var(--rev,0px));
  transition:transform .05s linear;
}
/* the last fifth is the red zone, painted on the plate itself */
#tacho::after{
  content:"";position:absolute;right:2px;top:2px;bottom:2px;width:18%;
  background:repeating-linear-gradient(115deg,
    rgba(255,60,80,.30) 0 3px, rgba(255,60,80,.10) 3px 6px);
  border-left:1px solid rgba(255,60,80,.5);
}
#tacho b{
  position:absolute;left:5px;top:50%;transform:translateY(-50%);
  font-family:var(--disp);font-size:9px;font-weight:800;color:#5c6570;
  letter-spacing:.06em;
}
#tacho.red i{ background:#ff3b5c; box-shadow:0 0 9px rgba(255,59,92,.9) }
#tacho.red b{ color:#ff8fa0 }

#shifter{
  position:absolute;z-index:13;pointer-events:auto;
  transform-origin:100% 100%;
  transform:scale(var(--ark-ui,1));
  right:calc(env(safe-area-inset-right,0px) + 10px);
  bottom:calc(env(safe-area-inset-bottom,0px) + 132px * var(--ark-ui,1));
  width:86px;height:94px;touch-action:none;
}
#shifter[hidden]{ display:none }

/* ---- THE PADDLES -------------------------------------------------------
   A formula car has no gate and no knob to move through one — it has two
   paddles behind the wheel and a number between them. Same corner, same
   scale, so the thumb goes where it already went. */
#paddles{
  position:absolute;z-index:13;pointer-events:auto;
  transform-origin:100% 100%;
  transform:scale(var(--ark-ui,1));

/* ------------ overlay ------------ */

/* ONE ROW, always. Twelve fixed-width circles at any gap will wrap on a
   narrow phone, so they are sized as a FRACTION of the row instead: a grid of
   twelve equal columns that shrinks with the screen rather than spilling. */
/* ---- A SWATCH IS A SWATCH -----------------------------------------------
   `repeat(var(--sw), 1fr)` divided the row by the NUMBER of colours, so the
   cruiser's two filled half the width each — two dinner plates where every
   other car has a row of buttons.

   The track width is fixed to a twelfth of the row instead, and the grid is
   centred. Two swatches are then the same size as twelve, sitting in the
   middle, and nothing has to know how many there are.
   ------------------------------------------------------------------------ */
.swatches{display:grid;
  grid-template-columns:repeat(var(--sw,12), calc((100% - 11*4px)/12));
  justify-content:center;gap:4px;
  align-items:center;margin:12px 0 4px}

/* ---------------------------------------------------------------------------
   PORTRAIT ON A PHONE, WIDE ON A DESKTOP

   The manifest pins the INSTALLED app to portrait, but a browser tab cannot be
   forced — `screen.orientation.lock()` only works from fullscreen and throws
   everywhere else. So: on a touch device held sideways, a panel asks for it
   back. On a desktop there is no such thing as the wrong orientation, and a
   wide window is exactly what we want, so the panel never appears there.

   The test is POINTER TYPE, not width. A landscape phone and a small laptop
   window are the same number of pixels and want opposite things.
   --------------------------------------------------------------------------- */
#rotate{

  /* ---- THE TITLE SITS AT THE BOTTOM ------------------------------------
     `align-items` places an item within its ROW; `align-content` places the

<div id="stage"><div id="frame">
  <canvas id="cv"></canvas>

        <div class="stat c" id="placeWrap" hidden><span>PLACE</span><b id="place">12/12</b></div>

    </div>

      <div class="bars">
        <!-- The two bars lived down here under the pedals, where the controls
             covered them. Damage is smoke off the bonnet now and nitrous is the
             fill in the bottle, so both read where you are already looking. -->

    </div>

  </div>
  <!-- a formula car does not have a gate: two paddles and a number -->
  <!-- no gear number between them: the tacho already shows the gear, and a
       formula wheel has paddles, not a readout -->
  <div id="paddles" hidden>
    <button id="padDown" type="button">−</button>
    <button id="padUp" type="button">+</button>
  </div>

<div id="veil"><div class="vw" id="veilBody"></div></div>

<script>
/* ---- RACEWAY --------------------------------------------------------------
   Everything this game shares with Highway is in road.js. What is left here is
   only what makes it a CIRCUIT racer: a finite road that wraps, lap counting,
   and the minimap. 300 lines against the engine's 8,400.

   The engine is handed five callbacks and asks for them at its own seams. It
   has no idea what a lap is.
   --------------------------------------------------------------------------- */
let circuit = null, lap = 0, lapsTotal = 5, lapStart = 0,
    bestLap = 0, lastLap = 0, league = 'sports';
/* ---- THE ENGINE HANDS ITSELF IN ---------------------------------------
   Capturing the RETURN value is too late: `onReset` fires during setup, before
   ROAD() has returned anything. The engine writes its surface onto the config
   object as `CFG.api` on its first line, so this object is live from the
   moment the first seam runs. */
const CFG = { id:'raceway', title:'Raceway' };
const R = new Proxy({}, { get: (_, k) => CFG.api && CFG.api[k] });

/* ===========================================================================
   THE CIRCUIT

   Highway's road is INFINITE: `pushCurve` adds segments at the front and old
   ones are shifted off the back. A circuit is the same generator with one
   difference — it is FINITE and it wraps. Build N segments once, then answer
   "what is the curvature at z" with `z % trackLength`.

   Everything downstream keeps working untouched, because nothing else asks
   how long the road is: `curvatureAt`, the bend integration, the skyline
   parallax and the hills all just want a number for a given z.

   A lap is therefore `pos / trackLength`, and that is the whole system.
   =========================================================================== */

/* ---- A CIRCUIT HAS TO BE A REAL SHAPE ------------------------------------
   The first generator strung a straight and a turn together N times and hoped.
   It made spikes, hairpin chains and tracks that crossed themselves four
   times \u2014 then FORCED them closed by spreading the error over every corner,
   which quietly bent every turn away from what it had chosen.

   Generate and TEST instead. A candidate is kept only if it is a shape a
   circuit could be:

     1. it turns through 360 degrees, ONCE     a lap goes round, not to and fro
     2. it returns to its start                within 8% of the track's size
     3. it does not cross itself               we have no bridge
     4. it is not a splinter                   aspect ratio under 2.6:1

   Up to 400 candidates; the best-scoring is kept even if none passes
   outright, so it always returns a track and usually a good one.
   ------------------------------------------------------------------------- */
function circuitShape(segs){
  const STEP = 300;
  const pts = [];
  let ang = 0, x = 0, y = 0, z = 0, len = 0;
  for(const g of segs) len += g.len;
  while(z < len){
    ang += R.segAt(segs, z) * 0.00028 * STEP;
    x += Math.sin(ang) * STEP;
    y += Math.cos(ang) * STEP;
    pts.push([x, y]);
    z += STEP;
  }
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  for(const q of pts){ if(q[0]<x0)x0=q[0]; if(q[0]>x1)x1=q[0];
                       if(q[1]<y0)y0=q[1]; if(q[1]>y1)y1=q[1]; }
  const w = Math.max(1,x1-x0), h = Math.max(1,y1-y0), size = Math.max(w,h);
  const gap = Math.hypot(pts[pts.length-1][0], pts[pts.length-1][1]) / size;
  return { pts, ang, w, h, size, gap, len };
}

function crossings(pts){
  const hit = (a,b,c,d) => {
    const s1x=b[0]-a[0], s1y=b[1]-a[1], s2x=d[0]-c[0], s2y=d[1]-c[1];
    const den = (-s2x*s1y + s1x*s2y);
    if(Math.abs(den) < 1e-9) return false;
    const s = (-s1y*(a[0]-c[0]) + s1x*(a[1]-c[1])) / den;
    const t = ( s2x*(a[1]-c[1]) - s2y*(a[0]-c[0])) / den;
    return s > 0.02 && s < 0.98 && t > 0.02 && t < 0.98;
  };
  /* ---- THE CLOSING CHORD IS PART OF THE TRACK ------------------------
     The map calls `closePath()`, which draws a straight line from the last
     point back to the first. If the lap does not land exactly on its start,
     that chord cuts clean across the circuit — and it was never tested,
     because the loop stopped at `pts.length - S`.

     Those thin straight lines slicing through the tracks WERE the chord. The
     count said zero because the one segment doing the crossing was the one
     segment nobody looked at.

     It is included now, so a track that does not truly close is scored as the
     mess it will be drawn as, and the search rejects it.
     ------------------------------------------------------------------ */
  let n = 0;
  const S = 3;
  const segsOf = [];
  for(let i = 0; i + S < pts.length; i += S) segsOf.push([pts[i], pts[i+S]]);
  segsOf.push([pts[pts.length-1], pts[0]]);          /* the closing chord */
  for(let i = 0; i < segsOf.length; i++)
    for(let j = i + 2; j < segsOf.length; j++){
      if(i === 0 && j === segsOf.length - 1) continue;   /* they share a point */
      if(hit(segsOf[i][0], segsOf[i][1], segsOf[j][0], segsOf[j][1])) n++;
    }
  return n;
}

function buildCircuit(league, seed){
  /* ---- CLOSED FIRST, CURVATURE SECOND -----------------------------------
     Every previous version built a sequence of (curvature, length) segments
     and hoped it came back. It never did: guaranteeing the total TURN is 2pi
     is necessary and not sufficient, because a spiral turns 360 degrees too.
     Closing needs the sum of the position VECTORS to be zero, and a sequential
     walk has no way to enforce that.

     So stop walking. Build a CLOSED SHAPE first \u2014 points around a circle,
     jittered for character, smoothed into a loop \u2014 and then READ the curvature
     off that path. Closure is a property of the source shape and cannot be
     violated by anything downstream.

     Crossings are then almost free too: a star-shaped polygon (points sorted
     by angle around a centre, radii kept within a band) cannot cross itself.
     ------------------------------------------------------------------- */
  const spec = league === 'formula'
      /* ---- THE TRACKS WERE A THOUSAND KILOMETRES LONG ------------------
         `size` is the RADIUS, so 105,000 gave a lap of about 660,000 units —
         and a lap that long spreads 2\u03c0 of turning so thinly that every sample
         came out at k = 0.02. Measured: **95% of every lap was straight and
         nothing at all was tight.** They looked like circuits on the map and
         drove like a motorway.

         A corner is only a corner if the curvature is big enough to push you
         wide. Scaled to give laps in the 90k-150k range, which is where the
         same 2\u03c0 produces k values of 1 to 4 — the band the cornering force was
         tuned against in Highway.
         -------------------------------------------------------------- */
      /* ---- WHAT THE RESEARCH SAYS ---------------------------------------
         I had FORMULA as the smoothest league — fewest tight corners — and that
         is backwards. A grand prix circuit is not gentle; it has the widest
         RANGE. Silverstone's Copse is taken at 180mph and Monaco's Fairmont
         hairpin at 30, and both are formula corners. What separates the league
         is not an absence of hairpins but the presence of BOTH extremes.

         So formula gets the most control points AND the biggest jitter: long
         fast sweepers joined by genuinely tight turns. A sports circuit is
         uniformly medium — fewer, tighter, no great sweeps and no true
         hairpins. GT sits between.

         A hairpin is also where braking decides the lap, which is why it
         belongs with the cars that can brake.
         ---------------------------------------------------------------- */
      /* ---- A LAP HAS TO LAST ------------------------------------------
         Simulated with the real car stats, laps came out at 14-20 SECONDS. A
         real circuit lap is 60 to 120. The tracks were the right shape and a
         quarter of the size they needed to be.

         Simply scaling `size` up makes the curvature gentler and turns every
         corner into a sweep — that was the 95%-straight failure. So the
         control-point COUNT scales with it: more corners over a longer lap
         keeps each corner as sharp as it was while the lap gets longer.
         ---------------------------------------------------------------- */
      ? { pts:[26,34], jitter:0.40, longBias:0.65, size:74000, spike:0.30 }
    : league === 'gt'
      ? { pts:[23,30], jitter:0.30, longBias:0.50, size:62000, spike:0.20 }
      : { pts:[20,26], jitter:0.24, longBias:0.35, size:50000, spike:0.10 };

  const N = R.rint(spec.pts[0], spec.pts[1]);

  /* ---- THE LOOP, WITH ROOM FOR HAIRPINS -------------------------------
     Points sorted by angle around a circle: star-shaped, so it cannot cross
     itself. The jitter gives character; the radius band stops it becoming a
     splinter.

     A HAIRPIN is not one point pulled deep — that overshoots and crosses. It
     is THREE points close together in ANGLE at a short radius: the spline has
     to turn hard to thread them, and the radius it can achieve is set by how
     far apart they are. Clustering is the geometry; depth is not.
     ------------------------------------------------------------------- */
  const ang = [], rad = [], hair = [];
  let a = 0;
  for(let i = 0; i < N; i++){
    /* how much of the circle this point takes. A cluster takes very little,
       which is exactly what makes the corner between them tight. */
    let share = 1 + R.rnd(-0.30, 0.30);
    ang.push(a);
    const lobe = (i % 2 ? -1 : 1) * spec.jitter * R.rnd(0.55, 1.0);
    rad.push(1 + lobe + R.rnd(-spec.jitter*0.30, spec.jitter*0.30));
    a += share;
  }

  /* ---- fold in the hairpins -------------------------------------------
     Take a point, pull it IN, and pull its two neighbours in ANGLE hard
     toward it. Three points at a short radius within a narrow arc is a
     hairpin: a wide approach, a tight apex, a wide exit. */
  /* ---- A CORNER NEEDS LENGTH, NOT A SHARP POINT ------------------------
     Measured on a warm lap, a formula car never dropped below 192mph. The
     corners were sharp — peak curvature 14 — and far too SHORT to matter: at
     218mph the car crosses a 600-unit sample in 0.036 seconds and the brakes
     take almost nothing off it, so it carries straight through the apex.

     A tight radius over 200 units is a kink. Over 6,000 it is a corner you
     must brake for. So a hairpin is built as a SUSTAINED ARC: four or five
     control points held at the same short radius across a narrow band of
     angle. The spline threads them at a constant tight radius, which is what
     an apex actually is, and the length comes for free because the points are
     spread along the arc rather than piled on one spot.
     ------------------------------------------------------------------- */
  const nHair = Math.max(1, Math.round(N * spec.spike));
  const used = [];
  for(let h = 0; h < nHair; h++){
    const arc = R.rint(4, 5);                 /* points held at the apex */
    const i0  = R.rint(2, N - arc - 3);
    if(used.some(u => Math.abs(u - i0) < arc + 3)) continue;
    used.push(i0);
    hair.push(i0);

    /* the arc: every point at the SAME short radius, inside a narrow band of
       angle, so the spline has to hold a constant tight turn across all of
       them rather than spike at one */
    const apexR    = 1 - spec.jitter * R.rnd(0.80, 1.05);
    const bandFrom = ang[i0 - 1], bandTo = ang[i0 + arc];
    /* 0.30-0.44 folded hard enough to produce CUSPS — measured radii as low
       as 38 units, which is a spike in the spline, not a corner. It also put
       crossings back. 0.55-0.72 keeps the arc a real curve. */
    const band     = (bandTo - bandFrom) * R.rnd(0.55, 0.72);
    for(let q = 0; q < arc; q++){
      ang[i0 + q] = bandFrom + band * ((q + 1) / (arc + 1));
      rad[i0 + q] = apexR * (1 + R.rnd(-0.03, 0.03));
    }
    /* wide approach and exit, so it reads as a hairpin rather than a dent */
    rad[i0 - 1]   = 1 + spec.jitter * R.rnd(0.75, 1.15);
    rad[i0 + arc] = 1 + spec.jitter * R.rnd(0.75, 1.15);
  }

  /* normalise the angles back onto a full circle */
  const span = ang[N-1] + 1;
  for(let i = 0; i < N; i++) ang[i] = (ang[i] / span) * Math.PI * 2;

  /* ---- sample the loop into a smooth path ------------------------------
     A Catmull-Rom through the control points, closed, so the track flows
     rather than turning at corners. */
  const P = [], STEPS = 24;
  const at = i => {
    const k = ((i % N) + N) % N;
    return [ Math.cos(ang[k]) * rad[k] * spec.size,
             Math.sin(ang[k]) * rad[k] * spec.size ];
  };
  for(let i = 0; i < N; i++){
    const p0 = at(i-1), p1 = at(i), p2 = at(i+1), p3 = at(i+2);
    for(let t = 0; t < STEPS; t++){
      const u = t / STEPS, u2 = u*u, u3 = u2*u;
      P.push([
        0.5*((2*p1[0]) + (-p0[0]+p2[0])*u + (2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*u2 + (-p0[0]+3*p1[0]-3*p2[0]+p3[0])*u3),
        0.5*((2*p1[1]) + (-p0[1]+p2[1])*u + (2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*u2 + (-p0[1]+3*p1[1]-3*p2[1]+p3[1])*u3)
      ]);
    }
  }

  /* ---- read the curvature off the closed path --------------------------
     Walk it, measure the turn between consecutive headings, and emit a
     segment per sample. The road is then EXACTLY the shape above, so the
     minimap and the driving agree by construction. */
  const segs = [];
  let len = 0;
  for(let i = 0; i < P.length; i++){
    const a = P[i], b = P[(i+1) % P.length], c = P[(i+2) % P.length];
    const h1 = Math.atan2(b[0]-a[0], b[1]-a[1]);
    const h2 = Math.atan2(c[0]-b[0], c[1]-b[1]);
    let d = h2 - h1;
    while(d >  Math.PI) d -= Math.PI*2;
    while(d < -Math.PI) d += Math.PI*2;
    const segLen = Math.max(400, Math.hypot(b[0]-a[0], b[1]-a[1]));
    /* k is the curvature the driving code expects: turn per unit of road */
    segs.push({ k: d / (segLen * 0.00028), len: segLen });
    len += segLen;
  }

  const hills = [];
  let hl = 0;
  while(hl < len){
    const g = { k: R.rnd(-0.9, 1.1), len: Math.min(R.rnd(6000, 14000), len - hl) };
    hills.push(g); hl += g.len;
  }

  /* corners: runs of sustained curvature, which is what a driver would count */
  let corners = 0, inCorner = false;
  for(const g of segs){
    const tight = Math.abs(g.k) > 1.1;
    if(tight && !inCorner) corners++;
    inCorner = tight;
  }

  return { segs, hills, len, corners, path2: P,
           name: (league === 'formula' ? 'CIRCUIT ' : league === 'gt' ? 'PARK ' : 'RACEWAY ')
                 + (1000 + ((seed || Math.random()*9000)|0) % 9000) };
}

/* ---- THE MINIMAP ---------------------------------------------------------
   A circuit is a list of (curvature, length). Walk it, turning by `k` as you
   go, and you get the shape of the track as a closed polyline — exactly the
   outline in a Crash Team Racing track select.

   Two details make it work:

     - the walk must CLOSE. Random curvature does not return to its start, so
       the total turn is measured and the whole path is rotated back by the
       error, spread over its length. The loop then joins itself.
     - it is normalised into a unit box, so the same code draws a long fast
       circuit and a tight one at the same size on screen.

   Built ONCE per circuit and cached; drawing it every frame is just a
   `drawImage` and a blip per car.
   -------------------------------------------------------------------------- */
function buildMiniPath(c){
  /* ---- THE MAP IS THE SOURCE SHAPE ------------------------------------
     The circuit is now BUILT from a closed path, so the map does not have to
     reconstruct one by integrating curvature and hoping it lands back where it
     started. It draws `path2` — the very points the road was read from.

     That removes the last way the picture and the track could disagree, which
     is what let a crossing appear on screen while the counter said zero.
     ------------------------------------------------------------------- */
  const pts = c.path2;
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  for(const q of pts){ if(q[0]<x0)x0=q[0]; if(q[0]>x1)x1=q[0];
                       if(q[1]<y0)y0=q[1]; if(q[1]>y1)y1=q[1]; }
  const w = Math.max(1,x1-x0), h = Math.max(1,y1-y0), sc = 1/Math.max(w,h);
  return pts.map((q,i) => [ (q[0]-x0)*sc + (1-w*sc)/2,
                            (q[1]-y0)*sc + (1-h*sc)/2,
                            i / pts.length * c.len ]);
}

/* where on the map is a car at track position z */
function miniAt(z){
  if(!circuit || !circuit.path) return null;
  const P = circuit.path;
  const i = Math.min(P.length-1, Math.floor(trackZ(z) / circuit.len * P.length));
  return P[i];
}

function drawMiniMap(ctx2, mx, my, size){
  if(!circuit) return;
  if(!circuit.path) circuit.path = buildMiniPath(circuit);
  const P = circuit.path;
  ctx2.save();
  /* the board */
  ctx2.fillStyle = 'rgba(8,12,10,.62)';
  R.rr(ctx2, mx-4, my-4, size+8, size+8, 6); ctx2.fill();
  /* the ribbon: a fat dark casing with a pale road on top, as the map shows */
  const pt = i => [ mx + P[i][0]*size, my + P[i][1]*size ];
  ctx2.lineJoin = ctx2.lineCap = 'round';
  ctx2.strokeStyle = 'rgba(10,14,12,.95)';
  ctx2.lineWidth = Math.max(4, size*0.075);
  ctx2.beginPath();
  P.forEach((q,i) => { const a = pt(i); i ? ctx2.lineTo(a[0],a[1]) : ctx2.moveTo(a[0],a[1]); });
  ctx2.closePath(); ctx2.stroke();
  ctx2.strokeStyle = '#e9e6a8';
  ctx2.lineWidth = Math.max(2, size*0.045);
  ctx2.stroke();
  /* the start line, in red, exactly as the reference does it */
  const s0 = pt(0);
  ctx2.strokeStyle = '#e0332f';
  ctx2.lineWidth = Math.max(3, size*0.062);
  ctx2.beginPath();
  ctx2.moveTo(s0[0], s0[1]);
  const s1 = pt(Math.min(P.length-1, 2));
  ctx2.lineTo(s1[0], s1[1]);
  ctx2.stroke();
  /* every rival as a blip, then you on top so you are never hidden */
  for(const r of R.racers){
    const q = miniAt(r.z); if(!q) continue;
    ctx2.fillStyle = 'rgba(255,255,255,.78)';
    ctx2.beginPath();
    ctx2.arc(mx + q[0]*size, my + q[1]*size, Math.max(1.6, size*0.026), 0, 6.2832);
    ctx2.fill();
  }
  const me = miniAt(R.pos + R.PLAYER_Z);
  if(me){
    ctx2.fillStyle = '#0b0e0c';
    ctx2.beginPath();
    ctx2.arc(mx + me[0]*size, my + me[1]*size, Math.max(3, size*0.048), 0, 6.2832);
    ctx2.fill();
    ctx2.fillStyle = '#4dd6a0';
    ctx2.beginPath();
    ctx2.arc(mx + me[0]*size, my + me[1]*size, Math.max(2, size*0.034), 0, 6.2832);
    ctx2.fill();
  }
  ctx2.restore();
}

   outline in a Crash Team Racing track select.

       error, spread over its length. The loop then joins itself.
     - it is normalised into a unit box, so the same code draws a long fast
       circuit and a tight one at the same size on screen.

   `drawImage` and a blip per car.
   -------------------------------------------------------------------------- */

  for(const r of R.racers){
    const q = miniAt(r.z); if(!q) continue;

    ctx2.fill();
  }
  const me = miniAt(R.pos + R.PLAYER_Z);
  if(me){
    ctx2.fillStyle = '#0b0e0c';
    ctx2.beginPath();

    ctx2.fill();
    ctx2.fillStyle = '#4dd6a0';
    ctx2.beginPath();

    ctx2.fill();

  ctx2.restore();

function trackZ(z){
  if(!circuit) return z;
  const L = circuit.len;
  return ((z % L) + L) % L;
}
function lapOf(z){ return circuit ? Math.floor(z / circuit.len) : 0; }

/* the sequence of bends, generated ahead as the road is consumed */
let signs = [];
function pushCurve(){
  const roll = Math.random();
  let k, len;
  if(roll < 0.30){ k = 0;                     len = R.rnd(7000, 15000); }
  else if(roll < 0.56){ k = R.rnd(0.9, 1.9);    len = R.rnd(6000, 12000); }
  else if(roll < 0.82){ k = R.rnd(2.4, 4.2);    len = R.rnd(5000, 10000); }
  else {                k = R.rnd(5.0, 8.0);    len = R.rnd(4000, 7000); }
  if(k && Math.random() < 0.5) k = -k;
  /* ---- warning boards ----------------------------------------------------
     A bend you cannot see coming is a trap rather than a corner. Every turn
     gets a board a little way before it, on the OUTSIDE of the bend where you
     are looking anyway, carrying one chevron for a gentle curve, two for a
     medium and three for a hard one. Straight from Out Run, and the reason its
     corners feel fair at speed.
     ------------------------------------------------------------------------ */
  const startZ = bendZ0 + totalLen(curveSegs);
  if(k !== 0){
    const mag = Math.abs(k) < 2.0 ? 1 : Math.abs(k) < 4.4 ? 2 : 3;
    signs.push({ z: startZ - 5200, dir: Math.sign(k), mag,
                 side: Math.sign(k) > 0 ? 1 : -1 });
  }
  curveSegs.push({ k, len });
  if(k !== 0) curveSegs.push({ k:0, len: R.rnd(3500, 7000) });
}


ROAD(Object.assign(CFG, {

  /* the two lookups that make the road a loop */
  curvature: z => circuit ? R.segAt(circuit.segs,  trackZ(z)) : 0,
  grade:     z => circuit ? R.segAt(circuit.hills, trackZ(z)) : 0,

  /* miles mean nothing on a circuit */
  hudScore:  () => circuit ? ('LAP ' + Math.min(lap + 1, lapsTotal) + '/' + lapsTotal)
                           : '\u2014',

  /* a fresh track every run: that is what procgen is for */
  onReset: () => {
    circuit = buildCircuit(league);
    lap = 0; lapStart = R.clock; bestLap = 0; lastLap = 0;
  },

  /* `pos` never resets, so the lap number is just how many track lengths you
     have covered. A change in that number IS a lap. */
  onStep: () => {
    if(!circuit || R.state !== 'driving') return;
    const n = lapOf(R.pos);
    if(n > lap){
      const t = lapStart - R.clock;
      lastLap = t;
      if(t > 0 && (!bestLap || t < bestLap)) bestLap = t;
      lapStart = R.clock; lap = n;
      R.snd.checkpoint();
      if(lap >= lapsTotal && !R.finished){ R.finished = true; R.flashWarn('FINISH'); }
    }
  },

  afterDraw: (ctx) => {
    if(circuit && R.state === 'driving')
      drawMiniMap(ctx, 14, R.horizon() + 12, Math.min(96, innerWidth * 0.24));
  }
}));
