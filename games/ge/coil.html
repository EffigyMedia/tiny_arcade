<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05090c">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Coil</title>
<meta name="arcade-home" content="../../index.html#ge">
<meta name="arcade-title" content="Coil">
<meta name="arcade-accent" content="#7cf5a0">
<script src="../../audio.js"></script>
<script src="../../arcade.js"></script>
<style>
@font-face{font-family:"Michroma";font-style:normal;font-weight:400;font-display:swap;src:url("../../fonts/michroma-400.woff2") format("woff2")}
@font-face{font-family:"Major Mono Display";font-style:normal;font-weight:400;font-display:swap;src:url("../../fonts/majormonodisplay-400.woff2") format("woff2")}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#05090c;
  font-family:"Major Mono Display",ui-monospace,monospace;color:#d6f0e2;
  user-select:none;-webkit-user-select:none}
#stage{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:var(--safe-top,0px)}
#head{flex:none;display:flex;justify-content:space-between;align-items:baseline;
  padding:9px 14px 5px;font-size:9px;letter-spacing:.20em;color:#5a7a68}
#head b{font-size:17px;color:#7cf5a0;font-weight:700;font-variant-numeric:tabular-nums}
#wrap{flex:1;position:relative;display:grid;place-items:center;min-height:0;
  padding:0 6px calc(6px + var(--safe-bot,0px))}
#bundle{display:block;touch-action:none;border-radius:2px;
  box-shadow:0 0 0 1px #12241c, 0 18px 50px -20px #000}
#veil{position:fixed;inset:0;background:rgba(4,8,10,.95);display:grid;place-items:center;
  padding:26px;text-align:center;z-index:40}
#veil.hidden{display:none}
#veilBody{max-width:330px;width:100%}
.eyebrow{font-size:9px;letter-spacing:.26em;color:#7cf5a0;margin-bottom:9px}
h1{font-family:"Michroma",sans-serif;font-size:44px;font-weight:800;margin:0;
  letter-spacing:-.02em;line-height:1;color:#eafff2}
h1 em{display:block;font-family:"Major Mono Display",monospace;font-size:9.5px;font-style:normal;
  font-weight:400;letter-spacing:.24em;color:#5a7a68;margin-top:9px}
.tmenu{display:flex;flex-direction:column;gap:8px;max-width:240px;margin:24px auto 0}
.btn{padding:14px 0;width:100%;border:0;border-radius:3px;cursor:pointer;font:inherit;
  font-size:11.5px;letter-spacing:.18em;background:#7cf5a0;color:#032015}
.btn.ghost{background:transparent;color:#7cf5a0;border:1px solid rgba(124,245,160,.32)}
.btn:active{opacity:.85}
.ctrls{margin:16px auto 0;max-width:290px}
.crow{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:7px 2px;
  border-bottom:1px solid rgba(255,255,255,.07);font-size:12px;text-align:left}
.crow b{font-weight:600;white-space:nowrap}
.crow i{font-style:normal;color:#84a894;text-align:right}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
.gc{border:1px solid #172c22;border-radius:3px;padding:9px}
.gc span{display:block;font-size:8px;letter-spacing:.18em;color:#5a7a68}
.gc b{display:block;font-size:17px;margin-top:3px;font-variant-numeric:tabular-nums}
/* ---------------------------------------------------------------------------
   PORTRAIT ON A PHONE, WIDE ON A DESKTOP

   The manifest pins the INSTALLED app to portrait, but a browser tab cannot be
   forced — `screen.orientation.lock()` only works from fullscreen and throws
   everywhere else. So: on a touch device held sideways, a panel asks for it
   back. On a desktop there is no such thing as the wrong orientation, and a
   wide window is exactly what we want, so the panel never appears there.

   The test is POINTER TYPE, not width. A landscape phone and a small laptop
   window are the same number of pixels and want opposite things.
   --------------------------------------------------------------------------- */
#rotate{
  position:fixed;inset:0;z-index:9000;display:none;
  place-items:center;text-align:center;padding:28px;
  background:#07050b;color:#e8e2f4;
  font-family:var(--px,ui-monospace,monospace);
}
#rotate b{display:block;font-size:12px;letter-spacing:.22em;color:var(--gold,#e8b23a);margin-bottom:14px}
#rotate span{display:block;font-size:10px;letter-spacing:.14em;color:#8a8296;line-height:2}
#rotate i{display:block;width:52px;height:82px;margin:0 auto 22px;
  border:2px solid rgba(232,178,58,.65);border-radius:8px;
  transform:rotate(90deg);animation:rot 2.4s ease-in-out infinite}
@keyframes rot{0%,40%{transform:rotate(90deg)}60%,100%{transform:rotate(0deg)}}
@media (orientation:landscape) and (pointer:coarse){
  body.lock-portrait #rotate{display:grid}
}
</style>
</head>
<body>
<div id="stage">
  <div id="head">
    <div>SCORE <b id="sc">0</b></div>
    <div>LENGTH <b id="ln">3</b></div>
    <div>BEST <b id="bs">0</b></div>
  </div>
  <div id="wrap"><canvas id="bundle"></canvas></div>
</div>
<div id="veil"><div id="veilBody"></div></div>
<script>
(function(){
"use strict";
const AR = window.Arcade, $ = id => document.getElementById(id);
const cv = $('bundle'), g = cv.getContext('2d');
const veil = $('veil'), veilBody = $('veilBody');

const COLS = 17, ROWS = 21, U = 18;
const W = COLS*U, H = ROWS*U;
let S = 1;

let body, dir, queued, queued2, food, bonusNode, walls, state, score, best, tickAcc, alive;
let pulses, deathT = 0, ate = 0, runs = 0;

/* ---- obstacle layouts, unlocked by what you have already scored --------- */
const WALLS = [
  [],
  [[8,6],[8,7],[8,13],[8,14]],
  [[4,5],[5,5],[6,5],[12,5],[11,5],[10,5],[4,15],[5,15],[6,15],[12,15],[11,15],[10,15]],
  [[3,7],[3,8],[13,7],[13,8],[3,12],[3,13],[13,12],[13,13],[8,10]]
];
function wallsFor(sc){
  const i = sc > 900 ? 3 : sc > 450 ? 2 : sc > 180 ? 1 : 0;
  return WALLS[i].map(w => ({ c:w[0], r:w[1] }));
}

function reset(){
  score = 0; ate = 0;
  body = [{c:8,r:14},{c:8,r:15},{c:8,r:16}];
  dir = {c:0,r:-1}; queued = null; queued2 = null;
  walls = wallsFor(0);
  pulses = []; deathT = 0; alive = true;
  placeFood(); bonusNode = null; tickAcc = 0;
  paintHud();
}

function free(c,r){
  if(c<0||c>=COLS||r<0||r>=ROWS) return false;
  if(body.some(s => s.c===c && s.r===r)) return false;
  if(walls.some(w => w.c===c && w.r===r)) return false;
  if(bonusNode && bonusNode.c===c && bonusNode.r===r) return false;
  return true;
}
function placeFood(){
  let tries = 0;
  do { food = { c:(Math.random()*COLS)|0, r:(Math.random()*ROWS)|0 }; tries++; }
  while(!free(food.c, food.r) && tries < 400);
}
function placeBonus(){
  /* deliberately awkward: it prefers a corner or a spot behind your own body */
  const cands = [];
  for(let i=0;i<60;i++){
    const c=(Math.random()*COLS)|0, r=(Math.random()*ROWS)|0;
    if(!free(c,r)) continue;
    const edge = Math.min(c, COLS-1-c, r, ROWS-1-r);
    cands.push({ c, r, w: 4 - Math.min(3, edge) });
  }
  if(!cands.length) return;
  cands.sort((a,b)=>b.w-a.w);
  const pick = cands[(Math.random()*Math.min(6,cands.length))|0];
  bonusNode = { c:pick.c, r:pick.r, t: 7 };
}

/* speed rises with length: the reward for doing well is less time to think */
function tickTime(){
  return Math.max(0.058, 0.185 - (body.length-3) * 0.0035);
}

function turn(c, r){
  if(state !== 'play' || !alive) return;
  /* reversal blocked, and ONE turn buffered so a fast double round a corner
     actually lands — without the buffer the second swipe is eaten */
  /* THE BUFFER IS TWO DEEP, and both branches used to assign the same thing -
     so a fast double round a corner threw the FIRST turn away and did the
     second, which is the opposite of what this game's own CONTROLS page
     promises. The second turn waits its turn now. */
  const last = queued2 || queued || dir;
  if(last.c === -c && last.r === -r) return;
  if(last.c === c && last.r === r) return;
  if(!queued) queued = { c, r };
  else if(!queued2) queued2 = { c, r };
  else return;
  snd.turn();
}

function tick(){
  if(!alive) return;
  if(queued){ dir = queued; queued = queued2; queued2 = null; }
  const head = body[0];
  const nc = head.c + dir.c, nr = head.r + dir.r;

  if(nc<0 || nc>=COLS || nr<0 || nr>=ROWS){ die(); return; }
  if(walls.some(w => w.c===nc && w.r===nr)){ die(); return; }
  /* the tail square is free THIS tick, because it is about to leave */
  const hitsSelf = body.some((s,i) => i < body.length-1 && s.c===nc && s.r===nr);
  if(hitsSelf){ die(); return; }

  body.unshift({ c:nc, r:nr });

  let grew = false;
  if(food.c===nc && food.r===nr){
    grew = true; ate++;
    score += 10 + Math.floor(body.length/6)*5;
    snd.eat(body.length);
    pulses.push({ c:nc, r:nr, t:1 });
    placeFood();
    walls = wallsFor(score);
    if(ate % 6 === 0 && !bonusNode) placeBonus();
  }
  if(bonusNode && bonusNode.c===nc && bonusNode.r===nr){
    grew = true;
    score += 150;
    snd.bonus();
    pulses.push({ c:nc, r:nr, t:1.4 });
    bonusNode = null;
  }
  if(!grew) body.pop();
  paintHud();
}

function die(){
  alive = false; deathT = 1.0;
  snd.die();
  if(AR && AR.music) AR.music.stop();
  best = Math.max(best, score);
  if(AR && AR.save) AR.save.merge('coil', { best, length:body.length, label:'BEST '+best });
}

function step(dt){
  if(state !== 'play') return;
  if(!alive){
    deathT -= dt;
    if(deathT <= 0) gameOver();
    return;
  }
  tickAcc += dt;
  if(tickAcc >= tickTime()){ tickAcc -= tickTime(); tick(); }
  if(bonusNode){ bonusNode.t -= dt; if(bonusNode.t <= 0) bonusNode = null; }
  for(let i=pulses.length-1;i>=0;i--){ pulses[i].t -= dt*1.7; if(pulses[i].t<=0) pulses.splice(i,1); }
}

/* ---- audio -------------------------------------------------------------
   The bed is quantised to the MOVEMENT tick rather than to a bpm, so music
   and motion are the same clock and accelerate together. */
const SCALE = [0,3,5,7,10];
let musStep = 0;
function musicPulse(){
  if(!AR || state !== 'play' || !alive) return;
  musStep++;
  const t = AR.audio.now();
  if(musStep % 4 === 0)
    AR.sfx.tone({ t, freq: 82, dur:0.16, type:'triangle', gain:0.055,
                  attack:0.004, cutoff:380, bus:'music' });
  if(musStep % 2 === 1)
    AR.sfx.tone({ t, freq: 164 * Math.pow(2, SCALE[musStep % 5]/12),
                  dur:0.07, type:'square', gain:0.026, attack:0.003,
                  cutoff:2000, bus:'music' });
  /* it thickens as you fill the board, which is the tension of the game */
  if(body.length > 12 && musStep % 8 === 4)
    AR.sfx.tone({ t, freq: 328, dur:0.10, type:'sine', gain:0.024, bus:'music' });
  if(body.length > 24 && musStep % 8 === 0)
    AR.sfx.noise({ t, freq:3000, dur:0.03, gain:0.020, filter:'highpass', bus:'music' });
}

const snd = {
  eat(len){ if(AR) AR.sfx.tone({ freq: 420 + len*11, to: 700 + len*14,
                                 dur:0.11, type:'square', gain:0.055, cutoff:2800 }); },
  turn(){ if(AR) AR.sfx.tone({ freq:900, dur:0.022, type:'sine', gain:0.022 }); },
  bonus(){ if(!AR) return; [0,4,7,12].forEach((n,i) =>
    AR.sfx.tone({ t:AR.audio.now()+i*0.055, freq:520*Math.pow(2,n/12),
                  dur:0.20, type:'sine', gain:0.07, verb:0.45 })); },
  die(){ if(AR){ AR.sfx.tone({ freq:520, to:60, dur:0.32, type:'sawtooth', gain:0.10, cutoff:900 });
                 AR.sfx.noise({ freq:1600, to:200, dur:0.20, gain:0.06, filter:'bandpass' }); } }
};

/* ---- draw: fibre optic -------------------------------------------------- */
function fit(){
  const wrap = $('wrap');
  S = Math.min((wrap.clientWidth-4)/W, (wrap.clientHeight-4)/H);
  const dpr = Math.min(2, window.devicePixelRatio||1);
  cv.width=Math.round(W*S*dpr); cv.height=Math.round(H*S*dpr);
  cv.style.width=(W*S)+'px'; cv.style.height=(H*S)+'px';
  g.setTransform(dpr*S,0,0,dpr*S,0,0);
  draw();
}
function fitTight(){
  fit();
  for(let i=0;i<6;i++){
    const r = cv.getBoundingClientRect();
    if(r.right <= window.innerWidth && r.bottom <= $('wrap').getBoundingClientRect().bottom+1) break;
    S *= 0.97;
    const dpr = Math.min(2, window.devicePixelRatio||1);
    cv.width=Math.round(W*S*dpr); cv.height=Math.round(H*S*dpr);
    cv.style.width=(W*S)+'px'; cv.style.height=(H*S)+'px';
    g.setTransform(dpr*S,0,0,dpr*S,0,0);
  }
  draw();
}

function draw(){
  g.fillStyle='#070d10'; g.fillRect(0,0,W,H);
  /* the dark bundle: unlit fibres running the length of the board */
  g.strokeStyle='rgba(60,120,95,.10)'; g.lineWidth=1;
  for(let c=0;c<=COLS;c++){ g.beginPath(); g.moveTo(c*U+0.5,0); g.lineTo(c*U+0.5,H); g.stroke(); }
  for(let r=0;r<=ROWS;r++){ g.beginPath(); g.moveTo(0,r*U+0.5); g.lineTo(W,r*U+0.5); g.stroke(); }

  for(const w of walls){
    g.fillStyle='#16302a';
    g.fillRect(w.c*U+2, w.r*U+2, U-4, U-4);
    g.strokeStyle='rgba(124,245,160,.20)'; g.lineWidth=1;
    g.strokeRect(w.c*U+2.5, w.r*U+2.5, U-5, U-5);
  }

  /* the pulse travelling the bundle: head bright, body fading to nothing */
  for(let i=body.length-1;i>=0;i--){
    const s = body[i];
    const q = 1 - i/Math.max(1, body.length);      /* 1 at the head */
    const x = s.c*U + U/2, y = s.r*U + U/2;
    const rad = U*0.30 + q*U*0.14;
    const glow = g.createRadialGradient(x,y,0,x,y,U*0.85);
    const a = 0.10 + q*0.55;
    glow.addColorStop(0, 'rgba(124,245,160,'+a+')');
    glow.addColorStop(1, 'rgba(124,245,160,0)');
    g.fillStyle = glow; g.fillRect(x-U, y-U, U*2, U*2);
    g.fillStyle = 'rgba(160,255,200,'+(0.20+q*0.75)+')';
    g.beginPath(); g.arc(x,y,rad,0,6.2832); g.fill();
    /* the tail flashes when it is one step from leaving */
    if(i === body.length-1 && alive){
      const f = tickAcc / tickTime();
      g.strokeStyle = 'rgba(255,240,150,'+(0.25+f*0.5)+')';
      g.lineWidth = 1.4;
      g.beginPath(); g.arc(x,y,rad+2.5,0,6.2832); g.stroke();
    }
  }
  /* the head core, brightest thing on the board */
  if(body.length){
    const h = body[0], x=h.c*U+U/2, y=h.r*U+U/2;
    g.fillStyle='#ffffff';
    g.beginPath(); g.arc(x,y,U*0.20,0,6.2832); g.fill();
  }

  /* food and bonus: junction nodes */
  node(food.c, food.r, '#7cf5a0', 1);
  if(bonusNode) node(bonusNode.c, bonusNode.r, '#ffd23c', Math.min(1, bonusNode.t/7 + 0.4));

  for(const p of pulses){
    g.strokeStyle='rgba(200,255,220,'+Math.max(0,p.t)+')'; g.lineWidth=1.6;
    g.beginPath(); g.arc(p.c*U+U/2, p.r*U+U/2, (1.4-p.t)*U*1.5, 0, 6.2832); g.stroke();
  }
}

function node(c, r, col, a){
  const x=c*U+U/2, y=r*U+U/2;
  const pu = 0.75 + Math.sin(performance.now()/220)*0.25;
  const glow = g.createRadialGradient(x,y,0,x,y,U*0.9);
  glow.addColorStop(0, col.replace(')', ',' + (0.45*a*pu) + ')').replace('#','rgba(').length>40
    ? col : col);
  g.save();
  g.globalAlpha = 0.35*a*pu;
  g.fillStyle = col;
  g.beginPath(); g.arc(x,y,U*0.62,0,6.2832); g.fill();
  g.globalAlpha = a;
  g.fillStyle = col;
  g.beginPath(); g.arc(x,y,U*0.24,0,6.2832); g.fill();
  /* four short fibres running off the junction */
  g.strokeStyle = col; g.lineWidth = 1.4; g.globalAlpha = 0.55*a;
  for(let i=0;i<4;i++){
    const ang = i*1.5708 + 0.7854;
    g.beginPath(); g.moveTo(x+Math.cos(ang)*U*0.30, y+Math.sin(ang)*U*0.30);
    g.lineTo(x+Math.cos(ang)*U*0.52, y+Math.sin(ang)*U*0.52); g.stroke();
  }
  g.restore();
}

function paintHud(){
  $('sc').textContent=score.toLocaleString();
  $('ln').textContent=body.length;
  $('bs').textContent=best.toLocaleString();
}

let last=0;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(0.05,(now-last)/1000)||0; last=now;
  const before = Math.floor(musStepClock);
  musStepClock += alive && state==='play' ? dt/tickTime() : 0;
  if(Math.floor(musStepClock) > before) musicPulse();
  step(dt); draw();
}
let musStepClock = 0;

/* ---- state ------------------------------------------------------------- */
function start(){
  runs++; reset(); state='play'; veil.classList.add('hidden'); fitTight();
  musStep = 0; musStepClock = 0;
  /* the bed is driven off the movement clock in frame(), so the shell's
     scheduler only has to hold the bus open */
  if(AR && AR.music){ AR.music.stop(); AR.music.start(120, 1, ()=>{}); }
}
function gameOver(){
  state='over';
  if(AR && AR.music) AR.music.stop();
  showOver();
}

function openVeil(html, acts){
  veilBody.innerHTML=html; veil.classList.remove('hidden');
  veilBody.querySelectorAll('[data-act]').forEach(b =>
    b.addEventListener('click', ()=>{ const fn=acts&&acts[b.dataset.act]; if(fn) fn(); }));
}
function showTitle(){
  state='title';
  openVeil('<h1>Coil</h1>' +
    '<div class="tmenu">' +
      '<button class="btn" data-act="play">PLAY</button>' +
      '<button class="btn ghost" data-act="opts">OPTIONS</button>' +
      '<button class="btn ghost" data-act="quit">QUIT</button>' +
    '</div>', { play:start, opts:showOptions, quit:()=>{ if(AR&&AR.home) AR.home(); } });
}
function showOptions(){
  openVeil('<div class="eyebrow">COIL</div><h1>Options</h1>' +
    '<div class="tmenu">' +
      '<button class="btn ghost" data-act="ctrl">CONTROLS</button>' +
      '<button class="btn" data-act="back">BACK</button>' +
    '</div>', { ctrl:showControls, back:showTitle });
}
function showControls(){
  const touch=!!(AR&&AR.touch);
  const rows=[
    [touch?'Swipe':'Arrow keys','turn'],
    ['One turn is buffered','so a quick double round a corner lands'],
    ['Every node makes you longer','and every length makes you faster'],
    ['The gold node','is worth 150 and does not wait'],
    ['The tail flashes','when it is about to move off']
  ];
  openVeil('<div class="eyebrow">'+(touch?'TOUCH':'KEYBOARD')+'</div><h1>Controls</h1>' +
    '<div class="ctrls">'+rows.map(r=>'<div class="crow"><b>'+r[0]+'</b><i>'+r[1]+'</i></div>').join('')+'</div>' +
    '<button class="btn" data-act="back" style="margin-top:16px">BACK</button>', { back:showOptions });
}
function showOver(){
  openVeil('<div class="eyebrow">THE LINE BROKE</div>' +
    '<h1>'+score.toLocaleString()+'<em>FINAL SCORE</em></h1>' +
    '<div class="grid2">' +
      '<div class="gc"><span>LENGTH</span><b>'+body.length+'</b></div>' +
      '<div class="gc"><span>BEST</span><b>'+best.toLocaleString()+'</b></div>' +
    '</div>' +
    '<div class="tmenu">' +
      '<button class="btn" data-act="again">PLAY AGAIN</button>' +
      '<button class="btn ghost" data-act="title">TITLE</button>' +
    '</div>', { again:start, title:showTitle });
}

/* ---- input ------------------------------------------------------------- */
let sx=0, sy=0, sw=false;
cv.addEventListener('pointerdown', e => { sw=true; sx=e.clientX; sy=e.clientY; });
cv.addEventListener('pointermove', e => {
  if(!sw) return;
  const dx=e.clientX-sx, dy=e.clientY-sy;
  if(Math.hypot(dx,dy) < 22) return;
  if(Math.abs(dx) > Math.abs(dy)) turn(dx>0?1:-1, 0); else turn(0, dy>0?1:-1);
  sx=e.clientX; sy=e.clientY;      /* re-arm, so a long drag can turn twice */
});
cv.addEventListener('pointerup', ()=>{ sw=false; });
cv.addEventListener('pointercancel', ()=>{ sw=false; });

window.addEventListener('keydown', e => {
  if(state!=='play'){
    if(e.key==='Enter'||e.key===' '){ const b=veilBody.querySelector('.btn'); if(b){ e.preventDefault(); b.click(); } }
    return;
  }
  const m={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];
  if(m){ e.preventDefault(); turn(m[0],m[1]); }
});
if(AR && AR.pad) AR.pad.onPress(name => {
  if(AR.paused&&AR.paused()) return;
  if(state!=='play'){ if(name==='a'||name==='start'){ const b=veilBody.querySelector('.btn'); if(b) b.click(); } return; }
  const m={left:[-1,0],right:[1,0],up:[0,-1],down:[0,1]}[name];
  if(m) turn(m[0],m[1]);
});
if(AR && AR.onRestart) AR.onRestart(start);
window.addEventListener('resize', fitTight);

<script>
/* only a device with a coarse pointer gets the portrait lock — a desktop
   window is free to be any shape, and wide is the better shape there */
(function(){
  if(matchMedia('(pointer:coarse)').matches) document.body.classList.add('lock-portrait');
  /* an installed app can genuinely lock; a tab cannot, and throwing is fine */
  try{ if(screen.orientation && screen.orientation.lock)
        screen.orientation.lock('portrait').catch(function(){}); }catch(e){}
})();
