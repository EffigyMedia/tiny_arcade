<style>
@font-face{font-family:"Bebas Neue";font-style:normal;font-weight:400;font-display:swap;src:url("../../fonts/bebasneue-400.woff2") format("woff2")}
@font-face{font-family:"Cutive Mono";font-style:normal;font-weight:400;font-display:swap;src:url("../../fonts/cutivemono-400.woff2") format("woff2")}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#12100e;
  font-family:"Cutive Mono",ui-monospace,monospace;color:#e6ded2;
  user-select:none;-webkit-user-select:none}
#stage{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:var(--safe-top,0px)}
#head{flex:none;display:flex;justify-content:space-between;align-items:baseline;
  padding:9px 14px 4px;font-size:9px;letter-spacing:.20em;color:#7a6a58}
#head b{font-size:17px;color:#ff6b2c;font-weight:700;font-variant-numeric:tabular-nums}
#bar{flex:none;height:3px;margin:0 14px 5px;background:#241f18;border-radius:2px;overflow:hidden}
#barIn{height:100%;background:#c8a04a;width:100%}
#wrap{flex:1;position:relative;display:grid;place-items:center;min-height:0;
  padding:0 6px 4px}
#site{display:block;border-radius:2px;box-shadow:0 0 0 1px #2a231b, 0 18px 50px -20px #000}
#pad{flex:none;display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;
  padding:8px 12px calc(10px + var(--safe-bot,0px))}
.pb{padding:16px 0;border-radius:4px;border:1px solid #3a301f;background:#221c13;
  color:#e0cfa4;font:inherit;font-size:12px;letter-spacing:.14em;cursor:pointer;
  touch-action:none}
.pb:active{background:#2e2517;border-color:#ff6b2c;color:#fff}
#veil{position:fixed;inset:0;background:rgba(14,12,9,.95);display:grid;place-items:center;
  padding:26px;text-align:center;z-index:40}
#veil.hidden{display:none}
#veilBody{max-width:330px;width:100%}
.eyebrow{font-size:9px;letter-spacing:.26em;color:#ff6b2c;margin-bottom:9px}
h1{font-family:"Bebas Neue",sans-serif;font-size:42px;font-weight:800;margin:0;
  letter-spacing:-.02em;line-height:1;color:#f4ece0}
h1 em{display:block;font-family:"Cutive Mono",monospace;font-size:9.5px;font-style:normal;
  font-weight:400;letter-spacing:.24em;color:#7a6a58;margin-top:9px}
.tmenu{display:flex;flex-direction:column;gap:8px;max-width:240px;margin:24px auto 0}
.btn{padding:14px 0;width:100%;border:0;border-radius:3px;cursor:pointer;font:inherit;
  font-size:11.5px;letter-spacing:.18em;background:#ff6b2c;color:#1a0c04}
.btn.ghost{background:transparent;color:#ff6b2c;border:1px solid rgba(255,107,44,.34)}
.btn:active{opacity:.85}
.ctrls{margin:16px auto 0;max-width:290px}
.crow{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:7px 2px;
  border-bottom:1px solid rgba(255,255,255,.07);font-size:12px;text-align:left}
.crow b{font-weight:600;white-space:nowrap}
.crow i{font-style:normal;color:#9a8a72;text-align:right}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
.gc{border:1px solid #2e2519;border-radius:3px;padding:9px}
.gc span{display:block;font-size:8px;letter-spacing:.18em;color:#7a6a58}
.gc b{display:block;font-size:17px;margin-top:3px;font-variant-numeric:tabular-nums}
/* ---------------------------------------------------------------------------
   PORTRAIT ON A PHONE, WIDE ON A DESKTOP

   The manifest pins the INSTALLED app to portrait, but a browser tab cannot be
   forced — `screen.orientation.lock()` only works from fullscreen and throws
   everywhere else. So: on a touch device held sideways, a panel asks for it
   back. On a desktop there is no such thing as the wrong orientation, and a
   wide window is exactly what we want, so the panel never appears there.

   The test is POINTER TYPE, not width. A landscape phone and a small laptop
   window are the same number of pixels and want opposite things.
   --------------------------------------------------------------------------- */
#rotate{
  position:fixed;inset:0;z-index:9000;display:none;
  place-items:center;text-align:center;padding:28px;
  background:#07050b;color:#e8e2f4;
  font-family:var(--px,ui-monospace,monospace);
}
#rotate b{display:block;font-size:12px;letter-spacing:.22em;color:var(--gold,#e8b23a);margin-bottom:14px}
#rotate span{display:block;font-size:10px;letter-spacing:.14em;color:#8a8296;line-height:2}
#rotate i{display:block;width:52px;height:82px;margin:0 auto 22px;
  border:2px solid rgba(232,178,58,.65);border-radius:8px;
  transform:rotate(90deg);animation:rot 2.4s ease-in-out infinite}
@keyframes rot{0%,40%{transform:rotate(90deg)}60%,100%{transform:rotate(0deg)}}
@media (orientation:landscape) and (pointer:coarse){
  body.lock-portrait #rotate{display:grid}
}
</style>
</head>
<body>
<div id="stage">
  <div id="head">
    <div>SCORE <b id="sc">0</b></div>
    <div>STAGE <b id="st">1</b></div>
    <div>LIVES <b id="lv">3</b></div>
  </div>
  <div id="bar"><div id="barIn"></div></div>
  <div id="wrap"><canvas id="site"></canvas></div>
  <div id="pad">
    <button class="pb" id="bL">&#9664;</button>
    <button class="pb" id="bJ">JUMP</button>
    <button class="pb" id="bR">&#9654;</button>
  </div>
</div>
<div id="veil"><div id="veilBody"></div></div>
<script>
(function(){
"use strict";
const AR = window.Arcade, $ = id => document.getElementById(id);
const cv = $('site'), g = cv.getContext('2d');
const veil = $('veil'), veilBody = $('veilBody');

const W = 300, H = 420;
let S = 1;

let decks, ladders, hazards, you, gargoyle, hammer, state;
let score, lives, stage, best, bonus, runs = 0, held = {l:false,r:false,u:false,d:false};
let sparks, cleared;

/* ---- the scaffold ------------------------------------------------------
   Each deck is a sloped plank: y at the left, y at the right. Everything the
   gargoyle throws obeys that slope, which is what makes the hazards readable
   and the route a puzzle rather than a reaction test.
   -------------------------------------------------------------------------- */
const LAYOUTS = [
  { decks:[[382,382],[330,318],[268,282],[218,206],[156,170],[104,96]],
    ladders:[[0,58],[1,232],[2,86],[3,206],[4,120]] },
  { decks:[[382,382],[326,338],[276,262],[214,226],[160,148],[104,96]],
    ladders:[[0,206],[1,72],[2,240],[3,64],[4,180]] },
  { decks:[[382,382],[334,322],[272,272],[212,224],[158,146],[104,96]],
    ladders:[[0,120],[1,244],[2,54],[3,222],[4,96]] },
  { decks:[[382,382],[322,334],[280,264],[206,220],[164,150],[104,96]],
    ladders:[[0,250],[1,60],[2,166],[3,96],[4,236]] }
];

function buildStage(){
  const L = LAYOUTS[(stage-1) % LAYOUTS.length];
  decks = L.decks.map((d,i) => ({ i, yl:d[0], yr:d[1] }));
  ladders = L.ladders.map(l => ({ deck:l[0], x:l[1] }));
  hazards = []; sparks = []; hammer = null; cleared = false;
  you = { x: 26, y: deckY(0, 26) - 9, vy:0, onDeck:0, climbing:false,
          face:1, jump:false, hammer:0, dead:0 };
  gargoyle = { x: 44, y: deckY(5, 44) - 16, throwT: 1.2, wind:0 };
  bonus = 1;
  /* the hammer sits somewhere it costs you a detour to fetch */
  hammer = { x: [210,70,180,120][(stage-1)%4], deck: 2, taken:false };
}

function deckY(i, x){
  const d = decks[i];
  return d.yl + (d.yr - d.yl) * (x / W);
}
function slopeOf(i){
  const d = decks[i];
  return (d.yr - d.yl) / W;
}

/* ---- step -------------------------------------------------------------- */
function step(dt){
  if(state !== 'play') return;
  const k = Math.min(2.4, dt*60);

  if(you.dead > 0){
    you.dead -= dt;
    if(you.dead <= 0){
      if(lives > 0) buildStage(); else gameOver();
    }
    return;
  }

  /* the gargoyle winds up, then rolls something down */
  gargoyle.throwT -= dt;
  gargoyle.wind = Math.max(0, gargoyle.wind - dt*3);
  if(gargoyle.throwT <= 0){
    gargoyle.throwT = Math.max(0.55, 1.9 - stage*0.13);
    gargoyle.wind = 0.35;
    throwMasonry();
  }

  /* --- you --- */
  const onLadder = ladderAt(you.x, you.y);
  if(you.climbing){
    /* the hammer disables climbing — that is the cost of carrying it */
    if(you.hammer > 0){ you.climbing = false; }
    else {
      if(held.u) you.y -= 0.9*k;
      if(held.d) you.y += 0.9*k;
      const top = deckY(Math.min(decks.length-1, you.onDeck+1), you.x) - 9;
      const bot = deckY(you.onDeck, you.x) - 9;
      if(you.y <= top){ you.y = top; you.onDeck++; you.climbing = false; snd.step(); }
      if(you.y >= bot){ you.y = bot; you.climbing = false; }
      if(!onLadder && !held.u && !held.d) you.climbing = false;
    }
  } else {
    let dx = 0;
    if(held.l) dx = -1.35*k;
    if(held.r) dx =  1.35*k;
    if(dx){ you.face = dx > 0 ? 1 : -1; }
    if(!you.jump){
      you.x = Math.max(8, Math.min(W-8, you.x + dx));
      you.y = deckY(you.onDeck, you.x) - 9;
      if(dx && Math.random() < 0.10) snd.step();
      if(held.u && onLadder && you.hammer <= 0 && you.onDeck < decks.length-1){
        you.climbing = true; you.x = onLadder.x;
      }
    } else {
      /* a fixed jump arc: committal, not steerable */
      you.vy += 0.34*k;
      you.y += you.vy*k;
      you.x = Math.max(8, Math.min(W-8, you.x + you.jdx*k));
      const floor = deckY(you.onDeck, you.x) - 9;
      if(you.vy > 0 && you.y >= floor){
        you.y = floor; you.jump = false; you.vy = 0; snd.land();
      }
    }
  }

  if(you.hammer > 0){
    you.hammer -= dt;
    if(you.hammer <= 0) snd.hammerOut();
  }
  if(hammer && !hammer.taken && you.onDeck === hammer.deck &&
     Math.abs(you.x - hammer.x) < 12 && Math.abs(you.y - (deckY(hammer.deck, hammer.x)-9)) < 16){
    hammer.taken = true; you.hammer = 7; snd.hammerUp();
  }

  /* --- masonry --- */
  for(let i=hazards.length-1;i>=0;i--){
    const h = hazards[i];
    if(h.falling){
      h.vy += 0.36*k; h.y += h.vy*k;
      const fy = deckY(h.deck, h.x) - 5;
      if(h.y >= fy){ h.y = fy; h.falling = false; h.vy = 0; }
    } else {
      /* rolls downhill, and gathers speed with the slope */
      const sl = slopeOf(h.deck);
      h.spin += h.dir * 0.13 * k;
      h.x += h.dir * (0.95 + Math.abs(sl)*46) * k;
      h.y = deckY(h.deck, h.x) - 5;
      /* it may take a ladder down, sometimes */
      const lad = ladders.find(l => l.deck === h.deck-1 && Math.abs(l.x - h.x) < 4);
      if(lad && h.deck > 0 && !h.tried && Math.random() < 0.35){
        h.tried = true; h.deck--; h.falling = true; h.vy = 0; h.x = lad.x;
      }
      if(h.x < -8 || h.x > W+8){
        if(h.deck > 0){ h.deck--; h.dir = -h.dir; h.falling = true; h.tried = false;
                        h.x = Math.max(-4, Math.min(W+4, h.x)); }
        else { hazards.splice(i,1); score += 5; continue; }
      }
    }
    if(Math.abs(h.x - you.x) < 10 && Math.abs(h.y - you.y) < 12){
      if(you.hammer > 0){
        hazards.splice(i,1); score += 300; snd.smash();
        for(let s2=0;s2<6;s2++) sparks.push({x:h.x,y:h.y,vx:(Math.random()-0.5)*3,vy:-Math.random()*2.4,t:1});
      } else die();
      continue;
    }
    /* jumping cleanly over one pays */
    if(you.jump && !h.scored && Math.abs(h.x - you.x) < 14 && you.y < h.y - 6){
      h.scored = true; score += 100; snd.hop();
    }
  }

  for(let i=sparks.length-1;i>=0;i--){
    const s2 = sparks[i];
    s2.x += s2.vx*k; s2.y += s2.vy*k; s2.vy += 0.22*k; s2.t -= dt*1.6;
    if(s2.t <= 0) sparks.splice(i,1);
  }

  /* the top deck is the finish */
  if(you.onDeck >= decks.length-1 && you.x > gargoyle.x - 30 && !cleared){
    cleared = true;
    score += Math.round(bonus * 5000);
    snd.clear();
    stage++;
    setTimeout(() => { if(state==='play'){ buildStage(); paintHud(); } }, 700);
  }

  bonus -= dt / (34 - Math.min(16, stage*2));
  if(bonus <= 0){ bonus = 0; die(); }
  $('barIn').style.width = Math.max(0, bonus*100) + '%';
  $('barIn').style.background = bonus < 0.25 ? '#e8484f' : '#c8a04a';
  paintHud();
}

function throwMasonry(){
  hazards.push({ x: gargoyle.x + 12, y: deckY(5, gargoyle.x+12) - 5,
                 deck: 5, dir: 1, spin: 0, falling: false, vy: 0,
                 tried: false, scored: false });
  snd.roll();
}
function ladderAt(x, y){
  for(const l of ladders){
    if(l.deck !== you.onDeck) continue;
    if(Math.abs(l.x - x) < 9) return l;
  }
  return null;
}
function jump(){
  if(state !== 'play' || you.dead > 0 || you.jump || you.climbing) return;
  you.jump = true; you.vy = -4.3;
  you.jdx = held.l ? -1.2 : held.r ? 1.2 : 0;
  snd.jump();
}
function die(){
  you.dead = 1.2; lives--; snd.die(); paintHud();
}

/* ---- audio ------------------------------------------------------------- */
const THEMES = [
  [0,0,3,5,7,5,3,0], [0,5,7,10,7,5,3,0], [0,3,7,3,10,7,5,3], [0,7,5,3,0,3,5,7]
];
const snd = {
  tick(stp, t){
    if(!AR || state !== 'play') return;
    const theme = THEMES[(stage-1) % THEMES.length];
    const base = 110;
    AR.sfx.tone({ t, freq: base * Math.pow(2, theme[stp % 8]/12),
                  dur:0.13, type:'square', gain:0.042, attack:0.004,
                  cutoff:1900, bus:'music' });
    if(stp % 4 === 0)
      AR.sfx.tone({ t, freq: base/2, dur:0.26, type:'triangle', gain:0.062,
                    attack:0.004, cutoff:400, bus:'music' });
    /* the hurry: a hard tick on the off-beats once the bonus is nearly gone */
    if(bonus < 0.25 && stp % 2 === 1)
      AR.sfx.noise({ t, freq:2600, dur:0.035, gain:0.030, filter:'highpass', bus:'music' });
  },
  jump(){ if(AR) AR.sfx.tone({ freq:340, to:680, dur:0.14, type:'square', gain:0.05, cutoff:2400 }); },
  land(){ if(AR) AR.sfx.noise({ freq:300, to:110, dur:0.07, gain:0.04, filter:'lowpass' }); },
  step(){ if(AR) AR.sfx.tone({ freq:180, dur:0.03, type:'triangle', gain:0.028 }); },
  roll(){ if(AR) AR.sfx.noise({ freq:520, to:300, dur:0.30, gain:0.05, filter:'bandpass' }); },
  hop(){ if(AR) AR.sfx.tone({ freq:700, to:1050, dur:0.10, type:'sine', gain:0.05 }); },
  smash(){ if(AR){ AR.sfx.noise({ freq:1800, to:400, dur:0.24, gain:0.09, filter:'bandpass' });
                   AR.sfx.tone({ freq:220, to:80, dur:0.20, type:'square', gain:0.05 }); } },
  hammerUp(){ if(!AR) return; [0,4,7,12].forEach((n,i) =>
    AR.sfx.tone({ t:AR.audio.now()+i*0.05, freq:440*Math.pow(2,n/12),
                  dur:0.18, type:'square', gain:0.065, cutoff:2600 })); },
  hammerOut(){ if(AR) AR.sfx.tone({ freq:520, to:180, dur:0.30, type:'square', gain:0.05, cutoff:1200 }); },
  die(){ if(AR){ AR.sfx.noise({ freq:600, to:70, dur:0.7, gain:0.10, filter:'lowpass' });
                 AR.sfx.tone({ freq:260, to:50, dur:0.75, type:'sawtooth', gain:0.07, cutoff:700 }); } },
  clear(){ if(!AR) return; [0,4,7,12,16].forEach((n,i) =>
    AR.sfx.tone({ t:AR.audio.now()+i*0.09, freq:330*Math.pow(2,n/12),
                  dur:0.34, type:'square', gain:0.075, cutoff:2800, verb:0.4 })); }
};

/* ---- draw: scaffolded cathedral ---------------------------------------- */
function fit(){
  const wrap = $('wrap');
  S = Math.min((wrap.clientWidth-4)/W, (wrap.clientHeight-4)/H);
  const dpr = Math.min(2, window.devicePixelRatio||1);
  cv.width=Math.round(W*S*dpr); cv.height=Math.round(H*S*dpr);
  cv.style.width=(W*S)+'px'; cv.style.height=(H*S)+'px';
  g.setTransform(dpr*S,0,0,dpr*S,0,0);
  draw();
}
function fitTight(){
  fit();
  for(let i=0;i<6;i++){
    const r = cv.getBoundingClientRect();
    if(r.right <= window.innerWidth && r.bottom <= $('wrap').getBoundingClientRect().bottom+1) break;
    S *= 0.97;
    const dpr = Math.min(2, window.devicePixelRatio||1);
    cv.width=Math.round(W*S*dpr); cv.height=Math.round(H*S*dpr);
    cv.style.width=(W*S)+'px'; cv.style.height=(H*S)+'px';
    g.setTransform(dpr*S,0,0,dpr*S,0,0);
  }
  draw();
}

function draw(){
  /* the cathedral wall behind: stone courses and a lancet window */
  g.fillStyle='#1a1712'; g.fillRect(0,0,W,H);
  g.fillStyle='#221d16';
  for(let y=0;y<H;y+=16){
    for(let x=(y/16%2)*20-20; x<W; x+=40) g.fillRect(x+1, y+1, 38, 14);
  }
  /* window: cold daylight, the only thing in here that is not warm */
  const wx = W*0.5, wy = 120;
  g.fillStyle='#2b3a44';
  g.beginPath();
  g.moveTo(wx-26, wy+90); g.lineTo(wx-26, wy-16);
  g.quadraticCurveTo(wx, wy-58, wx+26, wy-16);
  g.lineTo(wx+26, wy+90); g.closePath(); g.fill();
  g.fillStyle='rgba(150,190,210,.16)';
  g.beginPath();
  g.moveTo(wx-20, wy+84); g.lineTo(wx-20, wy-12);
  g.quadraticCurveTo(wx, wy-48, wx+20, wy-12);
  g.lineTo(wx+20, wy+84); g.closePath(); g.fill();
  g.strokeStyle='rgba(20,18,14,.7)'; g.lineWidth=2;
  g.beginPath(); g.moveTo(wx, wy-46); g.lineTo(wx, wy+88); g.stroke();
  for(let i=1;i<4;i++){ g.beginPath(); g.moveTo(wx-24, wy-10+i*26); g.lineTo(wx+24, wy-10+i*26); g.stroke(); }

  /* tarpaulin, sagging between two uprights */
  g.fillStyle='rgba(90,110,80,.30)';
  g.beginPath(); g.moveTo(12, 196); g.quadraticCurveTo(60, 216, 108, 194);
  g.lineTo(108, 186); g.quadraticCurveTo(60, 206, 12, 188); g.closePath(); g.fill();

  /* uprights */
  g.fillStyle='#4a3d2c';
  for(const x of [18, W-22]) g.fillRect(x, 90, 6, H-90);
  g.fillStyle='rgba(255,255,255,.10)';
  for(const x of [18, W-22]) g.fillRect(x, 90, 2, H-90);

  /* ladders behind the decks */
  for(const l of ladders){
    const y0 = deckY(l.deck, l.x), y1 = deckY(l.deck+1, l.x);
    g.strokeStyle='#6b5636'; g.lineWidth=2;
    g.beginPath(); g.moveTo(l.x-5, y0); g.lineTo(l.x-5, y1); g.stroke();
    g.beginPath(); g.moveTo(l.x+5, y0); g.lineTo(l.x+5, y1); g.stroke();
    g.lineWidth=1.6; g.strokeStyle='#8a7048';
    for(let y=y1+6; y<y0; y+=8){ g.beginPath(); g.moveTo(l.x-5,y); g.lineTo(l.x+5,y); g.stroke(); }
  }

  /* the decks: scaffold planks, lit along the top edge */
  for(const d of decks){
    g.save();
    g.beginPath(); g.moveTo(0, d.yl); g.lineTo(W, d.yr);
    g.lineTo(W, d.yr+9); g.lineTo(0, d.yl+9); g.closePath();
    g.fillStyle='#5a4830'; g.fill();
    g.clip();
    g.strokeStyle='rgba(30,24,16,.5)'; g.lineWidth=1;
    for(let x=0;x<W;x+=26){
      const yy = d.yl + (d.yr-d.yl)*(x/W);
      g.beginPath(); g.moveTo(x, yy-2); g.lineTo(x, yy+11); g.stroke();
    }
    g.restore();
    g.strokeStyle='rgba(255,225,180,.35)'; g.lineWidth=1.6;
    g.beginPath(); g.moveTo(0, d.yl+0.8); g.lineTo(W, d.yr+0.8); g.stroke();
    g.strokeStyle='rgba(0,0,0,.45)'; g.lineWidth=2;
    g.beginPath(); g.moveTo(0, d.yl+9); g.lineTo(W, d.yr+9); g.stroke();
  }

  if(hammer && !hammer.taken){
    const hy = deckY(hammer.deck, hammer.x) - 9;
    g.save(); g.translate(hammer.x, hy + Math.sin(performance.now()/300)*1.5);
    g.fillStyle='#8a6a3f'; g.fillRect(-1, -2, 2, 9);
    g.fillStyle='#b8b2a6'; g.fillRect(-5, -7, 10, 6);
    g.fillStyle='rgba(255,255,255,.4)'; g.fillRect(-5, -7, 10, 1.6);
    g.restore();
  }

  for(const h of hazards) masonry(h);
  gargoyleAt(gargoyle.x, gargoyle.y);
  if(you.dead <= 0 && state === 'play') figure(you.x, you.y);

  for(const s2 of sparks){
    g.fillStyle = 'rgba(220,200,170,'+Math.max(0,s2.t)+')';
    g.fillRect(s2.x-1, s2.y-1, 2.4, 2.4);
  }
}

function masonry(h){
  g.save(); g.translate(h.x, h.y); g.rotate(h.spin);
  g.fillStyle='#7d6f5c'; g.fillRect(-5,-5,10,10);
  g.fillStyle='rgba(255,255,255,.22)'; g.fillRect(-5,-5,10,3);
  g.fillStyle='rgba(0,0,0,.34)'; g.fillRect(-5,2,10,3);
  g.strokeStyle='rgba(30,24,16,.45)'; g.lineWidth=1;
  g.beginPath(); g.moveTo(-5,0); g.lineTo(5,0); g.stroke();
  g.restore();
}

function figure(x, y){
  /* a small restorer in a hi-vis vest, so you can always find yourself */
  g.save(); g.translate(x, y);
  g.fillStyle='#2e2a26'; g.fillRect(-3, 2, 2.6, 7);  g.fillRect(0.4, 2, 2.6, 7);
  g.fillStyle= you.hammer > 0 ? '#ffd23c' : '#ff6b2c';
  g.fillRect(-4, -5, 8, 8);
  g.fillStyle='rgba(255,255,255,.35)'; g.fillRect(-4,-5,8,1.6);
  g.fillStyle='#d9b48a'; g.beginPath(); g.arc(0,-8, 3, 0, 6.2832); g.fill();
  g.fillStyle='#e8e2d6'; g.beginPath(); g.arc(0,-9, 3.2, Math.PI, 0); g.fill();
  if(you.hammer > 0){
    g.save(); g.rotate(Math.sin(performance.now()/70)*0.7);
    g.fillStyle='#8a6a3f'; g.fillRect(you.face*3, -8, 2, 8);
    g.fillStyle='#b8b2a6'; g.fillRect(you.face*1, -12, 6, 5);
    g.restore();
  }
  g.restore();
}

function gargoyleAt(x, y){
  g.save(); g.translate(x, y);
  const lean = gargoyle.wind > 0 ? -0.3 : 0;
  g.rotate(lean);
  g.fillStyle='#5f5a52';
  /* haunches and body */
  g.beginPath(); g.ellipse(0, 2, 12, 9, 0, 0, 6.2832); g.fill();
  /* wings, folded and ribbed */
  g.fillStyle='#4a453e';
  g.beginPath(); g.moveTo(-6,-2); g.lineTo(-18,-10); g.lineTo(-15,3); g.closePath(); g.fill();
  g.beginPath(); g.moveTo( 6,-2); g.lineTo( 18,-10); g.lineTo( 15,3); g.closePath(); g.fill();
  g.strokeStyle='rgba(20,18,14,.5)'; g.lineWidth=1;
  g.beginPath(); g.moveTo(-6,-2); g.lineTo(-15,-6); g.stroke();
  g.beginPath(); g.moveTo( 6,-2); g.lineTo( 15,-6); g.stroke();
  /* head: a snout and two horns */
  g.fillStyle='#6b665c';
  g.beginPath(); g.ellipse(3, -9, 7, 5.5, 0, 0, 6.2832); g.fill();
  g.beginPath(); g.moveTo(9,-10); g.lineTo(15,-8); g.lineTo(9,-6); g.closePath(); g.fill();
  g.fillStyle='#4a453e';
  g.beginPath(); g.moveTo(-2,-13); g.lineTo(-4,-18); g.lineTo(0,-14); g.closePath(); g.fill();
  g.beginPath(); g.moveTo( 3,-14); g.lineTo( 3,-19); g.lineTo( 6,-14); g.closePath(); g.fill();
  /* the eye, the one warm thing in the stone */
  g.fillStyle='#ff6b2c';
  g.beginPath(); g.arc(5,-10, 1.6, 0, 6.2832); g.fill();
  /* lit from above, like everything carved */
  g.fillStyle='rgba(255,255,255,.14)';
  g.beginPath(); g.ellipse(0, -3, 11, 4, 0, 0, 6.2832); g.fill();
  g.restore();
}

function paintHud(){
  $('sc').textContent=score.toLocaleString();
  $('st').textContent=stage;
  $('lv').textContent=Math.max(0,lives);
}

let last=0;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(0.05,(now-last)/1000)||0; last=now;
  step(dt); draw();
}

/* ---- state ------------------------------------------------------------- */
function reset(){ score=0; lives=3; stage=1; buildStage(); paintHud(); }
function start(){
  runs++; reset(); state='play'; veil.classList.add('hidden'); fitTight();
  if(AR && AR.music){ AR.music.stop(); AR.music.start(126, 4, snd.tick); }
}
function gameOver(){
  state='over';
  if(AR && AR.music) AR.music.stop();
  const sv = AR&&AR.save ? AR.save.get('girder') : null;
  best = Math.max((sv&&sv.best)||0, score);
  if(AR && AR.save) AR.save.merge('girder', { best, stage, label:'BEST '+best.toLocaleString() });
  showOver();
}

function openVeil(html, acts){
  veilBody.innerHTML=html; veil.classList.remove('hidden');
  veilBody.querySelectorAll('[data-act]').forEach(b =>
    b.addEventListener('click', ()=>{ const fn=acts&&acts[b.dataset.act]; if(fn) fn(); }));
}
function showTitle(){
  state='title';
  openVeil('<h1>Girder</h1>' +
    '<div class="tmenu">' +
      '<button class="btn" data-act="play">PLAY</button>' +
      '<button class="btn ghost" data-act="opts">OPTIONS</button>' +
      '<button class="btn ghost" data-act="quit">QUIT</button>' +
    '</div>', { play:start, opts:showOptions, quit:()=>{ if(AR&&AR.home) AR.home(); } });
}
function showOptions(){
  openVeil('<div class="eyebrow">GIRDER</div><h1>Options</h1>' +
    '<div class="tmenu">' +
      '<button class="btn ghost" data-act="ctrl">CONTROLS</button>' +
      '<button class="btn" data-act="back">BACK</button>' +
    '</div>', { ctrl:showControls, back:showTitle });
}
function showControls(){
  const touch=!!(AR&&AR.touch);
  const rows=[
    [touch?'Hold \u25C0 \u25B6':'Arrow keys','run along the plank'],
    [touch?'JUMP':'Space','a fixed arc \u2014 you cannot steer it'],
    [touch?'Hold \u25C0 or \u25B6 while jumping':'Hold an arrow','sets the arc before you leave'],
    ['Stand at a ladder, press up','climb'],
    ['The hammer','smashes masonry, but you cannot climb with it']
  ];
  openVeil('<div class="eyebrow">'+(touch?'TOUCH':'KEYBOARD')+'</div><h1>Controls</h1>' +
    '<div class="ctrls">'+rows.map(r=>'<div class="crow"><b>'+r[0]+'</b><i>'+r[1]+'</i></div>').join('')+'</div>' +
    '<button class="btn" data-act="back" style="margin-top:16px">BACK</button>', { back:showOptions });
}
function showOver(){
  openVeil('<div class="eyebrow">IT GOT YOU</div>' +
    '<h1>'+score.toLocaleString()+'<em>FINAL SCORE</em></h1>' +
    '<div class="grid2">' +
      '<div class="gc"><span>STAGE</span><b>'+stage+'</b></div>' +
      '<div class="gc"><span>BEST</span><b>'+best.toLocaleString()+'</b></div>' +
    '</div>' +
    '<div class="tmenu">' +
      '<button class="btn" data-act="again">PLAY AGAIN</button>' +
      '<button class="btn ghost" data-act="title">TITLE</button>' +
    '</div>', { again:start, title:showTitle });
}

/* ---- input ------------------------------------------------------------- */
function bind(el, key){
  const on = e => { e.preventDefault(); held[key]=true; };
  const off = e => { e.preventDefault(); held[key]=false; };
  el.addEventListener('pointerdown', on);
  el.addEventListener('pointerup', off);
  el.addEventListener('pointercancel', off);
  el.addEventListener('pointerleave', off);
}
bind($('bL'),'l'); bind($('bR'),'r');
$('bJ').addEventListener('pointerdown', e => { e.preventDefault(); jump(); });
/* dragging up anywhere on the scaffold climbs, which saves a fourth button */
let ty=0, tdown=false;
cv.addEventListener('pointerdown', e => { tdown=true; ty=e.clientY; });
cv.addEventListener('pointermove', e => {
  if(!tdown) return;
  const d = e.clientY - ty;
  held.u = d < -12; held.d = d > 12;
});
cv.addEventListener('pointerup', ()=>{ tdown=false; held.u=held.d=false; });
cv.addEventListener('pointercancel', ()=>{ tdown=false; held.u=held.d=false; });

window.addEventListener('keydown', e => {
  if(state!=='play'){
    if(e.key==='Enter'||e.key===' '){ const b=veilBody.querySelector('.btn'); if(b){ e.preventDefault(); b.click(); } }
    return;
  }
  if(e.key==='ArrowLeft'){ e.preventDefault(); held.l=true; }
  else if(e.key==='ArrowRight'){ e.preventDefault(); held.r=true; }
  else if(e.key==='ArrowUp'){ e.preventDefault(); held.u=true; }
  else if(e.key==='ArrowDown'){ e.preventDefault(); held.d=true; }
  else if(e.key===' '){ e.preventDefault(); jump(); }
});
window.addEventListener('keyup', e => {
  if(e.key==='ArrowLeft') held.l=false;
  else if(e.key==='ArrowRight') held.r=false;
  else if(e.key==='ArrowUp') held.u=false;
  else if(e.key==='ArrowDown') held.d=false;
});
if(AR && AR.pad) AR.pad.onPress(name => {
  if(AR.paused&&AR.paused()) return;
  if(state!=='play'){ if(name==='a'||name==='start'){ const b=veilBody.querySelector('.btn'); if(b) b.click(); } return; }
  if(name==='a') jump();
});
/* Arcade.pad has no onHold — it exposes down(name), polled. Calling a method
   that does not exist would have thrown the instant a pad was connected, and
   nothing in the test rig has a gamepad to catch it. */
setInterval(() => {
  if(!AR || !AR.pad || !AR.pad.connected || !AR.pad.connected()) return;
  if(state !== 'play') return;
  held.l = AR.pad.down('left');
  held.r = AR.pad.down('right');
  held.u = AR.pad.down('up');
  held.d = AR.pad.down('down');
}, 16);
if(AR && AR.onRestart) AR.onRestart(start);
window.addEventListener('resize', fitTight);
if(window.ResizeObserver) new ResizeObserver(fitTight).observe($('wrap'));

const sv0 = AR&&AR.save ? AR.save.get('girder') : null;
best=(sv0&&sv0.best)||0;
reset(); fit(); showTitle();
requestAnimationFrame(()=>{ fitTight(); setTimeout(fitTight,200); });
requestAnimationFrame(frame);
})();
</script>

<span>TINY ARCADE IS PLAYED UPRIGHT</span></div></div>
<script>
/* only a device with a coarse pointer gets the portrait lock — a desktop
   window is free to be any shape, and wide is the better shape there */
(function(){
  if(matchMedia('(pointer:coarse)').matches) document.body.classList.add('lock-portrait');
  /* an installed app can genuinely lock; a tab cannot, and throwing is fine */
  try{ if(screen.orientation && screen.orientation.lock)
        screen.orientation.lock('portrait').catch(function(){}); }catch(e){}
})();
</script>
