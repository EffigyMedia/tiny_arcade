<style>
@font-face{font-family:"Major Mono Display";font-style:normal;font-weight:400;font-display:swap;src:url("../../fonts/majormonodisplay-400.woff2") format("woff2")}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0b0d0e;
  font-family:"Cutive Mono",ui-monospace,monospace;color:#d6dbd2;
  user-select:none;-webkit-user-select:none}
#stage{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:var(--safe-top,0px)}

  padding:9px 14px 5px;font-size:9px;letter-spacing:.20em;color:#6d7566}

  padding:0 6px calc(6px + var(--safe-bot,0px))}

  box-shadow:0 0 0 1px #232620, 0 18px 50px -20px #000}

  padding:26px;text-align:center;z-index:40}

  letter-spacing:-.02em;line-height:1;color:#eef2e8}

  font-weight:400;letter-spacing:.24em;color:#6d7566;margin-top:9px}

  font-size:11.5px;letter-spacing:.18em;background:#c3ff4a;color:#12180a}

  border-bottom:1px solid rgba(255,255,255,.07);font-size:12px;text-align:left}

/* ---------------------------------------------------------------------------
   PORTRAIT ON A PHONE, WIDE ON A DESKTOP

   The manifest pins the INSTALLED app to portrait, but a browser tab cannot be
   forced — `screen.orientation.lock()` only works from fullscreen and throws
   everywhere else. So: on a touch device held sideways, a panel asks for it
   back. On a desktop there is no such thing as the wrong orientation, and a
   wide window is exactly what we want, so the panel never appears there.

   The test is POINTER TYPE, not width. A landscape phone and a small laptop
   window are the same number of pixels and want opposite things.
   --------------------------------------------------------------------------- */
#rotate{
  position:fixed;inset:0;z-index:9000;display:none;
  place-items:center;text-align:center;padding:28px;
  background:#07050b;color:#e8e2f4;
  font-family:var(--px,ui-monospace,monospace);
}
#rotate b{display:block;font-size:12px;letter-spacing:.22em;color:var(--gold,#e8b23a);margin-bottom:14px}
#rotate span{display:block;font-size:10px;letter-spacing:.14em;color:#8a8296;line-height:2}
#rotate i{display:block;width:52px;height:82px;margin:0 auto 22px;
  border:2px solid rgba(232,178,58,.65);border-radius:8px;
  transform:rotate(90deg);animation:rot 2.4s ease-in-out infinite}
@keyframes rot{0%,40%{transform:rotate(90deg)}60%,100%{transform:rotate(0deg)}}
@media (orientation:landscape) and (pointer:coarse){
  body.lock-portrait #rotate{display:grid}
}

#titleArt{position:absolute;inset:0;z-index:29;display:none;width:100%;height:100%}
body.titling #titleArt{display:block}
body.titling #veil{
  background:linear-gradient(180deg, rgba(2,6,8,0) 0%, rgba(2,6,8,0) 60%,
    rgba(2,6,8,.55) 72%, rgba(2,6,8,.93) 86%, rgba(2,6,8,.97) 100%);
  align-items:end;padding-bottom:34px}
body.titling #veil h1{display:none}
.legal{margin-top:14px;font-size:8px;letter-spacing:.14em;
  color:rgba(255,255,255,.24);text-align:center}
</style>

<body>
<div id="stage">
  <div id="head">
    <div>SCORE <b id="sc">0</b></div>
    <div>WAVE <b id="wv">1</b></div>
    <div>LIVES <b id="lv">3</b></div>
  </div>
  <div id="wrap"><canvas id="plate"></canvas></div>
</div>
<canvas id="titleArt"></canvas>
<div id="veil"><div id="veilBody"></div></div>
<script>
(function(){
"use strict";
const AR = window.Arcade, $ = id => document.getElementById(id);
const cv = $('plate'), g = cv.getContext('2d');
const veil = $('veil'), veilBody = $('veilBody');

/* Logical field: 320 x 440. */
const W = 320, H = 440;
let S = 1;

const ROWS = 5, COLS = 11;
let form, dir, dropPending, shot, bombs, shields, ship, bonus;
let score, lives, wave, best, state, alive, marchAcc, stepIdx, runs = 0;
let deadT = 0, flashes = [];

/* ---- the ranks ---------------------------------------------------------
   Three body plans, worst at the back. Drawn as pale silhouettes on a grey
   wash with a suggestion of structure inside — an x-ray plate of something
   marine, rather than green pixel aliens. */
const PLAN = ['medusa','crab','louse'];
function planFor(r){ return r === 0 ? 'medusa' : r < 3 ? 'crab' : 'louse'; }
function valueFor(r){ return r === 0 ? 30 : r < 3 ? 20 : 10; }

function buildWave(){
  form = [];
  const x0 = 26, y0 = 58 + Math.min(60, (wave-1) * 8), dx = 25, dy = 24;
  for(let r=0;r<ROWS;r++)
    for(let c=0;c<COLS;c++)
      form.push({ x:x0 + c*dx, y:y0 + r*dy, r, c, alive:true,
                  plan:planFor(r), val:valueFor(r), wob:0 });
  alive = form.length;
  dir = 1; dropPending = false; marchAcc = 0; stepIdx = 0;
  bombs = []; shot = null; bonus = null;
}

function buildShields(){
  /* Four blocks, each a grid of cells that erode one at a time. */
  shields = [];
  const bw = 7, bh = 5, cell = 5;
  for(let i=0;i<4;i++){
    const ox = 30 + i * 70, oy = H - 92;
    const cells = [];
    for(let r=0;r<bh;r++)
      for(let c=0;c<bw;c++){
        /* notch the underside so it reads as a bunker */
        if(r >= bh-2 && c > 1 && c < bw-2) continue;
        cells.push({ x:ox + c*cell, y:oy + r*cell, hp:2 });
      }
    shields.push(cells);
  }
}

/* ---- march -------------------------------------------------------------
   The formation speeds up as it thins, so killing them is what makes them
   dangerous. This is the whole design and the tempo is the readout. */
function stepInterval(){
  const frac = alive / (ROWS*COLS);
  const base = 0.62 - (wave-1)*0.045;
  return Math.max(0.055, base * (0.22 + frac*0.78));
}

function march(){
  let hitEdge = false;
  for(const e of form){
    if(!e.alive) continue;
    const nx = e.x + dir * 8;
    if(nx < 12 || nx > W - 24) hitEdge = true;
  }
  if(hitEdge){
    dir = -dir;
    for(const e of form) if(e.alive) e.y += 14;
  } else {
    for(const e of form) if(e.alive) e.x += dir * 8;
  }
  stepIdx = (stepIdx + 1) % 4;
  snd.march(stepIdx);
  for(const e of form) if(e.alive) e.wob = e.wob ? 0 : 1;

  /* they drop when they are close and when there are few of them */
  const chance = 0.08 + (1 - alive/(ROWS*COLS)) * 0.30 + (wave-1)*0.03;
  if(Math.random() < chance) dropBomb();

  for(const e of form){
    if(!e.alive) continue;
    if(e.y > H - 96){ landfall(); return; }
  }
}

function dropBomb(){
  /* only the lowest of a column can fire — the rank in front shields the rest */
  const cols = {};
  for(const e of form){
    if(!e.alive) continue;
    if(!cols[e.c] || e.y > cols[e.c].y) cols[e.c] = e;
  }
  const keys = Object.keys(cols);
  if(!keys.length) return;
  const e = cols[keys[(Math.random()*keys.length)|0]];
  bombs.push({ x:e.x + 8, y:e.y + 14, vy: 1.5 + wave*0.12, wig:Math.random()*6.28 });
}

/* ---- step -------------------------------------------------------------- */
function step(dt){
  if(state !== 'play'){ return; }
  const k = Math.min(2.2, dt*60);

  if(deadT > 0){ deadT -= dt; if(deadT <= 0) respawn(); return; }

  marchAcc += dt;
  if(marchAcc >= stepInterval()){ marchAcc = 0; march(); }
  /* Keep the shell's music clock in step with the formation. The march is the
     bed — there is no separate loop — so the tempo the player hears IS the
     difficulty readout, and re-arming it here keeps the two from drifting. */
  const want = Math.round(60 / Math.max(0.055, stepInterval()));
  if(want !== bedBpm){ bedBpm = want; armBed(); }

  /* the one shot */
  if(shot){
    shot.y -= 6.2 * k;
    if(shot.y < 30){ shot = null; }
    else {
      if(hitShields(shot.x, shot.y, true)) shot = null;
    }
    if(shot){
      for(const e of form){
        if(!e.alive) continue;
        if(shot.x > e.x-2 && shot.x < e.x+18 && shot.y > e.y-2 && shot.y < e.y+15){
          e.alive = false; alive--;
          score += e.val * wave;
          flashes.push({ x:e.x+8, y:e.y+7, t:1 });
          shot = null; snd.hit(e.r);
          if(alive <= 0) nextWave();
          break;
        }
      }
    }
    if(shot && bonus && shot.x > bonus.x-4 && shot.x < bonus.x+26 &&
       shot.y > bonus.y-4 && shot.y < bonus.y+12){
      score += bonus.val * wave;
      flashes.push({ x:bonus.x+11, y:bonus.y+5, t:1 });
      bonus = null; shot = null; snd.bonusHit();
    }
  }

  for(let i=bombs.length-1;i>=0;i--){
    const b = bombs[i];
    b.y += b.vy * k;
    b.wig += 0.3 * k;
    if(b.y > H){ bombs.splice(i,1); continue; }
    if(hitShields(b.x, b.y, false)){ bombs.splice(i,1); continue; }
    if(b.y > H-42 && b.y < H-26 && Math.abs(b.x - ship.x) < 13){
      bombs.splice(i,1); killShip(); continue;
    }
  }

  /* the bonus craft */
  if(!bonus && Math.random() < 0.0016 * k * 60){
    const fromLeft = Math.random() < 0.5;
    bonus = { x: fromLeft ? -26 : W, vx: fromLeft ? 0.9 : -0.9,
              y: 40, val: [50,100,150,300][(Math.random()*4)|0] };
    snd.bonusIn();
  }
  if(bonus){
    bonus.x += bonus.vx * k;
    if(bonus.x < -40 || bonus.x > W + 40) bonus = null;
  }

  for(let i=flashes.length-1;i>=0;i--){ flashes[i].t -= 0.07*k; if(flashes[i].t<=0) flashes.splice(i,1); }
  paintHud();
}

function hitShields(x, y, fromPlayer){
  for(const block of shields){
    for(let i=0;i<block.length;i++){
      const c = block[i];
      if(x < c.x || x > c.x+5 || y < c.y || y > c.y+5) continue;
      c.hp--;
      snd.chip();
      if(c.hp <= 0) block.splice(i,1);
      return true;
    }
  }
  return false;
}

function fire(){
  if(state !== 'play' || shot || deadT > 0) return;
  /* ONE shot in flight. Every trigger pull is a decision. */
  shot = { x: ship.x, y: H - 46 };
  snd.fire();
}

function killShip(){
  lives--;
  deadT = 1.1;
  snd.die();
  flashes.push({ x:ship.x, y:H-36, t:1.6 });
  paintHud();
  if(lives <= 0) gameOver();
}
function respawn(){ ship.x = W/2; bombs = []; }
function landfall(){ lives = 0; snd.die(); gameOver(); }

function nextWave(){
  wave++;
  snd.wave();
  score += 150 * wave;
  buildWave();
  paintHud();
}

/* ---- audio ------------------------------------------------------------- */
const MARCH = [55.00, 51.91, 49.00, 46.25];   /* four notes, walking down */

/* The bed is the march itself. Arcade.music.start owns the clock so the bed
   sits on the music bus, obeys the music mute and the volume slider, and stops
   with the game — everything a separate loop would have given us, without a
   second thing to keep in sync with the formation. */
let bedBpm = 0;
function armBed(){
  if(!AR || !AR.music) return;
  AR.music.stop();
  AR.music.start(bedBpm || 96, 1, () => {});
}
function stopBed(){ if(AR && AR.music) AR.music.stop(); bedBpm = 0; }
const snd = {
  march(i){
    if(!AR) return;
    /* the bed IS the march — no separate loop, so tempo is difficulty */
    AR.sfx.tone({ freq:MARCH[i], dur:0.16, type:'square', gain:0.085,
                  attack:0.004, cutoff:420, bus:'music' });
    AR.sfx.tone({ freq:MARCH[i]*2, dur:0.10, type:'triangle', gain:0.030,
                  attack:0.004, cutoff:700, bus:'music' });
  },
  fire(){ if(AR) AR.sfx.tone({ freq:760, to:1500, dur:0.10, type:'square', gain:0.055, cutoff:2600 }); },
  hit(row){ if(AR){ AR.sfx.noise({ freq:1400 - row*160, dur:0.13, gain:0.075, filter:'bandpass' });
                    AR.sfx.tone({ freq:400 - row*40, to:120, dur:0.12, type:'square', gain:0.04 }); } },
  chip(){ if(AR) AR.sfx.noise({ freq:2600, dur:0.035, gain:0.035, filter:'highpass' }); },
  die(){ if(AR){ AR.sfx.noise({ freq:700, to:90, dur:0.75, gain:0.11, filter:'lowpass' });
                 AR.sfx.tone({ freq:180, to:40, dur:0.8, type:'sawtooth', gain:0.07, cutoff:600 }); } },
  bonusIn(){ if(!AR) return;
    for(let i=0;i<8;i++) AR.sfx.tone({ t:AR.audio.now() + i*0.07,
      freq: i%2 ? 880 : 660, dur:0.06, type:'sine', gain:0.035 }); },
  bonusHit(){ if(!AR) return; [0,1,2,3].forEach(i =>
    AR.sfx.tone({ t:AR.audio.now() + i*0.05, freq:660*Math.pow(1.26,i),
                  dur:0.16, type:'sine', gain:0.07, verb:0.4 })); },
  wave(){ if(AR) AR.sfx.tone({ freq:220, to:660, dur:0.5, type:'square', gain:0.075, cutoff:2000 }); }
};

/* ---- draw -------------------------------------------------------------- */
function fit(){
  const wrap = $('wrap');
  const aw = wrap.clientWidth - 4, ah = wrap.clientHeight - 4;
  S = Math.min(aw / W, ah / H);
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(W*S*dpr); cv.height = Math.round(H*S*dpr);
  cv.style.width = (W*S)+'px'; cv.style.height = (H*S)+'px';
  g.setTransform(dpr*S,0,0,dpr*S,0,0);
  draw();
}
function fitTight(){
  fit();
  for(let i=0;i<6;i++){
    const r = cv.getBoundingClientRect();
    if(r.right <= window.innerWidth && r.bottom <= $('wrap').getBoundingClientRect().bottom + 1) break;
    S *= 0.97;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(W*S*dpr); cv.height = Math.round(H*S*dpr);
    cv.style.width = (W*S)+'px'; cv.style.height = (H*S)+'px';
    g.setTransform(dpr*S,0,0,dpr*S,0,0);
  }
  draw();
}

/* the specimens, as pale forms with structure showing through */
function creature(x, y, plan, wob){
  const white = '#e8ede2';
  g.fillStyle = white;
  if(plan === 'medusa'){
    g.beginPath(); g.ellipse(x+8, y+5, 8, 5.5, 0, Math.PI, 0); g.fill();
    g.fillRect(x, y+5, 16, 2);
    for(let i=0;i<4;i++){
      const tx = x + 2 + i*4 + (wob ? 1 : -1);
      g.fillRect(tx, y+7, 1.6, 6 + (i%2)*2);
    }
  } else if(plan === 'crab'){
    g.fillRect(x+3, y+2, 10, 8);
    g.fillRect(x+1, y+4, 2, 4); g.fillRect(x+13, y+4, 2, 4);
    g.fillRect(x + (wob?0:2), y+10, 3, 3);
    g.fillRect(x+11 + (wob?2:0), y+10, 3, 3);
    g.fillRect(x+5, y, 2, 2); g.fillRect(x+9, y, 2, 2);
  } else {
    g.beginPath(); g.ellipse(x+8, y+6, 7, 5, 0, 0, 6.2832); g.fill();
    for(let i=0;i<3;i++){
      g.fillRect(x+2 + i*5, y+10, 1.5, wob ? 4 : 3);
      g.fillRect(x+2 + i*5, y+1, 1.5, wob ? 3 : 4);
    }
  }
  /* the bone: a darker core, so it reads as a plate rather than a sticker */
  g.fillStyle = 'rgba(20,24,20,.42)';
  if(plan === 'medusa') g.fillRect(x+6, y+1, 4, 3);
  else if(plan === 'crab'){ g.fillRect(x+6, y+4, 4, 4); }
  else g.fillRect(x+6, y+4, 4, 3);
}

function draw(){
  g.fillStyle = '#131615';
  g.fillRect(0,0,W,H);
  /* the wash: a plate, slightly uneven */
  const wash = g.createLinearGradient(0,0,0,H);
  wash.addColorStop(0,'rgba(255,255,255,.045)');
  wash.addColorStop(0.5,'rgba(255,255,255,.015)');
  wash.addColorStop(1,'rgba(0,0,0,.20)');
  g.fillStyle = wash; g.fillRect(0,0,W,H);

  g.strokeStyle = 'rgba(195,255,74,.16)';
  g.lineWidth = 1;
  g.beginPath(); g.moveTo(0, H-24.5); g.lineTo(W, H-24.5); g.stroke();

  for(const e of form) if(e.alive) creature(e.x, e.y, e.plan, e.wob);

  if(bonus){
    g.fillStyle = '#c3ff4a';
    g.beginPath(); g.ellipse(bonus.x+11, bonus.y+5, 12, 4.5, 0, 0, 6.2832); g.fill();
    g.fillStyle = 'rgba(20,24,20,.5)';
    g.fillRect(bonus.x+7, bonus.y+3, 8, 3);
  }

  for(const block of shields)
    for(const c of block){
      g.fillStyle = c.hp > 1 ? 'rgba(195,255,74,.72)' : 'rgba(195,255,74,.34)';
      g.fillRect(c.x, c.y, 5, 5);
    }

  if(shot){ g.fillStyle = '#eef2e8'; g.fillRect(shot.x-1, shot.y-7, 2, 8); }

  for(const b of bombs){
    g.fillStyle = '#e8ede2';
    const wig = Math.sin(b.wig) * 1.6;
    g.fillRect(b.x-1+wig, b.y-5, 2, 4);
    g.fillRect(b.x-1-wig, b.y-1, 2, 4);
  }

  if(deadT <= 0 || Math.floor(deadT*10) % 2 === 0){
    g.fillStyle = '#c3ff4a';
    g.fillRect(ship.x-12, H-34, 24, 6);
    g.fillRect(ship.x-3, H-40, 6, 6);
    g.fillStyle = 'rgba(255,255,255,.4)';
    g.fillRect(ship.x-12, H-34, 24, 1.5);
  }

  for(const f of flashes){
    g.fillStyle = 'rgba(255,255,255,' + Math.min(1,f.t) + ')';
    const rr = (1.4-Math.min(1,f.t)) * 12;
    g.beginPath(); g.arc(f.x, f.y, rr, 0, 6.2832); g.fill();
  }
}

function paintHud(){
  $('sc').textContent = score.toLocaleString();
  $('wv').textContent = wave;
  $('lv').textContent = Math.max(0, lives);
}

let last = 0;
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(0.05,(now-last)/1000) || 0;
  last = now;
  step(dt); draw();
}

/* ---- state ------------------------------------------------------------- */
function reset(){
  score = 0; lives = 3; wave = 1; deadT = 0; flashes = [];
  ship = { x: W/2 };
  buildWave(); buildShields(); paintHud();
}
function start(){ runs++; reset(); state='play'; document.body.classList.remove('titling');
  veil.classList.add('hidden'); fitTight(); bedBpm = 96; armBed(); }
function gameOver(){
  state = 'over';
  stopBed();
  const sv = AR && AR.save ? AR.save.get('phalanx') : null;
  best = Math.max((sv && sv.best) || 0, score);
  if(AR && AR.save) AR.save.merge('phalanx', { best, wave, label:'BEST ' + best.toLocaleString() });
  showOver();
}

/* ---- panels ------------------------------------------------------------ */
function openVeil(html, acts){
  veilBody.innerHTML = html;
  veil.classList.remove('hidden');
  veilBody.querySelectorAll('[data-act]').forEach(b =>
    b.addEventListener('click', () => { const fn = acts && acts[b.dataset.act]; if(fn) fn(); }));
}

/* ===========================================================================
   TITLE: THE FORMATION

   "Thinning them is what makes them fast. The last one is the worst." So the
   card shows a RANK \u2014 a full grid of them, filling the top of the frame, with
   gaps where the ones you have already killed used to be. The gaps are the
   point: an intact wall is a wall, but a wall with holes in it is a threat
   that has been provoked.

   Everything is drawn on a hard pixel grid because the game is, and the rank
   is drawn from THIS GAME'S creatures - medusa, crab, louse - not from the
   generic pixel invader the first version of this card borrowed.
   =========================================================================== */
let titleCv = null, titleT = 0;

function drawTitleArt(){
  if(!titleCv) titleCv = document.getElementById('titleArt');
  if(!titleCv) return;
  if(!titleT) titleT = performance.now();
  const T = (performance.now() - titleT) / 1000;
  const g = titleCv.getContext('2d');
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = titleCv.clientWidth, h = titleCv.clientHeight;
  if(titleCv.width !== w*dpr){ titleCv.width = w*dpr; titleCv.height = h*dpr; }
  g.setTransform(dpr,0,0,dpr,0,0);

  /* ---- the void ---------------------------------------------------------- */
  const sky = g.createLinearGradient(0,0,0,h);
  sky.addColorStop(0,   '#05080a');
  sky.addColorStop(0.55,'#08120e');
  sky.addColorStop(1,   '#02060a');
  g.fillStyle = sky; g.fillRect(0,0,w,h);
  /* a faint green ground-glow from whatever they are descending toward */
  g.save(); g.globalCompositeOperation = 'lighter';
  const gl = g.createRadialGradient(w*0.5, h*1.02, 0, w*0.5, h*1.02, h*0.62);
  gl.addColorStop(0,'rgba(140,255,90,.14)'); gl.addColorStop(1,'rgba(120,220,80,0)');
  g.fillStyle = gl; g.fillRect(0,0,w,h);
  g.restore();
  for(let i=0;i<90;i++){
    const sx = (i*113.7)%w, sy = (i*57.1)%h;
    g.fillStyle = 'rgba(200,230,220,'+(0.36*((i%7)/7+0.25))+')';
    g.fillRect(sx, sy, 1.2, 1.2);
  }

  /* ---- the rank ----------------------------------------------------------
     Eight across, four deep. A fixed pattern of casualties, so the same holes
     are there every time \u2014 a formation that has been FOUGHT, not one that is
     randomly moth-eaten. The whole rank steps sideways and down, as it does in
     the game.
     ------------------------------------------------------------------------ */
  const COLS = 8, ROWS = 4;
  const cw = w*0.098, chh = h*0.043;
  const step = Math.floor(T*1.6);
  const sway = ((step % 8) < 4 ? (step % 4) : 3 - (step % 4)) - 1.5;
  const originX = w*0.5 - (COLS-1)*cw*0.5 + sway*cw*0.16;
  const originY = h*0.325 + Math.floor(step/8)*0 ;
  const DEAD = [3,9,10,17,22,25,26,30];        /* the ones you got */

  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      const idx = r*COLS + c;
      if(DEAD.indexOf(idx) >= 0) continue;
      const x = originX + c*cw, y = originY + r*chh*1.55;
      /* ---- THE CARD DREW SOMEBODY ELSE'S ALIEN ---------------------------
         This block used to render the generic pixel invader - antennae, the
         two-frame leg shuffle, the whole icon - while the game itself has drawn
         its own medusa, crab and louse since it was built. That is what the
         clone posture forbids in as many words ("no lifted sprite shapes"), and
         it sat on the front door of the cabinet carrying this shelf's legal
         exposure, advertising art the machine does not contain.

         It draws the game's own three body plans now, at title scale, from the
         same silhouettes `creature()` uses in play: medusa at the back, crabs
         through the middle ranks, lice at the front. Same composition, same
         casualties, our own animals.
         -------------------------------------------------------------------- */
      const u = cw * 0.62;                       /* one creature, title-sized */
      const alt = (step % 2) === 0;
      const plan = r === 0 ? 'medusa' : r < 3 ? 'crab' : 'louse';
      const tint = r === 0 ? '#e6ff7a' : r === 1 ? '#c3ff4a' : r === 2 ? '#8fe03a' : '#5fb42c';
      g.save();
      g.translate(x - u/2, y);
      g.scale(u/16, u/16);                       /* creature() draws in a 16 box */
      g.fillStyle = tint;
      if(plan === 'medusa'){
        g.beginPath(); g.ellipse(8,5,8,5.5,0,Math.PI,0); g.fill();
        g.fillRect(0,5,16,2);
        for(let i=0;i<4;i++) g.fillRect(2+i*4+(alt?1:-1), 7, 1.6, 6+(i%2)*2);
      } else if(plan === 'crab'){
        g.fillRect(3,2,10,8);
        g.fillRect(1,4,2,4); g.fillRect(13,4,2,4);
        g.fillRect(alt?0:2, 10, 3,3); g.fillRect(11+(alt?2:0), 10, 3,3);
        g.fillRect(5,0,2,2); g.fillRect(9,0,2,2);
      } else {
        g.beginPath(); g.ellipse(8,6,7,5,0,0,6.2832); g.fill();
        for(let k=0;k<3;k++){
          g.fillRect(2+k*5, 10, 1.5, alt?4:3);
          g.fillRect(2+k*5,  1, 1.5, alt?3:4);
        }
      }
      /* the bone showing through, the same tell the in-game plate has */
      g.fillStyle = 'rgba(12,20,10,.42)';
      if(plan === 'medusa') g.fillRect(6,1,4,3);
      else if(plan === 'crab') g.fillRect(6,4,4,4);
      else g.fillRect(6,4,4,3);
      g.restore();
    }
  }

  /* ---- their fire, and yours --------------------------------------------- */
  for(let i=0;i<5;i++){
    const t = ((T*0.55 + i*0.23) % 1);
    const bx = originX + ((i*3+1)%COLS)*cw;
    const by = originY + ROWS*chh*1.55 + t*(h*0.38);
    g.fillStyle = 'rgba(200,255,140,'+(0.85*(1-t*0.4))+')';
    g.fillRect(bx-1.4, by, 2.8, 9);
  }
  /* your shot, going up, about to take one out */
  const ut = ((T*0.9) % 1);
  const uy = h*0.665 - ut*(h*0.30);
  g.save(); g.globalCompositeOperation = 'lighter';
  g.fillStyle = 'rgba(230,255,200,.95)';
  g.fillRect(w*0.5 - 1.6, uy, 3.2, 14);
  const sg2 = g.createRadialGradient(w*0.5, uy+7, 0, w*0.5, uy+7, 16);
  sg2.addColorStop(0,'rgba(190,255,140,.5)'); sg2.addColorStop(1,'rgba(190,255,140,0)');
  g.fillStyle = sg2; g.beginPath(); g.arc(w*0.5, uy+7, 16, 0, 6.2832); g.fill();
  g.restore();

  /* ---- your gun, and what is left of the bunkers -------------------------- */
  /* the gun rides above the panel, not behind it */
  const gy = h*0.685, gpx = Math.max(2, w*0.011);
  g.fillStyle = '#d8ffb0';
  g.fillRect(w*0.5 - gpx*4, gy, gpx*8, gpx*2);
  g.fillRect(w*0.5 - gpx*6, gy + gpx*2, gpx*12, gpx*2);
  g.fillRect(w*0.5 - gpx, gy - gpx*2, gpx*2, gpx*2);
  for(const bxp of [0.22, 0.5, 0.78]){
    const bx2 = w*bxp, by2 = h*0.615;
    g.fillStyle = 'rgba(150,225,105,.85)';
    for(let a=0;a<7;a++) for(let b=0;b<4;b++){
      /* chewed away from the middle out */
      const eaten = (b>=2 && a>2 && a<4) || (bxp===0.5 && b>=1 && a>1 && a<5);
      if(eaten) continue;
      g.fillRect(bx2 + (a-3.5)*gpx*1.6, by2 + b*gpx*1.6, gpx*1.5, gpx*1.5);
    }
  }

  /* ---- scanlines ---------------------------------------------------------- */
  g.fillStyle = 'rgba(0,0,0,.24)';
  for(let y=0;y<h;y+=3) g.fillRect(0,y,w,1);

  /* ---- the wordmark: built from the same blocks --------------------------- */
  const PG = {
    P:[[[0,14],[0,0],[6,0],[9,3],[9,6],[6,9],[0,9]]],
    H:[[[0,0],[0,14]],[[9,0],[9,14]],[[0,7],[9,7]]],
    A:[[[0,14],[4,0],[5,0],[9,14]],[[2,9],[7,9]]],
    L:[[[0,0],[0,14],[8,14]]],
    N:[[[0,14],[0,0],[9,14],[9,0]]],
    X:[[[0,0],[9,14]],[[9,0],[0,14]]]
  };
  /* A and X splay outward, so they need more advance than their box — at 9.6
     the A was sitting inside the L and the X clipped the N. */
  const PW = { P:9.6, H:9.8, A:10.6, L:8.4, N:9.8, X:10.4 };
  AR.wordmark(g, 'PHALANX', w*0.5, h*0.155, Math.min(w*0.118, 56), {
    glyphs: PG, widths: PW, gap: 0.34, maxW: w*0.90, rake: 0,
    passes: ['glow','block'],
    paint: (gg, pass) => {
      /* SQUARE everything \u2014 the whole card is on a pixel grid */
      gg.lineCap = 'butt'; gg.lineJoin = 'miter'; gg.miterLimit = 2;
      if(pass === 'glow'){
        gg.strokeStyle = 'rgba(150,255,70,.20)'; gg.lineWidth = 7;
      } else {
        gg.strokeStyle = '#d6ff7e'; gg.lineWidth = 3.0;
      }
    }
  });

  if(document.body.classList.contains('titling'))
    requestAnimationFrame(drawTitleArt);
}

function showTitle(){
  document.body.classList.add('titling');
  titleT = 0;
  requestAnimationFrame(drawTitleArt);
  state='title';
  openVeil('<h1>Phalanx</h1>' +
    '<div class="tmenu">' +
      '<button class="btn" data-act="play">PLAY</button>' +
      '<button class="btn ghost" data-act="opts">OPTIONS</button>' +
      '<button class="btn ghost" data-act="quit">QUIT</button>' +
    '</div>',
    { play:start, opts:showOptions, quit:()=>{ if(AR&&AR.home) AR.home(); } });
}
function showOptions(){
  openVeil('<div class="eyebrow">PHALANX</div><h1>Options</h1>' +
    '<div class="tmenu">' +
      '<button class="btn ghost" data-act="ctrl">CONTROLS</button>' +
      '<button class="btn" data-act="back">BACK</button>' +
    '</div>', { ctrl:showControls, back:showTitle });
}
function showControls(){
  const touch = !!(AR && AR.touch);
  const v = touch ? 'Drag' : 'Drag, or arrow keys';
  const rows = [
    [v, 'move along the line'],
    [touch ? 'Tap' : 'Tap, or space', 'fire'],
    ['One shot at a time', 'wait for it to land or miss'],
    ['They speed up as they thin', 'the last one is the fastest'],
    ['Pause, top right', 'options']
  ];
  openVeil('<div class="eyebrow">' + (touch?'TOUCH':'POINTER') + '</div><h1>Controls</h1>' +
    '<div class="ctrls">' + rows.map(r=>'<div class="crow"><b>'+r[0]+'</b><i>'+r[1]+'</i></div>').join('') + '</div>' +
    '<button class="btn" data-act="back" style="margin-top:16px">BACK</button>', { back:showOptions });
}
function showOver(){
  openVeil('<div class="eyebrow">' + (alive > 0 ? 'THEY REACHED THE LINE' : 'SHIP LOST') + '</div>' +
    '<h1>' + score.toLocaleString() + '<em>FINAL SCORE</em></h1>' +
    '<div class="grid2">' +
      '<div class="gc"><span>WAVE</span><b>' + wave + '</b></div>' +
      '<div class="gc"><span>BEST</span><b>' + best.toLocaleString() + '</b></div>' +
    '</div>' +
    '<div class="tmenu">' +
      '<button class="btn" data-act="again">PLAY AGAIN</button>' +
      '<button class="btn ghost" data-act="title">TITLE</button>' +
    '</div>', { again:start, title:showTitle });
}

/* ---- input ------------------------------------------------------------- */
let px0=0, sh0=0, dragging=false, moved=false;
const toLogical = x => { const r = cv.getBoundingClientRect(); return (x - r.left)/S; };
cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId);
  dragging=true; moved=false; px0=toLogical(e.clientX); sh0=ship.x;
});
cv.addEventListener('pointermove', e => {
  if(!dragging || state!=='play') return;
  const d = toLogical(e.clientX) - px0;
  if(Math.abs(d) > 2) moved = true;
  ship.x = Math.max(14, Math.min(W-14, sh0 + d));
});
cv.addEventListener('pointerup', () => {
  if(dragging && !moved && state==='play') fire();
  dragging=false;
});
window.addEventListener('keydown', e => {
  if(state!=='play'){
    if(e.key==='Enter'||e.key===' '){ const b=veilBody.querySelector('.btn'); if(b){ e.preventDefault(); b.click(); } }
    return;
  }
  if(e.key==='ArrowLeft'){ e.preventDefault(); ship.x=Math.max(14, ship.x-16); }
  else if(e.key==='ArrowRight'){ e.preventDefault(); ship.x=Math.min(W-14, ship.x+16); }
  else if(e.key===' '){ e.preventDefault(); fire(); }
});
if(AR && AR.pad) AR.pad.onPress(name => {
  if(AR.paused && AR.paused()) return;
  if(state!=='play'){ if(name==='a'||name==='start'){ const b=veilBody.querySelector('.btn'); if(b) b.click(); } return; }
  if(name==='left') ship.x=Math.max(14, ship.x-16);
  else if(name==='right') ship.x=Math.min(W-14, ship.x+16);
  else if(name==='a') fire();
});
if(AR && AR.onRestart) AR.onRestart(start);
window.addEventListener('resize', fitTight);
if(window.ResizeObserver) new ResizeObserver(fitTight).observe($('wrap'));

const sv0 = AR && AR.save ? AR.save.get('phalanx') : null;
best = (sv0 && sv0.best) || 0;
reset(); fit(); showTitle();
requestAnimationFrame(()=>{ fitTight(); setTimeout(fitTight,200); });
requestAnimationFrame(frame);
})();
</script>
<div id="rotate"><div><i></i><b>TURN YOUR PHONE</b>
<span>TINY ARCADE IS PLAYED UPRIGHT</span></div></div>
<script>
/* only a device with a coarse pointer gets the portrait lock — a desktop
   window is free to be any shape, and wide is the better shape there */
(function(){
  if(matchMedia('(pointer:coarse)').matches) document.body.classList.add('lock-portrait');
  /* an installed app can genuinely lock; a tab cannot, and throwing is fine */
  try{ if(screen.orientation && screen.orientation.lock)
        screen.orientation.lock('portrait').catch(function(){}); }catch(e){}
})();
</script>
