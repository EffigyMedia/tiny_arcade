<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#161219">
<meta name="apple-mobile-web-app-capable" content="yes">

<script src="../../arcade.js"></script>
<style>
@font-face{font-family:"Bungee";font-style:normal;font-weight:400;font-display:swap;src:url("../../fonts/bungee-400.woff2") format("woff2")}
@font-face{font-family:"Cutive Mono";font-style:normal;font-weight:400;font-display:swap;src:url("../../fonts/cutivemono-400.woff2") format("woff2")}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#161219;
  font-family:"Cutive Mono",ui-monospace,monospace;color:#f2e6d8;
  user-select:none;-webkit-user-select:none}
#stage{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:var(--safe-top,0px)}
#head{flex:none;display:flex;justify-content:space-between;align-items:baseline;
  padding:9px 14px 5px;font-size:10px;letter-spacing:.18em;color:#8a7b6b}
#head b{font-size:17px;color:#ffb347;font-weight:400;font-variant-numeric:tabular-nums}
#wrap{flex:1;position:relative;display:grid;place-items:center;min-height:0;
  padding:0 6px calc(6px + var(--safe-bot,0px))}
#board{display:block;touch-action:none;border-radius:2px}
#veil{position:fixed;inset:0;background:rgba(20,16,22,.95);display:grid;place-items:center;
  padding:26px;text-align:center;z-index:40}
#veil.hidden{display:none}
#veilBody{max-width:330px;width:100%}
.eyebrow{font-size:10px;letter-spacing:.24em;color:#ffb347;margin-bottom:9px}
h1{font-family:"Bungee",sans-serif;font-size:34px;font-weight:400;margin:0;
  letter-spacing:.01em;line-height:1;color:#fff3e2}
h1 em{display:block;font-family:"Cutive Mono",monospace;font-size:10px;font-style:normal;
  letter-spacing:.22em;color:#8a7b6b;margin-top:10px}
.tmenu{display:flex;flex-direction:column;gap:8px;max-width:240px;margin:22px auto 0}
.btn{padding:14px 0;width:100%;border:0;border-radius:3px;cursor:pointer;font:inherit;
  font-size:12px;letter-spacing:.16em;background:#ffb347;color:#2a1a06}
.btn.ghost{background:transparent;color:#ffb347;border:1px solid rgba(255,179,71,.34)}
.btn:active{opacity:.85}
.ctrls{margin:16px auto 0;max-width:290px}
.crow{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:7px 2px;
  border-bottom:1px solid rgba(255,255,255,.08);font-size:12px;text-align:left}
.crow b{font-weight:400;white-space:nowrap}
.crow i{font-style:normal;color:#a6907c;text-align:right}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.gc{border:1px solid #322632;border-radius:3px;padding:9px}
.gc span{display:block;font-size:9px;letter-spacing:.16em;color:#8a7b6b}
.gc b{display:block;font-size:17px;margin-top:3px;font-weight:400;font-variant-numeric:tabular-nums}
/* the control diagram: a d-pad turned 45 degrees, because the moves are */
.diag{width:118px;height:118px;margin:16px auto 0;position:relative}
.diag i{
  position:absolute;width:38px;height:38px;border-radius:5px;
  border:1px solid rgba(255,179,71,.45);background:rgba(255,179,71,.09);
  display:grid;place-items:center;font-style:normal;font-size:15px;color:#ffb347;
}
.diag i:nth-child(1){left:40px;top:0}
.diag i:nth-child(2){left:80px;top:40px}
.diag i:nth-child(3){left:40px;top:80px}
.diag i:nth-child(4){left:0;top:40px}
/* ---------------------------------------------------------------------------
   PORTRAIT ON A PHONE, WIDE ON A DESKTOP

   The manifest pins the INSTALLED app to portrait, but a browser tab cannot be
   forced — `screen.orientation.lock()` only works from fullscreen and throws
   everywhere else. So: on a touch device held sideways, a panel asks for it
   back. On a desktop there is no such thing as the wrong orientation, and a
   wide window is exactly what we want, so the panel never appears there.

   The test is POINTER TYPE, not width. A landscape phone and a small laptop
   window are the same number of pixels and want opposite things.
   --------------------------------------------------------------------------- */
#rotate{
  position:fixed;inset:0;z-index:9000;display:none;
  place-items:center;text-align:center;padding:28px;
  background:#07050b;color:#e8e2f4;
  font-family:var(--px,ui-monospace,monospace);
}
#rotate b{display:block;font-size:12px;letter-spacing:.22em;color:var(--gold,#e8b23a);margin-bottom:14px}
#rotate span{display:block;font-size:10px;letter-spacing:.14em;color:#8a8296;line-height:2}
#rotate i{display:block;width:52px;height:82px;margin:0 auto 22px;
  border:2px solid rgba(232,178,58,.65);border-radius:8px;
  transform:rotate(90deg);animation:rot 2.4s ease-in-out infinite}
@keyframes rot{0%,40%{transform:rotate(90deg)}60%,100%{transform:rotate(0deg)}}
@media (orientation:landscape) and (pointer:coarse){
  body.lock-portrait #rotate{display:grid}
}

#titleArt{position:absolute;inset:0;z-index:29;display:none;width:100%;height:100%}
body.titling #titleArt{display:block}
body.titling #veil{
  background:linear-gradient(180deg, rgba(20,16,22,0) 0%, rgba(20,16,22,0) 44%,
    rgba(20,16,22,.62) 62%, rgba(20,16,22,.94) 82%, rgba(20,16,22,.97) 100%);
  align-items:end;padding-bottom:34px}
body.titling #veil h1{display:none}
</style>
</head>
<body>
<div id="stage">
  <div id="head">
    <div>SCORE <b id="sc">0</b></div>
    <div>LEVEL <b id="lv">1</b></div>
    <div>LIVES <b id="li">3</b></div>
  </div>
  <div id="wrap"><canvas id="board"></canvas></div>
</div>
<canvas id="titleArt"></canvas>
<div id="veil"><div id="veilBody"></div></div>
<script>
(function(){
"use strict";
const AR = window.Arcade, $ = id => document.getElementById(id);
const cv = $('board'), g = cv.getContext('2d');
const veil = $('veil'), veilBody = $('veilBody');

const ROWS = 7;
const TW = 62, TH = 34, TD = 26;          /* tile width, top height, side depth */
const W = TW*ROWS + 60, H = TH*ROWS/1.35 + TD*ROWS + 150;
let S = 1;

let tiles, you, foes, discs, state, score, lives, level, best;
let need, hopT, hop, fallT, msg, msgT, runs = 0, hintN = 0;

/* row r has r+1 tiles, indexed 0..r */
const key = (r,c) => r*16 + c;
function onBoard(r,c){ return r>=0 && r<ROWS && c>=0 && c<=r; }

function tileXY(r,c){
  /* a proper isometric stack: each row down is a step forward and outward */
  const x = W/2 + (c - r/2) * TW;
  const y = 74 + r * (TD + TH*0.34);
  return { x, y };
}

function buildLevel(){
  tiles = {};
  need = (level % 3 === 0) ? 2 : 1;       /* every third level needs two visits */
  for(let r=0;r<ROWS;r++) for(let c=0;c<=r;c++) tiles[key(r,c)] = 0;
  you = { r:0, c:0, x:0, y:0, dead:0 };
  const p = tileXY(0,0); you.x = p.x; you.y = p.y;
  hop = null; fallT = 0;
  foes = []; discs = [];
  /* escape discs at the two outer edges, part way down */
  discs.push({ r:3, c:-1, used:false });
  discs.push({ r:3, c:4,  used:false });
  spawnT = 1.6;
  paintHud();
}
let spawnT = 2;

function reset(){ score=0; lives=3; level=1; buildLevel(); }

/* ---- moving ------------------------------------------------------------
   Four diagonals only. Down-left and down-right go a row further down; the
   up moves come back toward the apex. That IS the game: the controls are the
   obstacle, so they are never softened.
   -------------------------------------------------------------------------- */
const MOVES = {
  dl: { dr: 1, dc: 0 },
  dr: { dr: 1, dc: 1 },
  ul: { dr:-1, dc:-1 },
  ur: { dr:-1, dc: 0 }
};
function move(dir){
  if(state !== 'play' || hop || fallT > 0 || you.dead > 0) return;
  const m = MOVES[dir]; if(!m) return;
  const nr = you.r + m.dr, nc = you.c + m.dc;
  const from = tileXY(you.r, you.c);
  hintN++;

  /* a disc waiting off the edge lifts you home */
  const d = discs.find(d2 => !d2.used && d2.r === nr && d2.c === nc);
  if(d){
    d.used = true;
    hop = { fx:from.x, fy:from.y, tx:tileXY(nr, Math.max(0,Math.min(nr,nc))).x,
            ty:tileXY(nr,0).y, t:0, disc:d };
    snd.hop(); return;
  }
  const to = onBoard(nr,nc) ? tileXY(nr,nc)
           : { x: from.x + (m.dc*2 - m.dr) * TW*0.5, y: from.y + m.dr*(TD+TH*0.34) };
  hop = { fx:from.x, fy:from.y, tx:to.x, ty:to.y, t:0, nr, nc,
          off: !onBoard(nr,nc) };
  snd.hop();
}

function land(){
  const h = hop; hop = null;
  if(h.disc){
    /* the disc carries you to the apex */
    you.r = 0; you.c = 0;
    const p = tileXY(0,0); you.x = p.x; you.y = p.y;
    score += 50; snd.disc();
    say('LIFTED'); return;
  }
  if(h.off){ fall(); return; }
  you.r = h.nr; you.c = h.nc;
  const p = tileXY(you.r, you.c); you.x = p.x; you.y = p.y;
  const k = key(you.r, you.c);
  if(tiles[k] < need){
    tiles[k]++;
    score += 25;
    snd.flip(flipped()/total());
  }
  snd.land();
  /* something waiting on the tile you just took */
  for(const f of foes){
    if(f.alive && f.r === you.r && f.c === you.c && f.kind !== 'disc') die();
  }
  if(flipped() >= total()) nextLevel();
  paintHud();
}
function total(){ return ROWS*(ROWS+1)/2; }
function flipped(){
  let n = 0;
  for(const k in tiles) if(tiles[k] >= need) n++;
  return n;
}

function fall(){
  fallT = 1.15;
  snd.fall();
  say(CURSES[(Math.random()*CURSES.length)|0]);
}
const CURSES = ['@!#?@!', 'GRZZLT!', 'FFTHBB!', 'SKRONK!', 'BLLMPH!'];

function die(){
  if(you.dead > 0) return;
  you.dead = 1.0; lives--;
  snd.die();
  say(CURSES[(Math.random()*CURSES.length)|0]);
  paintHud();
}
function say(t){ msg = t; msgT = 1.3; }

function nextLevel(){
  level++; score += 500;
  snd.clear();
  buildLevel();
}

/* ---- the things on the pyramid ------------------------------------------ */
function spawnFoe(){
  const roll = Math.random();
  const kind = roll < 0.45 ? 'ball' : roll < 0.78 ? 'chaser' : 'undo';
  const c = kind === 'chaser' ? 0 : ((Math.random()*2)|0);
  foes.push({ kind, r:0, c, x:0, y:0, t:0.6, alive:true });
  const p = tileXY(0,c); const f = foes[foes.length-1]; f.x = p.x; f.y = p.y;
}
function stepFoes(dt){
  for(let i=foes.length-1;i>=0;i--){
    const f = foes[i];
    f.t -= dt;
    if(f.t <= 0){
      f.t = f.kind === 'chaser' ? 0.62 : 0.48;
      let dr = 1, dc = (Math.random() < 0.5) ? 0 : 1;
      if(f.kind === 'chaser'){
        /* comes after you rather than falling down the face */
        dr = Math.sign(you.r - f.r) || 1;
        dc = dr > 0 ? (you.c > f.c ? 1 : 0) : (you.c < f.c ? -1 : 0);
      }
      const nr = f.r + dr, nc = f.c + dc;
      if(!onBoard(nr,nc)){ foes.splice(i,1); continue; }
      f.r = nr; f.c = nc;
      const p = tileXY(nr,nc); f.px = f.x; f.py = f.y; f.tx = p.x; f.ty = p.y; f.a = 0;
      /* the third kind un-does your work as it goes */
      if(f.kind === 'undo'){
        const k = key(nr,nc);
        if(tiles[k] > 0){ tiles[k]--; snd.undo(); }
      }
      if(f.r === you.r && f.c === you.c && fallT <= 0) die();
    }
    if(f.a !== undefined && f.a < 1){
      f.a = Math.min(1, f.a + dt*5);
      f.x = f.px + (f.tx - f.px)*f.a;
      f.y = f.py + (f.ty - f.py)*f.a - Math.sin(f.a*Math.PI)*12;
    }
  }
}

/* ---- step -------------------------------------------------------------- */
function step(dt){
  if(state !== 'play') return;
  if(msgT > 0) msgT -= dt;

  if(fallT > 0){
    fallT -= dt;
    you.y += 420*dt;
    if(fallT <= 0){
      lives--;
      paintHud();
      if(lives <= 0){ gameOver(); return; }
      you.r = 0; you.c = 0;
      const p = tileXY(0,0); you.x = p.x; you.y = p.y;
    }
    return;
  }
  if(you.dead > 0){
    you.dead -= dt;
    if(you.dead <= 0){
      if(lives <= 0){ gameOver(); return; }
      you.r = 0; you.c = 0;
      const p = tileXY(0,0); you.x = p.x; you.y = p.y;
      foes = foes.filter(f => f.r > 2);
    }
    return;
  }

  if(hop){
    hop.t += dt * 4.4;
    const q = Math.min(1, hop.t);
    you.x = hop.fx + (hop.tx - hop.fx) * q;
    you.y = hop.fy + (hop.ty - hop.fy) * q - Math.sin(q*Math.PI) * 26;
    if(q >= 1) land();
    return;
  }

  spawnT -= dt;
  if(spawnT <= 0){
    spawnT = Math.max(1.1, 3.2 - level*0.22);
    if(foes.length < 2 + Math.min(3, level)) spawnFoe();
  }
  stepFoes(dt);
}

/* ---- audio: 7/8, wrong-footed on purpose ------------------------------- */
const SEVEN = [0, 3, 5, 7, 10, 7, 5];
const snd = {
  tick(stp, t){
    if(!AR || state !== 'play') return;
    /* seven beats to the bar, so the bed never lets you settle — the same
       joke the controls are playing */
    const s7 = stp % 7;
    const base = 87.3;
    if(s7 === 0 || s7 === 3 || s7 === 5)
      AR.sfx.tone({ t, freq: base/2, dur:0.20, type:'triangle', gain:0.070,
                    attack:0.004, cutoff:360, bus:'music' });
    AR.sfx.tone({ t, freq: base * Math.pow(2, SEVEN[s7]/12), dur:0.11,
                  type:'square', gain:0.032, attack:0.004, cutoff:1900, bus:'music' });
    if(s7 === 6)
      AR.sfx.noise({ t, freq:3000, dur:0.04, gain:0.024, filter:'highpass', bus:'music' });
  },
  hop(){ if(!AR) return;
    AR.sfx.tone({ freq:520, to:740, dur:0.06, type:'square', gain:0.045, cutoff:2400 });
    AR.sfx.tone({ t:AR.audio.now()+0.05, freq:740, to:600, dur:0.06,
                  type:'square', gain:0.035, cutoff:2200 }); },
  land(){ if(AR) AR.sfx.noise({ freq:700, to:260, dur:0.05, gain:0.040, filter:'bandpass' }); },
  flip(p){ if(AR) AR.sfx.tone({ freq: 330 + p*520, dur:0.10, type:'sine', gain:0.055, verb:0.3 }); },
  undo(){ if(AR) AR.sfx.tone({ freq:300, to:170, dur:0.14, type:'square', gain:0.045, cutoff:900 }); },
  disc(){ if(!AR) return; [0,5,9,14].forEach((n,i) =>
    AR.sfx.tone({ t:AR.audio.now()+i*0.06, freq:392*Math.pow(2,n/12), dur:0.24,
                  type:'sine', gain:0.06, verb:0.5 })); },
  fall(){ if(AR) AR.sfx.tone({ freq:660, to:70, dur:1.0, type:'sawtooth', gain:0.075, cutoff:1400 }); },
  die(){ if(AR){ AR.sfx.noise({ freq:800, to:90, dur:0.55, gain:0.085, filter:'lowpass' });
                 AR.sfx.tone({ freq:280, to:60, dur:0.6, type:'square', gain:0.05, cutoff:800 }); } },
  clear(){ if(!AR) return; [0,4,7,12,16].forEach((n,i) =>
    AR.sfx.tone({ t:AR.audio.now()+i*0.08, freq:330*Math.pow(2,n/12), dur:0.32,
                  type:'sine', gain:0.065, verb:0.45 })); }
};

/* ---- draw: folded paper model ------------------------------------------ */
function fit(){
  const wrap = $('wrap');
  S = Math.min((wrap.clientWidth-4)/W, (wrap.clientHeight-4)/H);
  const dpr = Math.min(2, window.devicePixelRatio||1);
  cv.width=Math.round(W*S*dpr); cv.height=Math.round(H*S*dpr);
  cv.style.width=(W*S)+'px'; cv.style.height=(H*S)+'px';
  g.setTransform(dpr*S,0,0,dpr*S,0,0);
  draw();
}
function fitTight(){
  fit();
  for(let i=0;i<6;i++){
    const r = cv.getBoundingClientRect();
    if(r.right <= window.innerWidth && r.bottom <= $('wrap').getBoundingClientRect().bottom+1) break;
    S *= 0.97;
    const dpr = Math.min(2, window.devicePixelRatio||1);
    cv.width=Math.round(W*S*dpr); cv.height=Math.round(H*S*dpr);
    cv.style.width=(W*S)+'px'; cv.style.height=(H*S)+'px';
    g.setTransform(dpr*S,0,0,dpr*S,0,0);
  }
  draw();
}

/* card stock, in three states */
const CARD = [
  { top:'#e8dcc6', l:'#c9b795', r:'#a8956f' },   /* unturned */
  { top:'#ffb347', l:'#d98a2b', r:'#a86416' },   /* turned once */
  { top:'#ff7a8a', l:'#d94f63', r:'#a83346' }    /* turned twice */
];

function tileFace(x, y, st){
  const c = CARD[Math.min(st, CARD.length-1)];
  /* the top: a rhombus */
  g.beginPath();
  g.moveTo(x, y - TH/2);
  g.lineTo(x + TW/2, y);
  g.lineTo(x, y + TH/2);
  g.lineTo(x - TW/2, y);
  g.closePath();
  g.fillStyle = c.top; g.fill();
  /* the crease across it, as on folded card */
  g.strokeStyle = 'rgba(120,100,74,.30)'; g.lineWidth = 1;
  g.beginPath(); g.moveTo(x - TW/2, y); g.lineTo(x + TW/2, y); g.stroke();
  /* the two visible sides */
  g.beginPath();
  g.moveTo(x - TW/2, y); g.lineTo(x, y + TH/2);
  g.lineTo(x, y + TH/2 + TD); g.lineTo(x - TW/2, y + TD);
  g.closePath();
  g.fillStyle = c.l; g.fill();
  g.beginPath();
  g.moveTo(x + TW/2, y); g.lineTo(x, y + TH/2);
  g.lineTo(x, y + TH/2 + TD); g.lineTo(x + TW/2, y + TD);
  g.closePath();
  g.fillStyle = c.r; g.fill();
  /* tabs: little folded flaps at the corners, the giveaway of a paper model */
  g.fillStyle = 'rgba(255,255,255,.18)';
  g.beginPath();
  g.moveTo(x - TW/2, y); g.lineTo(x - TW/2 + 7, y - 3);
  g.lineTo(x - TW/2 + 7, y + TD - 3); g.lineTo(x - TW/2, y + TD);
  g.closePath(); g.fill();
  /* the outline, drawn like a pencil crease */
  g.strokeStyle = 'rgba(70,56,44,.55)'; g.lineWidth = 1;
  g.beginPath();
  g.moveTo(x, y - TH/2); g.lineTo(x + TW/2, y); g.lineTo(x + TW/2, y + TD);
  g.lineTo(x, y + TH/2 + TD); g.lineTo(x - TW/2, y + TD); g.lineTo(x - TW/2, y);
  g.closePath(); g.stroke();
}

function draw(){
  g.fillStyle = '#191420'; g.fillRect(0,0,W,H);
  /* a soft paper-grain wash behind the model */
  const bg = g.createRadialGradient(W/2, H*0.34, 20, W/2, H*0.5, H*0.8);
  bg.addColorStop(0,'rgba(255,179,71,.07)'); bg.addColorStop(1,'rgba(0,0,0,.35)');
  g.fillStyle = bg; g.fillRect(0,0,W,H);

  /* discs at the edges: paper wheels on a thread */
  for(const d of discs){
    if(d.used) continue;
    const p = tileXY(d.r, Math.max(0, Math.min(d.r, d.c)));
    const x = p.x + (d.c < 0 ? -TW*0.72 : TW*0.72);
    const y = p.y + 6;
    g.strokeStyle = 'rgba(240,226,200,.35)'; g.lineWidth = 1;
    g.beginPath(); g.moveTo(x, y-40); g.lineTo(x, y); g.stroke();
    g.fillStyle = '#f2e6d8';
    g.beginPath(); g.ellipse(x, y, 15, 8, 0, 0, 6.2832); g.fill();
    g.strokeStyle = 'rgba(120,100,74,.5)';
    g.beginPath(); g.ellipse(x, y, 15, 8, 0, 0, 6.2832); g.stroke();
    g.beginPath(); g.moveTo(x-15, y); g.lineTo(x+15, y); g.stroke();
  }

  /* back to front so nothing draws over what is in front of it */
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<=r;c++){
      const p = tileXY(r,c);
      tileFace(p.x, p.y, tiles[key(r,c)] || 0);
    }
    /* things standing on this row, after the row itself */
    for(const f of foes) if(f.r === r) creature(f);
    if(you.r === r && you.dead <= 0 && !hop && fallT <= 0) hopper();
  }
  /* mid-hop or falling, you are above everything */
  if(hop || fallT > 0 || you.dead > 0) hopper();

  if(msgT > 0){
    g.save();
    g.globalAlpha = Math.min(1, msgT);
    g.textAlign = 'center';
    g.font = '18px Bungee, sans-serif';
    g.fillStyle = '#fff3e2';
    /* a speech bubble, as a folded paper flag */
    const bw = g.measureText(msg).width + 22;
    const bx = you.x, by = you.y - 54;
    g.fillStyle = '#f2e6d8';
    g.beginPath();
    g.moveTo(bx-bw/2, by-16); g.lineTo(bx+bw/2, by-16);
    g.lineTo(bx+bw/2, by+8); g.lineTo(bx+8, by+8);
    g.lineTo(bx, by+18); g.lineTo(bx-4, by+8); g.lineTo(bx-bw/2, by+8);
    g.closePath(); g.fill();
    g.strokeStyle = 'rgba(70,56,44,.5)'; g.lineWidth = 1; g.stroke();
    g.fillStyle = '#2a1a06';
    g.fillText(msg, bx, by+2);
    g.restore();
  }

  /* the first few moves, say which way the swipes go */
  if(state === 'play' && hintN < 4){
    g.save();
    g.globalAlpha = 0.75;
    g.textAlign = 'center';
    g.font = '11px "Cutive Mono", monospace';
    g.fillStyle = '#ffb347';
    g.fillText('SWIPE DIAGONALLY \u2014 FOUR WAYS ONLY', W/2, H - 22);
    g.restore();
  }
}

/* a little folded paper figure */
function hopper(){
  const x = you.x, y = you.y;
  g.save();
  if(you.dead > 0) g.globalAlpha = Math.max(0.2, you.dead);
  /* body: a folded cone */
  g.fillStyle = '#f7f2e6';
  g.beginPath();
  g.moveTo(x, y - 34); g.lineTo(x + 13, y - 4); g.lineTo(x - 13, y - 4);
  g.closePath(); g.fill();
  g.fillStyle = 'rgba(150,128,96,.28)';
  g.beginPath(); g.moveTo(x, y - 34); g.lineTo(x + 13, y - 4); g.lineTo(x, y - 4);
  g.closePath(); g.fill();
  g.strokeStyle = 'rgba(70,56,44,.55)'; g.lineWidth = 1;
  g.beginPath();
  g.moveTo(x, y - 34); g.lineTo(x + 13, y - 4); g.lineTo(x - 13, y - 4);
  g.closePath(); g.stroke();
  /* the crease down the front */
  g.beginPath(); g.moveTo(x, y - 34); g.lineTo(x, y - 4); g.stroke();
  /* two ink eyes */
  g.fillStyle = '#2a1a06';
  g.beginPath(); g.arc(x - 4, y - 15, 1.9, 0, 6.2832); g.fill();
  g.beginPath(); g.arc(x + 4, y - 15, 1.9, 0, 6.2832); g.fill();
  g.restore();
}

function creature(f){
  const x = f.x, y = f.y;
  g.save();
  if(f.kind === 'ball'){
    /* a crumpled paper ball */
    g.fillStyle = '#b8a98c';
    g.beginPath();
    for(let i=0;i<8;i++){
      const a = i/8*6.2832;
      const rr = 11 + ((i*5)%3)*2.2;
      const px = x + Math.cos(a)*rr, py = y - 12 + Math.sin(a)*rr*0.8;
      i ? g.lineTo(px,py) : g.moveTo(px,py);
    }
    g.closePath(); g.fill();
    g.strokeStyle = 'rgba(70,56,44,.5)'; g.lineWidth = 1; g.stroke();
  } else if(f.kind === 'chaser'){
    /* a folded dart, nose down */
    g.fillStyle = '#9fd8ff';
    g.beginPath();
    g.moveTo(x, y - 30); g.lineTo(x + 12, y - 2); g.lineTo(x, y - 9);
    g.lineTo(x - 12, y - 2); g.closePath(); g.fill();
    g.strokeStyle = 'rgba(40,70,96,.6)'; g.lineWidth = 1; g.stroke();
  } else {
    /* an eraser: it takes the colour back off the card */
    g.fillStyle = '#e88fb0';
    g.fillRect(x - 11, y - 22, 22, 16);
    g.fillStyle = 'rgba(255,255,255,.30)';
    g.fillRect(x - 11, y - 22, 22, 5);
    g.strokeStyle = 'rgba(90,40,60,.55)'; g.lineWidth = 1;
    g.strokeRect(x - 11, y - 22, 22, 16);
  }
  g.restore();
}

function paintHud(){
  $('sc').textContent = score.toLocaleString();
  $('lv').textContent = level;
  $('li').textContent = Math.max(0, lives);
}

let last = 0;
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now-last)/1000) || 0; last = now;
  step(dt); draw();
}

/* ---- state ------------------------------------------------------------- */
function start(){
  runs++; reset(); state='play'; hintN = 0;
  document.body.classList.remove('titling');
  veil.classList.add('hidden'); fitTight();
  if(AR && AR.music){ AR.music.stop(); AR.music.start(132, 7, snd.tick); }
}
function gameOver(){
  state='over';
  if(AR && AR.music) AR.music.stop();
  const sv = AR&&AR.save ? AR.save.get('ziggurat') : null;
  best = Math.max((sv&&sv.best)||0, score);
  if(AR && AR.save) AR.save.merge('ziggurat', { best, level, label:'BEST '+best.toLocaleString() });
  showOver();
}

function openVeil(html, acts){
  veilBody.innerHTML = html; veil.classList.remove('hidden');
  veilBody.querySelectorAll('[data-act]').forEach(b =>
    b.addEventListener('click', ()=>{ const fn = acts && acts[b.dataset.act]; if(fn) fn(); }));
}

/* ---- TITLE: a paper model ------------------------------------------------
   The game is folded card, so the card is too. Warm paper ground, a pyramid
   built from real tile faces, and letters that are CREASED rather than lit:
   a flat card face, a fold shadow down one side of every stroke, and a pencil
   outline. No gradient, no glow — paper does neither.
   -------------------------------------------------------------------------- */
let titleCv = null;
function drawTitleArt(){
  if(!titleCv) titleCv = document.getElementById('titleArt');
  if(!titleCv) return;
  const g = titleCv.getContext('2d');
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = titleCv.clientWidth, h = titleCv.clientHeight;
  if(titleCv.width !== w*dpr){ titleCv.width = w*dpr; titleCv.height = h*dpr; }
  g.setTransform(dpr,0,0,dpr,0,0);

  /* paper ground with a soft press of light */
  g.fillStyle = '#1c1622'; g.fillRect(0,0,w,h);
  const lg = g.createRadialGradient(w*0.5,h*0.62,10,w*0.5,h*0.6,h*0.7);
  lg.addColorStop(0,'rgba(255,179,71,.16)'); lg.addColorStop(1,'rgba(0,0,0,.45)');
  g.fillStyle = lg; g.fillRect(0,0,w,h);

  /* the model itself, five rows, drawn as folded tiles */
  const R = 5, TW = Math.min(w*0.15, 62), TH = TW*0.55, TD = TW*0.42;
  const CARD = [['#e8dcc6','#c9b795','#a8956f'],['#ffb347','#d98a2b','#a86416']];
  let n2 = 0, lit = Math.floor(R*(R+1)/2 * 0.55);
  for(let r=0;r<R;r++) for(let c=0;c<=r;c++){
    const x = w/2 + (c - r/2)*TW, y = h*0.50 + r*(TD + TH*0.34);
    const C = CARD[n2 < lit ? 1 : 0]; n2++;
    g.beginPath(); g.moveTo(x,y-TH/2); g.lineTo(x+TW/2,y);
    g.lineTo(x,y+TH/2); g.lineTo(x-TW/2,y); g.closePath();
    g.fillStyle = C[0]; g.fill();
    g.beginPath(); g.moveTo(x-TW/2,y); g.lineTo(x,y+TH/2);
    g.lineTo(x,y+TH/2+TD); g.lineTo(x-TW/2,y+TD); g.closePath();
    g.fillStyle = C[1]; g.fill();
    g.beginPath(); g.moveTo(x+TW/2,y); g.lineTo(x,y+TH/2);
    g.lineTo(x,y+TH/2+TD); g.lineTo(x+TW/2,y+TD); g.closePath();
    g.fillStyle = C[2]; g.fill();
    g.strokeStyle='rgba(70,56,44,.5)'; g.lineWidth=1;
    g.beginPath(); g.moveTo(x,y-TH/2); g.lineTo(x+TW/2,y); g.lineTo(x+TW/2,y+TD);
    g.lineTo(x,y+TH/2+TD); g.lineTo(x-TW/2,y+TD); g.lineTo(x-TW/2,y);
    g.closePath(); g.stroke();
  }

  /* the name, creased: card face, fold shadow, pencil line */
  /* ---- ZIGGURAT'S OWN ALPHABET ----------------------------------------
     Folded card cannot curve, and it cannot be vertical either — every edge
     of this model is a diagonal. So the letters are cut the same way: no
     arcs, corners taken off at the same angle as the tile faces, and a
     slight taper so each one reads as a shape that was FOLDED rather than
     printed. A wider box than Highway's, because card is chunky.
     -------------------------------------------------------------------- */
  const ZG = {
    Z:[[[0,0],[10,0],[0,14],[10,14]]],
    I:[[[2,0],[8,0]],[[5,0],[5,14]],[[2,14],[8,14]]],
    G:[[[10,3],[7,0],[3,0],[0,3],[0,11],[3,14],[7,14],[10,11],[10,8],[6,8]]],
    U:[[[0,0],[0,11],[3,14],[7,14],[10,11],[10,0]]],
    R:[[[0,14],[0,0],[7,0],[10,3],[10,5],[7,8],[0,8]],[[5,8],[10,14]]],
    /* a FLAT top, like a tile face — a pointed apex on a folded letter is
       the one thing card cannot make */
    A:[[[0,14],[3,0],[7,0],[10,14]],[[2,9],[8,9]]],
    T:[[[0,0],[10,0]],[[5,0],[5,14]]]
  };
  AR.wordmark(g, 'ZIGGURAT', w*0.5, h*0.20, Math.min(w*0.13, 60), {
    glyphs: ZG, box: 10, gap: 0.40,
    maxW: w*0.90, rake: 0,
    passes: ['fold','face','edge'],
    paint: (gg, pass) => {
      /* card has creases, not fillets: mitre every corner and cut the ends
         square, so the letters look cut out rather than piped */
            gg.lineCap = 'butt'; gg.lineJoin = 'miter'; gg.miterLimit = 2;
      /* 5.4 units of stroke inside a 10-wide box left barely four units of
         counter, so the bowls of G and R filled in and neighbours touched.
         Thinner strokes and a wider gap give the letters air — card is chunky
         but it is not solid. */
      if(pass === 'fold'){
        gg.strokeStyle = 'rgba(120,96,64,.50)'; gg.lineWidth = 3.9;
        gg.translate(0.8, 1.0);
      } else if(pass === 'face'){
        gg.strokeStyle = '#f2e6d2'; gg.lineWidth = 3.1;
      } else {
        gg.strokeStyle = 'rgba(70,56,44,.50)'; gg.lineWidth = 0.8;
      }
    }
  });
}

function showTitle(){
  document.body.classList.add('titling');
  requestAnimationFrame(drawTitleArt);
  state='title';
  openVeil('<h1>Ziggurat</h1>' +
    /* the diagram is on the TITLE, because the mapping is the whole barrier */
    '<div class="diag"><i>\u2196</i><i>\u2197</i><i>\u2198</i><i>\u2199</i></div>' +
    '<div class="tmenu">' +
      '<button class="btn" data-act="play">PLAY</button>' +
      '<button class="btn ghost" data-act="opts">OPTIONS</button>' +
      '<button class="btn ghost" data-act="quit">QUIT</button>' +
    '</div>', { play:start, opts:showOptions, quit:()=>{ if(AR&&AR.home) AR.home(); } });
}
function showOptions(){
  openVeil('<div class="eyebrow">ZIGGURAT</div><h1>Options</h1>' +
    '<div class="tmenu">' +
      '<button class="btn ghost" data-act="ctrl">CONTROLS</button>' +
      '<button class="btn" data-act="back">BACK</button>' +
    '</div>', { ctrl:showControls, back:showTitle });
}
function showControls(){
  const touch = !!(AR && AR.touch);
  const rows = [
    [touch?'Swipe \u2199 or \u2198':'Z or X','hop DOWN the pyramid'],
    [touch?'Swipe \u2196 or \u2197':'Q or W','hop back UP'],
    ['There is no sideways','and that is the game'],
    ['The paper wheels','lift you back to the top'],
    ['The eraser','takes the colour off again']
  ];
  openVeil('<div class="eyebrow">'+(touch?'TOUCH':'KEYBOARD')+'</div><h1>Controls</h1>' +
    '<div class="ctrls">'+rows.map(r=>'<div class="crow"><b>'+r[0]+'</b><i>'+r[1]+'</i></div>').join('')+'</div>' +
    '<button class="btn" data-act="back" style="margin-top:16px">BACK</button>', { back:showOptions });
}
function showOver(){
  openVeil('<div class="eyebrow">OFF THE EDGE</div>' +
    '<h1>'+score.toLocaleString()+'<em>FINAL SCORE</em></h1>' +
    '<div class="grid2">' +
      '<div class="gc"><span>LEVEL</span><b>'+level+'</b></div>' +
      '<div class="gc"><span>BEST</span><b>'+best.toLocaleString()+'</b></div>' +
    '</div>' +
    '<div class="tmenu">' +
      '<button class="btn" data-act="again">PLAY AGAIN</button>' +
      '<button class="btn ghost" data-act="title">TITLE</button>' +
    '</div>', { again:start, title:showTitle });
}

/* ---- input: four diagonals, and nothing else --------------------------- */
let sx=0, sy=0, sw=false;
cv.addEventListener('pointerdown', e => { sw=true; sx=e.clientX; sy=e.clientY; });
cv.addEventListener('pointerup', e => {
  if(!sw) return; sw=false;
  const dx = e.clientX-sx, dy = e.clientY-sy;
  if(Math.hypot(dx,dy) < 16) return;
  /* the two diagonals split the compass into four; there is no orthogonal */
  if(dy > 0) move(dx > 0 ? 'dr' : 'dl');
  else       move(dx > 0 ? 'ur' : 'ul');
});
cv.addEventListener('pointercancel', ()=>{ sw=false; });

window.addEventListener('keydown', e => {
  if(state!=='play'){
    if(e.key==='Enter'||e.key===' '){ const b=veilBody.querySelector('.btn'); if(b){ e.preventDefault(); b.click(); } }
    return;
  }
  const m = { q:'ul', w:'ur', z:'dl', x:'dr',
              Q:'ul', W:'ur', Z:'dl', X:'dr' }[e.key];
  if(m){ e.preventDefault(); move(m); }
});
if(AR && AR.pad) AR.pad.onPress(name => {
  if(AR.paused && AR.paused()) return;
  if(state!=='play'){ if(name==='a'||name==='start'){ const b=veilBody.querySelector('.btn'); if(b) b.click(); } return; }
  const m = { up:'ul', right:'ur', down:'dr', left:'dl' }[name];
  if(m) move(m);
});
if(AR && AR.onRestart) AR.onRestart(start);
window.addEventListener('resize', fitTight);
if(window.ResizeObserver) new ResizeObserver(fitTight).observe($('wrap'));

const sv0 = AR&&AR.save ? AR.save.get('ziggurat') : null;
best = (sv0 && sv0.best) || 0;
reset(); fit(); showTitle();
requestAnimationFrame(()=>{ fitTight(); setTimeout(fitTight,200); });
requestAnimationFrame(frame);
})();
</script>

  try{ if(screen.orientation && screen.orientation.lock)
