<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050813">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Vector</title>
<meta name="arcade-home" content="../../index.html#ge">
<meta name="arcade-title" content="Vector">
<meta name="arcade-accent" content="#9fb4ff">
<script src="../../audio.js"></script>
<script src="../../arcade.js"></script>
<style>
@font-face{font-family:"Space Grotesk";font-style:normal;font-weight:300 700;font-display:swap;src:url("../../fonts/spacegrotesk-var.woff2") format("woff2")}
@font-face{font-family:"Space Mono";font-style:normal;font-weight:400;font-display:swap;src:url("../../fonts/spacemono-400.woff2") format("woff2")}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#050813;
  font-family:"Space Mono",ui-monospace,monospace;color:#dbe4ff;
  user-select:none;-webkit-user-select:none}
#stage{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:var(--safe-top,0px)}
#head{flex:none;display:flex;justify-content:space-between;align-items:baseline;
  padding:9px 14px 5px;font-size:9px;letter-spacing:.20em;color:#5e6b96}
#head b{font-size:17px;color:#9fb4ff;font-weight:700;font-variant-numeric:tabular-nums}
#wrap{flex:1;position:relative;display:grid;place-items:center;min-height:0;
  padding:0 6px calc(6px + var(--safe-bot,0px))}
#field{display:block;touch-action:none;border-radius:2px;
  box-shadow:0 0 0 1px #161e3a, 0 18px 50px -20px #000}
#veil{position:fixed;inset:0;background:rgba(4,7,17,.95);display:grid;place-items:center;
  padding:26px;text-align:center;z-index:40}
#veil.hidden{display:none}
#veilBody{max-width:330px;width:100%}
.eyebrow{font-size:9px;letter-spacing:.26em;color:#9fb4ff;margin-bottom:9px}
h1{font-family:"Space Grotesk",sans-serif;font-size:42px;font-weight:700;margin:0;
  letter-spacing:-.02em;line-height:1;color:#eef2ff}
h1 em{display:block;font-family:"Space Mono",monospace;font-size:9.5px;font-style:normal;
  font-weight:400;letter-spacing:.24em;color:#5e6b96;margin-top:9px}
.tmenu{display:flex;flex-direction:column;gap:8px;max-width:240px;margin:24px auto 0}
.btn{padding:14px 0;width:100%;border:0;border-radius:3px;cursor:pointer;font:inherit;
  font-size:11.5px;letter-spacing:.18em;background:#9fb4ff;color:#0a1030}
.btn.ghost{background:transparent;color:#9fb4ff;border:1px solid rgba(159,180,255,.32)}
.btn:active{opacity:.85}
.ctrls{margin:16px auto 0;max-width:290px}
.crow{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:7px 2px;
  border-bottom:1px solid rgba(255,255,255,.07);font-size:12px;text-align:left}
.crow b{font-weight:600;white-space:nowrap}
.crow i{font-style:normal;color:#8d97bd;text-align:right}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
.gc{border:1px solid #1c2444;border-radius:3px;padding:9px}
.gc span{display:block;font-size:8px;letter-spacing:.18em;color:#5e6b96}
.gc b{display:block;font-size:17px;margin-top:3px;font-variant-numeric:tabular-nums}
/* ---------------------------------------------------------------------------
   PORTRAIT ON A PHONE, WIDE ON A DESKTOP

   The manifest pins the INSTALLED app to portrait, but a browser tab cannot be
   forced — `screen.orientation.lock()` only works from fullscreen and throws
   everywhere else. So: on a touch device held sideways, a panel asks for it
   back. On a desktop there is no such thing as the wrong orientation, and a
   wide window is exactly what we want, so the panel never appears there.

   The test is POINTER TYPE, not width. A landscape phone and a small laptop
   window are the same number of pixels and want opposite things.
   --------------------------------------------------------------------------- */
#rotate{
  position:fixed;inset:0;z-index:9000;display:none;
  place-items:center;text-align:center;padding:28px;
  background:#07050b;color:#e8e2f4;
  font-family:var(--px,ui-monospace,monospace);
}
#rotate b{display:block;font-size:12px;letter-spacing:.22em;color:var(--gold,#e8b23a);margin-bottom:14px}
#rotate span{display:block;font-size:10px;letter-spacing:.14em;color:#8a8296;line-height:2}
#rotate i{display:block;width:52px;height:82px;margin:0 auto 22px;
  border:2px solid rgba(232,178,58,.65);border-radius:8px;
  transform:rotate(90deg);animation:rot 2.4s ease-in-out infinite}
@keyframes rot{0%,40%{transform:rotate(90deg)}60%,100%{transform:rotate(0deg)}}
@media (orientation:landscape) and (pointer:coarse){
  body.lock-portrait #rotate{display:grid}
}
</style>
</head>
<body>
<div id="stage">
  <div id="head">
    <div>SCORE <b id="sc">0</b></div>
    <div>WAVE <b id="wv">1</b></div>
    <div>SHIPS <b id="lv">3</b></div>
  </div>
  <div id="wrap"><canvas id="field"></canvas></div>
</div>
<div id="veil"><div id="veilBody"></div></div>
<script>
(function(){
"use strict";
const AR = window.Arcade, $ = id => document.getElementById(id);
const cv = $('field'), g = cv.getContext('2d');
const veil = $('veil'), veilBody = $('veilBody');

const W = 320, H = 440;
let S = 1;

let ship, rocks, shots, saucer, sauShots, chips, state;
let score, lives, wave, best, deadT = 0, safeT = 0, runs = 0, sauT = 0;

/* ---- the touch scheme, built first as the spec asked ---------------------
   Drag anywhere: the vector from where you pressed to where your thumb is now
   gives heading AND throttle. Release and thrust stops, but momentum does not
   — which is the whole game. A tap without a drag fires.
   -------------------------------------------------------------------------- */
let drag = null;

function reset(){
  score=0; lives=3; wave=1; deadT=0; safeT=2;
  ship = { x:W/2, y:H/2, vx:0, vy:0, a:-Math.PI/2, thrust:0 };
  shots=[]; sauShots=[]; chips=[]; saucer=null; sauT=14;
  buildWave(); paintHud();
}

function buildWave(){
  rocks = [];
  const n = Math.min(11, 4 + wave);
  for(let i=0;i<n;i++){
    let x, y, tries=0;
    do { x=Math.random()*W; y=Math.random()*H; tries++; }
    while(Math.hypot(x-ship.x, y-ship.y) < 90 && tries<50);
    rocks.push(newRock(x, y, 3));
  }
  safeT = 1.6;
}

function newRock(x, y, size){
  const sp = (0.28 + Math.random()*0.26) * (1 + (3-size)*0.55) * (1 + (wave-1)*0.05);
  const a = Math.random()*6.2832;
  /* a fractured outline, and the fault lines it will spall along */
  const pts = [], faults = [];
  const n = 9 + ((Math.random()*3)|0);
  for(let i=0;i<n;i++){
    const ang = i/n*6.2832;
    pts.push({ ang, r: 0.62 + Math.random()*0.42 });
  }
  for(let i=0;i<3;i++) faults.push({ a: Math.random()*6.2832, o: (Math.random()-0.5)*0.5 });
  return { x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, size,
           r: size===3 ? 26 : size===2 ? 15 : 8,
           spin:(Math.random()-0.5)*0.02, rot:Math.random()*6.28, pts, faults };
}

function wrap(o){
  if(o.x < -o.r) o.x = W + o.r;
  if(o.x > W + o.r) o.x = -o.r;
  if(o.y < -o.r) o.y = H + o.r;
  if(o.y > H + o.r) o.y = -o.r;
}

function fire(){
  if(state !== 'play' || deadT > 0 || shots.length >= 4) return;
  shots.push({ x: ship.x + Math.cos(ship.a)*11, y: ship.y + Math.sin(ship.a)*11,
               vx: Math.cos(ship.a)*4.6 + ship.vx, vy: Math.sin(ship.a)*4.6 + ship.vy,
               life: 1.15, r:1 });
  snd.fire();
}

function hyperspace(){
  if(state !== 'play' || deadT > 0) return;
  ship.x = 20 + Math.random()*(W-40);
  ship.y = 20 + Math.random()*(H-40);
  ship.vx = ship.vy = 0;
  snd.jump();
  /* it might put you inside a rock. that is the deal. */
  for(const r of rocks)
    if(Math.hypot(r.x-ship.x, r.y-ship.y) < r.r + 8){ die(); return; }
  if(Math.random() < 0.06) die();
}

/* ---- step -------------------------------------------------------------- */
function step(dt){
  if(state !== 'play') return;
  const k = Math.min(2.4, dt*60);
  if(safeT > 0) safeT -= dt;

  if(deadT > 0){
    deadT -= dt;
    if(deadT <= 0){
      if(lives > 0){ ship.x=W/2; ship.y=H/2; ship.vx=ship.vy=0; safeT=2; }
      else { gameOver(); return; }
    }
  } else {
    if(drag){
      const dx = drag.x - drag.ox, dy = drag.y - drag.oy;
      const d = Math.hypot(dx,dy);
      if(d > 6){
        ship.a = Math.atan2(dy, dx);
        ship.thrust = Math.min(1, (d-6)/52);
        ship.vx += Math.cos(ship.a) * 0.105 * ship.thrust * k;
        ship.vy += Math.sin(ship.a) * 0.105 * ship.thrust * k;
      } else ship.thrust = 0;
    } else ship.thrust = 0;

    /* a whisper of drag, so a run is not one long slide, but far too little
       to be a brake — the momentum is still yours to live with */
    ship.vx *= Math.pow(0.995, k);
    ship.vy *= Math.pow(0.995, k);
    const sp = Math.hypot(ship.vx, ship.vy);
    if(sp > 4.4){ ship.vx = ship.vx/sp*4.4; ship.vy = ship.vy/sp*4.4; }
    ship.x += ship.vx*k; ship.y += ship.vy*k;
    ship.r = 8; wrap(ship);
  }

  for(let i=shots.length-1;i>=0;i--){
    const s = shots[i];
    s.x += s.vx*k; s.y += s.vy*k; s.life -= dt;
    wrap(s);
    if(s.life <= 0){ shots.splice(i,1); continue; }
  }
  for(let i=sauShots.length-1;i>=0;i--){
    const s = sauShots[i];
    s.x += s.vx*k; s.y += s.vy*k; s.life -= dt; s.r = 1;
    wrap(s);
    if(s.life <= 0){ sauShots.splice(i,1); continue; }
    if(deadT <= 0 && safeT <= 0 && Math.hypot(s.x-ship.x, s.y-ship.y) < 9){
      sauShots.splice(i,1); die(); continue;
    }
  }

  for(const r of rocks){ r.x += r.vx*k; r.y += r.vy*k; r.rot += r.spin*k; wrap(r); }

  /* shots vs rocks */
  for(let i=rocks.length-1;i>=0;i--){
    const r = rocks[i];
    let hit = -1;
    for(let j=0;j<shots.length;j++)
      if(Math.hypot(shots[j].x-r.x, shots[j].y-r.y) < r.r){ hit = j; break; }
    if(hit >= 0){
      shots.splice(hit,1);
      breakRock(i);
      continue;
    }
    if(deadT <= 0 && safeT <= 0 && Math.hypot(r.x-ship.x, r.y-ship.y) < r.r + 7){
      breakRock(i); die();
    }
  }

  /* the saucers */
  sauT -= dt;
  if(!saucer && sauT <= 0 && rocks.length){
    const small = wave >= 3 && Math.random() < 0.45;
    saucer = { x: Math.random()<0.5 ? -18 : W+18, y: 40+Math.random()*(H-80),
               vx: 0, vy: 0, small, fire: 1.4, r: small?7:11 };
    saucer.vx = saucer.x < 0 ? 0.7 : -0.7;
    snd.siren(small);
  }
  if(saucer){
    saucer.x += saucer.vx*k;
    saucer.y += Math.sin(saucer.x*0.03)*0.5*k;
    if(saucer.x < -40 || saucer.x > W+40){ saucer=null; sauT = 12 - wave*0.5; }
    else {
      saucer.fire -= dt;
      if(saucer.fire <= 0){
        saucer.fire = Math.max(0.6, 1.6 - wave*0.06);
        let a;
        if(saucer.small){
          /* the small one aims properly, with a little lead */
          const px = ship.x + ship.vx*14, py = ship.y + ship.vy*14;
          a = Math.atan2(py-saucer.y, px-saucer.x) + (Math.random()-0.5)*0.10;
        } else a = Math.random()*6.2832;
        sauShots.push({ x:saucer.x, y:saucer.y, vx:Math.cos(a)*2.4, vy:Math.sin(a)*2.4, life:1.6, r:1 });
        snd.sauFire();
      }
      for(let j=shots.length-1;j>=0;j--){
        if(Math.hypot(shots[j].x-saucer.x, shots[j].y-saucer.y) < saucer.r+2){
          score += saucer.small ? 1000 : 200;
          spall(saucer.x, saucer.y, 10, '#cfe0ff');
          shots.splice(j,1); saucer=null; sauT = 12 - wave*0.5;
          snd.pop(0); break;
        }
      }
      if(saucer && deadT<=0 && safeT<=0 && Math.hypot(saucer.x-ship.x, saucer.y-ship.y) < saucer.r+7){
        saucer=null; sauT=12; die();
      }
    }
  }

  for(let i=chips.length-1;i>=0;i--){
    const c = chips[i];
    c.x += c.vx*k; c.y += c.vy*k; c.rot += c.spin*k; c.t -= dt*0.9;
    if(c.t <= 0) chips.splice(i,1);
  }

  if(!rocks.length && !saucer) nextWave();
  paintHud();
}

function breakRock(i){
  const r = rocks[i];
  score += r.size === 3 ? 20 : r.size === 2 ? 50 : 100;
  spall(r.x, r.y, r.size*4, '#a8c4ff');
  snd.pop(r.size);
  rocks.splice(i,1);
  if(r.size > 1){
    for(let s=0;s<2;s++){
      const nr = newRock(r.x, r.y, r.size-1);
      /* the halves fly apart along the fault, not at random */
      const fa = r.faults[0].a + (s ? Math.PI/2 : -Math.PI/2);
      const sp = Math.hypot(nr.vx, nr.vy);
      nr.vx = Math.cos(fa)*sp + r.vx*0.5;
      nr.vy = Math.sin(fa)*sp + r.vy*0.5;
      rocks.push(nr);
    }
  }
}
function spall(x, y, n, col){
  for(let i=0;i<n;i++){
    const a = Math.random()*6.2832, sp = 0.5+Math.random()*1.9;
    chips.push({ x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, t:1,
                 rot:Math.random()*6.28, spin:(Math.random()-0.5)*0.3,
                 len: 2+Math.random()*4, col });
  }
}
function die(){
  lives--; deadT = 1.4;
  spall(ship.x, ship.y, 14, '#dbe4ff');
  snd.die();
  paintHud();
}
function nextWave(){
  wave++; score += 250;
  buildWave(); snd.wave(); paintHud();
}

/* ---- audio ------------------------------------------------------------- */
let beat = 0;
const snd = {
  tick(stp, t){
    if(!AR || state !== 'play') return;
    /* two alternating bass notes, nothing else. tension, not melody. */
    beat = 1 - beat;
    const rate = Math.max(1, 5 - Math.floor(wave/2));
    if(stp % rate !== 0) return;
    AR.sfx.tone({ t, freq: beat ? 55 : 46.25, dur:0.20, type:'triangle',
                  gain:0.080, attack:0.006, cutoff:300, bus:'music' });
  },
  fire(){ if(AR) AR.sfx.tone({ freq:1100, to:520, dur:0.07, type:'square', gain:0.042, cutoff:2600 }); },
  pop(size){ if(AR){ AR.sfx.noise({ freq: 400 + (3-size)*500, to:180, dur:0.22,
                                    gain:0.075, filter:'bandpass' });
                     AR.sfx.tone({ freq: 200 + (3-size)*140, to:70, dur:0.18,
                                   type:'square', gain:0.04 }); } },
  jump(){ if(AR){ AR.sfx.noise({ freq:200, to:4000, dur:0.22, gain:0.07, filter:'bandpass' });
                  AR.sfx.tone({ freq:900, to:120, dur:0.24, type:'sawtooth', gain:0.05 }); } },
  siren(small){ if(!AR) return;
    for(let i=0;i<7;i++) AR.sfx.tone({ t:AR.audio.now()+i*0.10,
      freq: small ? (i%2?880:1180) : (i%2?300:420), dur:0.09, type:'square', gain:0.045 }); },
  sauFire(){ if(AR) AR.sfx.tone({ freq:520, to:820, dur:0.08, type:'sawtooth', gain:0.04, cutoff:1800 }); },
  die(){ if(AR){ AR.sfx.noise({ freq:900, to:60, dur:0.85, gain:0.10, filter:'lowpass' });
                 AR.sfx.tone({ freq:240, to:40, dur:0.9, type:'sawtooth', gain:0.07, cutoff:600 }); } },
  wave(){ if(AR) AR.sfx.tone({ freq:180, to:420, dur:0.5, type:'sine', gain:0.06, verb:0.5 }); }
};

/* ---- draw: ice --------------------------------------------------------- */
function fit(){
  const wrap2 = $('wrap');
  S = Math.min((wrap2.clientWidth-4)/W, (wrap2.clientHeight-4)/H);
  const dpr = Math.min(2, window.devicePixelRatio||1);
  cv.width=Math.round(W*S*dpr); cv.height=Math.round(H*S*dpr);
  cv.style.width=(W*S)+'px'; cv.style.height=(H*S)+'px';
  g.setTransform(dpr*S,0,0,dpr*S,0,0);
  draw();
}
function fitTight(){
  fit();
  for(let i=0;i<6;i++){
    const r = cv.getBoundingClientRect();
    if(r.right <= window.innerWidth && r.bottom <= $('wrap').getBoundingClientRect().bottom+1) break;
    S *= 0.97;
    const dpr = Math.min(2, window.devicePixelRatio||1);
    cv.width=Math.round(W*S*dpr); cv.height=Math.round(H*S*dpr);
    cv.style.width=(W*S)+'px'; cv.style.height=(H*S)+'px';
    g.setTransform(dpr*S,0,0,dpr*S,0,0);
  }
  draw();
}

function iceRock(r){
  g.save(); g.translate(r.x, r.y); g.rotate(r.rot);
  g.beginPath();
  r.pts.forEach((p,i) => {
    const x = Math.cos(p.ang)*p.r*r.r, y = Math.sin(p.ang)*p.r*r.r;
    i ? g.lineTo(x,y) : g.moveTo(x,y);
  });
  g.closePath();
  /* translucent crystal, lit from the upper left */
  const gr = g.createLinearGradient(-r.r, -r.r, r.r, r.r);
  gr.addColorStop(0,   'rgba(190,215,255,.55)');
  gr.addColorStop(0.45,'rgba(120,150,220,.30)');
  gr.addColorStop(1,   'rgba(60,80,150,.20)');
  g.fillStyle = gr; g.fill();
  g.strokeStyle='rgba(210,230,255,.65)'; g.lineWidth=1.2; g.stroke();
  /* the fault lines it will break along */
  g.save(); g.clip();
  g.strokeStyle='rgba(220,238,255,.30)'; g.lineWidth=1;
  for(const f of r.faults){
    g.beginPath();
    g.moveTo(Math.cos(f.a)*r.r*1.2 + f.o*r.r, Math.sin(f.a)*r.r*1.2);
    g.lineTo(Math.cos(f.a+Math.PI)*r.r*1.2 + f.o*r.r, Math.sin(f.a+Math.PI)*r.r*1.2);
    g.stroke();
  }
  /* a bright internal facet */
  g.fillStyle='rgba(255,255,255,.18)';
  g.beginPath(); g.ellipse(-r.r*0.25, -r.r*0.28, r.r*0.30, r.r*0.18, -0.6, 0, 6.2832); g.fill();
  g.restore();
  g.restore();
}

function draw(){
  g.fillStyle='#070b18'; g.fillRect(0,0,W,H);
  /* deep navy, with a scatter of cold stars */
  for(let i=0;i<50;i++){
    const x=(i*137.5)%W, y=(i*79.3)%H;
    g.fillStyle='rgba(190,210,255,'+(0.05+((i*13)%7)/40)+')';
    g.fillRect(x,y,1,1);
  }

  for(const r of rocks) iceRock(r);

  for(const c of chips){
    g.save(); g.translate(c.x,c.y); g.rotate(c.rot);
    g.globalAlpha=Math.max(0,c.t);
    g.strokeStyle=c.col; g.lineWidth=1.2;
    g.beginPath(); g.moveTo(-c.len,0); g.lineTo(c.len,0); g.stroke();
    g.restore(); g.globalAlpha=1;
  }

  if(saucer){
    g.save(); g.translate(saucer.x, saucer.y);
    const k2 = saucer.small ? 0.65 : 1;
    g.scale(k2,k2);
    g.fillStyle='rgba(120,145,215,.85)';
    g.beginPath(); g.ellipse(0,0,11,4,0,0,6.2832); g.fill();
    g.fillStyle='rgba(200,220,255,.9)';
    g.beginPath(); g.ellipse(0,-3,5.5,3.5,0,Math.PI,0); g.fill();
    g.fillStyle='rgba(255,255,255,.35)';
    g.fillRect(-11,-1,22,1.2);
    g.restore();
  }

  for(const s of shots){
    g.fillStyle='#eef2ff'; g.fillRect(s.x-1, s.y-1, 2.2, 2.2);
  }
  for(const s of sauShots){
    g.fillStyle='#ff8fa8'; g.fillRect(s.x-1, s.y-1, 2.2, 2.2);
  }

  if(deadT <= 0 && state === 'play' && (safeT <= 0 || Math.floor(safeT*8)%2===0)){
    g.save(); g.translate(ship.x, ship.y); g.rotate(ship.a);
    /* the thrust flame, scaled by throttle so it reads as acceleration */
    if(ship.thrust > 0.02){
      const f = ship.thrust;
      const fl = g.createLinearGradient(-8,0,-8-14*f,0);
      fl.addColorStop(0,'rgba(255,220,140,.9)');
      fl.addColorStop(0.5,'rgba(255,140,60,.5)');
      fl.addColorStop(1,'rgba(255,90,40,0)');
      g.fillStyle=fl;
      g.beginPath(); g.moveTo(-7,-3.4);
      g.lineTo(-8-(12+Math.random()*7)*f, 0);
      g.lineTo(-7,3.4); g.closePath(); g.fill();
    }
    /* a dark wedge with a lit leading edge */
    g.fillStyle='#0d1330';
    g.beginPath(); g.moveTo(12,0); g.lineTo(-8,-7); g.lineTo(-4,0); g.lineTo(-8,7);
    g.closePath(); g.fill();
    g.strokeStyle='#cfe0ff'; g.lineWidth=1.3;
    g.beginPath(); g.moveTo(12,0); g.lineTo(-8,-7); g.lineTo(-4,0); g.lineTo(-8,7);
    g.closePath(); g.stroke();
    g.restore();
  }

  /* the aiming line, so the drag scheme is legible while you learn it */
  if(drag && deadT <= 0){
    const dx = drag.x-drag.ox, dy = drag.y-drag.oy, d = Math.hypot(dx,dy);
    if(d > 6){
      const a = Math.atan2(dy,dx), th = Math.min(1,(d-6)/52);
      g.strokeStyle='rgba(159,180,255,.28)'; g.lineWidth=1.4;
      g.setLineDash([4,5]);
      g.beginPath(); g.moveTo(ship.x, ship.y);
      g.lineTo(ship.x+Math.cos(a)*(24+th*40), ship.y+Math.sin(a)*(24+th*40));
      g.stroke(); g.setLineDash([]);
    }
  }
}

function paintHud(){
  $('sc').textContent=score.toLocaleString();
  $('wv').textContent=wave;
  $('lv').textContent=Math.max(0,lives);
}

let last=0;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(0.05,(now-last)/1000)||0; last=now;
  step(dt); draw();
}

/* ---- state ------------------------------------------------------------- */
function start(){
  runs++; reset(); state='play'; veil.classList.add('hidden'); fitTight();
  if(AR && AR.music){ AR.music.stop(); AR.music.start(150, 2, snd.tick); }
}
function gameOver(){
  state='over';
  if(AR && AR.music) AR.music.stop();
  const sv = AR&&AR.save ? AR.save.get('vector') : null;
  best = Math.max((sv&&sv.best)||0, score);
  if(AR && AR.save) AR.save.merge('vector', { best, wave, label:'BEST '+best.toLocaleString() });
  showOver();
}

function openVeil(html, acts){
  veilBody.innerHTML=html; veil.classList.remove('hidden');
  veilBody.querySelectorAll('[data-act]').forEach(b =>
    b.addEventListener('click', ()=>{ const fn=acts&&acts[b.dataset.act]; if(fn) fn(); }));
}
function showTitle(){
  state='title';
  openVeil('<h1>Vector</h1>' +
    '<div class="tmenu">' +
      '<button class="btn" data-act="play">PLAY</button>' +
      '<button class="btn ghost" data-act="opts">OPTIONS</button>' +
      '<button class="btn ghost" data-act="quit">QUIT</button>' +
    '</div>', { play:start, opts:showOptions, quit:()=>{ if(AR&&AR.home) AR.home(); } });
}
function showOptions(){
  openVeil('<div class="eyebrow">VECTOR</div><h1>Options</h1>' +
    '<div class="tmenu">' +
      '<button class="btn ghost" data-act="ctrl">CONTROLS</button>' +
      '<button class="btn" data-act="back">BACK</button>' +
    '</div>', { ctrl:showControls, back:showTitle });
}
function showControls(){
  const touch=!!(AR&&AR.touch);
  const rows = touch ? [
    ['Drag anywhere','direction aims, distance is throttle'],
    ['Let go','thrust stops \u2014 momentum does not'],
    ['Tap without dragging','fire'],
    ['Two fingers','hyperspace: somewhere else, possibly inside a rock'],
    ['Nothing slows you','except pointing the other way']
  ] : [
    ['Left / Right','turn'],
    ['Up','thrust'],
    ['Space','fire'],
    ['Shift','hyperspace \u2014 it might kill you'],
    ['Nothing slows you','except pointing the other way']
  ];
  openVeil('<div class="eyebrow">'+(touch?'TOUCH':'KEYBOARD')+'</div><h1>Controls</h1>' +
    '<div class="ctrls">'+rows.map(r=>'<div class="crow"><b>'+r[0]+'</b><i>'+r[1]+'</i></div>').join('')+'</div>' +
    '<button class="btn" data-act="back" style="margin-top:16px">BACK</button>', { back:showOptions });
}
function showOver(){
  openVeil('<div class="eyebrow">ADRIFT</div>' +
    '<h1>'+score.toLocaleString()+'<em>FINAL SCORE</em></h1>' +
    '<div class="grid2">' +
      '<div class="gc"><span>WAVE</span><b>'+wave+'</b></div>' +
      '<div class="gc"><span>BEST</span><b>'+best.toLocaleString()+'</b></div>' +
    '</div>' +
    '<div class="tmenu">' +
      '<button class="btn" data-act="again">PLAY AGAIN</button>' +
      '<button class="btn ghost" data-act="title">TITLE</button>' +
    '</div>', { again:start, title:showTitle });
}

/* ---- input ------------------------------------------------------------- */
const toLocal = (cx,cy) => { const r=cv.getBoundingClientRect(); return {x:(cx-r.left)/S, y:(cy-r.top)/S}; };
let downAt = 0, pointers = 0;
cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId);
  pointers++;
  if(pointers >= 2){ hyperspace(); drag = null; return; }
  const p = toLocal(e.clientX, e.clientY);
  drag = { ox:p.x, oy:p.y, x:p.x, y:p.y };
  downAt = performance.now();
});
cv.addEventListener('pointermove', e => {
  if(!drag) return;
  const p = toLocal(e.clientX, e.clientY);
  drag.x = p.x; drag.y = p.y;
});
function up(){
  if(drag){
    const d = Math.hypot(drag.x-drag.ox, drag.y-drag.oy);
    /* a press that never became a drag is a shot */
    if(d < 8 && performance.now()-downAt < 300) fire();
  }
  drag = null;
  pointers = Math.max(0, pointers-1);
}
cv.addEventListener('pointerup', up);
cv.addEventListener('pointercancel', up);

const keys = {};
window.addEventListener('keydown', e => {
  if(state!=='play'){
    if(e.key==='Enter'||e.key===' '){ const b=veilBody.querySelector('.btn'); if(b){ e.preventDefault(); b.click(); } }
    return;
  }
  keys[e.key]=true;
  if(e.key===' '){ e.preventDefault(); fire(); }
  if(e.key==='Shift'){ e.preventDefault(); hyperspace(); }
});
window.addEventListener('keyup', e => { keys[e.key]=false; });
/* the keyboard keeps classic rotate-and-thrust */
setInterval(() => {
  if(state!=='play' || deadT>0) return;
  if(keys.ArrowLeft) ship.a -= 0.075;
  if(keys.ArrowRight) ship.a += 0.075;
  if(keys.ArrowUp){
    ship.thrust = 1;
    ship.vx += Math.cos(ship.a)*0.105;
    ship.vy += Math.sin(ship.a)*0.105;
  }
}, 16);

if(AR && AR.pad) AR.pad.onPress(name => {
  if(AR.paused&&AR.paused()) return;
  if(state!=='play'){ if(name==='a'||name==='start'){ const b=veilBody.querySelector('.btn'); if(b) b.click(); } return; }
  if(name==='a') fire();
  else if(name==='b') hyperspace();
});
if(AR && AR.onRestart) AR.onRestart(start);
window.addEventListener('resize', fitTight);
if(window.ResizeObserver) new ResizeObserver(fitTight).observe($('wrap'));

const sv0 = AR&&AR.save ? AR.save.get('vector') : null;
best=(sv0&&sv0.best)||0;
reset(); fit(); showTitle();
requestAnimationFrame(()=>{ fitTight(); setTimeout(fitTight,200); });
requestAnimationFrame(frame);
})();
</script>

<span>TINY ARCADE IS PLAYED UPRIGHT</span></div></div>
<script>
/* only a device with a coarse pointer gets the portrait lock — a desktop
   window is free to be any shape, and wide is the better shape there */
(function(){
  if(matchMedia('(pointer:coarse)').matches) document.body.classList.add('lock-portrait');
  /* an installed app can genuinely lock; a tab cannot, and throwing is fine */
  try{ if(screen.orientation && screen.orientation.lock)
        screen.orientation.lock('portrait').catch(function(){}); }catch(e){}
})();
</script>
