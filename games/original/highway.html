<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#120a24">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Highway</title>
  <meta name="arcade-home" content="../../index.html#original">
  <meta name="arcade-title" content="Highway">
<meta name="arcade-accent" content="#ff8a3d">
<script src="../../audio.js"></script>
<script src="../../arcade.js"></script>
<style>
/* Self-hosted — no network call at launch, so a wrapped native build
   and the offline PWA both render correctly. Generated by fonts.py.
   Variable families ship whole with a weight RANGE: instancing each
   weight separately produced files the browser silently refused. */
@font-face{font-family:"Saira Condensed";font-style:normal;font-weight:600;font-display:swap;src:url("../../fonts/sairacondensed-600.woff2") format("woff2")}
@font-face{font-family:"Saira Condensed";font-style:normal;font-weight:800;font-display:swap;src:url("../../fonts/sairacondensed-800.woff2") format("woff2")}
@font-face{font-family:"Archivo";font-style:normal;font-weight:100 900;font-display:swap;src:url("../../fonts/archivo-var.woff2") format("woff2")}


:root{
  --sodium:#ff8a3d;
  --pale:#ffeede;
  --dim:rgba(255,238,222,.5);
  --red:#ff3355;
  --blue:#4d8cff;
  --cyan:#5ff0d8;
  --disp:"Saira Condensed","Arial Narrow",sans-serif;
  --lab:"Archivo","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{
  height:100%;width:100%;position:fixed;overflow:hidden;background:#08050f;
  color:var(--pale);font-family:var(--lab);
  overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;
}
#stage{position:absolute;inset:0;display:grid;place-items:center}
#frame{
  position:relative;overflow:hidden;background:#08050f;
  width:min(100dvw, calc(var(--stage-h, 100dvh) * 0.70));height:var(--stage-h, 100dvh);
}
canvas{display:block;width:100%;height:100%;touch-action:none}

/* ------------ HUD ------------ */
#hud{position:absolute;inset:0;pointer-events:none;z-index:10;
  padding:calc(var(--safe-top, env(safe-area-inset-top,0px)) + 12px) 14px calc(env(safe-area-inset-bottom,0px) + 14px);
  display:flex;flex-direction:column;justify-content:space-between}
.toprow{ padding-top:58px; /* clear of the rear-view mirror */ display:flex;justify-content:space-between;align-items:flex-start}
.stat span{display:block;font-size:8.5px;font-weight:700;letter-spacing:.22em;color:var(--dim)}
.stat b{font-family:var(--disp);font-weight:800;font-size:26px;line-height:1.05;
  font-variant-numeric:tabular-nums;letter-spacing:.01em}
.stat i{font-style:normal;font-size:11px;font-weight:600;color:var(--dim);margin-left:2px}
.stat.r{text-align:right}
.stat.c{text-align:center;flex:0 0 auto}

#pursuit{
  width:fit-content;margin:10px auto 0;font-size:9.5px;font-weight:700;letter-spacing:.28em;
  padding:5px 12px;border:1px solid var(--red);color:#fff;background:rgba(255,51,85,.16);
  opacity:0;transition:opacity .2s;
}
#pursuit.on{opacity:1;animation:bl .7s steps(2) infinite}
@keyframes bl{0%,100%{border-color:var(--red);background:rgba(255,51,85,.16)}
              50%{border-color:var(--blue);background:rgba(77,140,255,.16)}}

#warn{
  position:absolute;left:0;right:0;top:38%;text-align:center;
  font-family:var(--disp);font-weight:800;font-size:clamp(20px,6.4vw,30px);letter-spacing:.12em;
  color:#fff;text-shadow:0 0 18px var(--red),0 2px 0 #7a0d20;opacity:0;
}
#warn.on{animation:wn 1.9s ease-out 1}
@keyframes wn{0%{opacity:0;transform:scale(1.3)}12%{opacity:1;transform:scale(1)}
              70%{opacity:1}100%{opacity:0}}

.botrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.speedo{display:flex;align-items:baseline;gap:5px}
.speedo b{font-family:var(--disp);font-weight:800;font-size:clamp(46px,15vw,68px);
  line-height:.8;font-variant-numeric:tabular-nums;text-shadow:0 0 26px rgba(255,138,61,.45)}
.speedo span{font-size:9px;font-weight:700;letter-spacing:.2em;color:var(--dim);padding-bottom:4px}
.bars{flex:1;max-width:140px;display:flex;flex-direction:column;gap:5px;margin-bottom:6px}
.bar{display:flex;align-items:center;gap:6px}
.bar em{font-style:normal;font-size:8px;font-weight:700;letter-spacing:.16em;color:var(--dim);width:26px}
.trk{flex:1;height:7px;background:rgba(255,238,222,.10);position:relative;overflow:hidden;
  transform:skewX(-18deg)}
.trk i{position:absolute;inset:0;width:0;display:block;transition:width .12s linear}
#dmgFill{background:linear-gradient(90deg,#7a2233,var(--red))}
#nosFill{background:linear-gradient(90deg,#1d6e73,var(--cyan))}

/* Both controls under one thumb on a steep diagonal: BRAKE low and outboard
   where the thumb rests, NOS above and inboard so it takes a deliberate reach.
   `body.pedals-left` mirrors the pair. */
/* ---- the pedal box ------------------------------------------------------
   Brake and accelerator side by side as actual pedals, hinged at the top and
   tilting when pressed. The nitrous is a bottle lying on its side ABOVE the
   accelerator, because pressing it means gas AND nitrous at once.
   -------------------------------------------------------------------------- */
/* The whole cluster was 150x186 with 62x122 pedals — it covered the player's
   own car and ran off the bottom of the screen. Everything is about 70% of
   what it was, tucked into the corner, and nothing overlaps anything else. */
#pedals{
  position:absolute;z-index:12;pointer-events:none;
  transform-origin:100% 100%;
  transform:scale(var(--ark-ui,1));
  right:calc(env(safe-area-inset-right,0px) + 10px);
  bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  width:104px;height:126px;
}
#pedals button{
  position:absolute;pointer-events:auto;padding:0;border:0;background:none;
  -webkit-tap-highlight-color:transparent;
}
/* the two pedals: rubber pads on a steel arm, tilting on press */
#gas, #brake{
  bottom:0;width:46px;height:84px;
  perspective:170px;
}
#brake{ left:0 }
#gas{ right:0 }
#gas i, #brake i{
  display:block;width:100%;height:100%;border-radius:7px 7px 5px 5px;
  transform-origin:50% 0%;
  transition:transform .07s ease-out, filter .07s ease-out;
  background:
    repeating-linear-gradient(to bottom,
      rgba(255,255,255,.10) 0 3px, rgba(0,0,0,.22) 3px 7px),
    linear-gradient(to bottom, #3a3f47 0%, #23262c 55%, #15171b 100%);
  box-shadow:
    inset 0 2px 0 rgba(255,255,255,.22),
    inset 0 -6px 10px rgba(0,0,0,.6),
    0 5px 0 #0c0d10, 0 10px 16px -6px #000;
  border:1px solid #4a505a;
}
#brake i{ border-color:#6b3436; box-shadow:inset 0 2px 0 rgba(255,150,150,.22),
  inset 0 -6px 10px rgba(0,0,0,.6), 0 5px 0 #2a0e10, 0 10px 16px -6px #000 }
#gas i{ border-color:#3f5f42; box-shadow:inset 0 2px 0 rgba(170,255,180,.20),
  inset 0 -6px 10px rgba(0,0,0,.6), 0 5px 0 #0e2412, 0 10px 16px -6px #000 }
/* pressed: the pad rotates away and drops onto its stop */
#gas.on i, #brake.on i{ transform:rotateX(26deg) translateY(4px); filter:brightness(1.5) }
#brake.on i{ filter:brightness(1.35) saturate(1.5) }

/* the nitrous bottle, lying on its side over the accelerator */
#nitro{
  /* The dials and the gate were landing on top of it. 92px cleared the pedals
     but nothing above, so it needed the gap raising — not by much, or it
     drifts away from the thumb that presses it. */
  right:0;bottom:100px;width:72px;height:30px;
}
body.no-touch #nitro{ transform-origin:100% 100%; transform:scale(var(--ark-ui,1)) }
#nitro i{
  display:block;width:100%;height:100%;position:relative;overflow:hidden;
  /* The DOMED BASE is on the right and the tapered shoulder on the left,
     because that is the end the valve screws into — the nozzle was on the
     base, which is the one place a bottle has no opening at all. */
  border-radius:7px 16px 16px 7px;
  /* The bottle IS the gauge now — the old #nosFill bar sat under the pedals
     where nothing could see it. --nos is set every frame; the charge fills
     from the neck end and the empty part reads as dark glass. */
  background:
    /* drains from the valve end, so the charge you have left sits against the
       base — which is the way round a real bottle empties */
    linear-gradient(to right,
      rgba(8,30,32,.92) 0%,
      rgba(8,30,32,.92) calc(100% - var(--nos,40%)),
      transparent      calc(100% - var(--nos,40%))),
    linear-gradient(to bottom,#7ef0dc 0%,#2fbcae 42%,#0e5f60 100%);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.45), inset 0 -6px 10px rgba(0,0,0,.45),
             0 4px 12px -3px #000;
  border:1px solid rgba(140,255,238,.5);
}
/* The neck, valve and NOZZLE. It was a plain block on the end — a bottle needs
   somewhere for the gas to actually leave, so this is a brass valve body with a
   tapered nozzle tip beyond it. */
/* The brass valve body, on the NECK end. It lives on the BUTTON, not on the
   bottle: `#nitro i` carries `overflow:hidden` for the charge fill, which was
   clipping its own pseudo-element clean off. */
#nitro::before{
  content:"";position:absolute;left:-11px;top:50%;transform:translateY(-50%);
  width:13px;height:14px;border-radius:1px 2px 2px 1px;
  background:linear-gradient(to bottom,#e2c98a,#a8843c 55%,#5f4718);
  box-shadow:inset 0 1px 0 rgba(255,240,200,.7), -1px 0 0 rgba(0,0,0,.35);
  z-index:1;
}
#nitro.on::before{ filter:brightness(1.45) }
/* the tip: a short taper past the valve, with a dark bore down the middle */
/* the tapered outlet, beyond the valve and pointing away from the bottle */
#nitro::after{
  content:"";position:absolute;left:-20px;top:50%;
  transform:translateY(-50%);
  width:9px;height:7px;
  background:linear-gradient(to bottom,#d8d2c4,#8a8f98 55%,#41464e);
  clip-path:polygon(100% 0, 0 22%, 0 78%, 100% 100%);
}
#nitro.on::after{ filter:brightness(1.5) }
/* a strap band across the middle, so it reads as a bottle not a pill */
/* the label, as on the real bottle */
#nitro b{
  position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
  text-align:center;pointer-events:none;z-index:2;
  font-family:var(--disp);font-size:9px;font-weight:800;
  letter-spacing:.16em;color:#eafffb;
  text-shadow:0 1px 0 rgba(0,0,0,.55), 0 0 6px rgba(120,255,235,.45);
}
#nitro i::before{
  content:"";position:absolute;left:52%;top:-1px;width:9px;height:calc(100% + 2px);
  background:rgba(10,40,42,.55);border-left:1px solid rgba(160,255,240,.30);
  border-right:1px solid rgba(160,255,240,.30);
}
/* the horn: a chrome boss on the wheel, left of the pedals */
#horn{
  left:-46px;bottom:4px;width:40px;height:40px;
}
#horn i{
  display:block;width:100%;height:100%;border-radius:50%;
  background:radial-gradient(circle at 38% 32%, #f2f5fa 0%, #b7c0cc 34%, #6f7783 70%, #3a4049 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.6), inset 0 -5px 8px rgba(0,0,0,.5),
             0 4px 10px -2px #000;
  border:1px solid #565e69;position:relative;
}
/* A POST HORN, drawn from the reference: the bell is a flat vertical mouth on
   the left, the tube sweeps away to the right and narrows, and the coiled loop
   hangs below it as an open ellipse. Nothing about it can be mistaken for a
   speaker, because a speaker has no loop. */
#horn i::after{
  content:"";position:absolute;inset:16%;
  background:rgba(24,28,34,.84);
  -webkit-mask:var(--hornmark) center/contain no-repeat;
          mask:var(--hornmark) center/contain no-repeat;
}
#horn i{
  --hornmark:url('data:image/svg+xml;utf8,\
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">\
<rect x="3.4" y="6.2" width="2.6" height="19.6" rx="0.5"/>\
<path d="M6.0 7.2c0.9 3.9 4.4 5.9 10.1 6.8 4.4 0.7 8.4 0.9 11.6 0.7 0.5-0.03 0.9 0.25 1.0 0.6l0-1.1c0-0.5 0.4-0.9 0.9-0.9v5.0c-0.5 0-0.9-0.4-0.9-0.9l0-1.0c-0.15 0.35-0.5 0.6-0.95 0.6-1.5-0.05-3.1-0.02-4.8 0.1l0-2.4c-3.0 0.15-6.6-0.05-10.6-0.7C7.6 12.7 4.6 10.6 3.4 6.9z"/>\
<path d="M6.0 24.8c0.75-3.2 3.3-5.1 7.4-6.1l0 2.5c-3.1 0.8-5.0 2.2-5.6 4.6z"/>\
<path d="M17.4 17.6c4.6 0 8.3 1.9 8.3 4.3s-3.7 4.3-8.3 4.3-8.3-1.9-8.3-4.3 3.7-4.3 8.3-4.3zm0 1.9c-3.4 0-6.1 1.1-6.1 2.4s2.7 2.4 6.1 2.4 6.1-1.1 6.1-2.4-2.7-2.4-6.1-2.4z"/>\
</svg>');
}
#horn.on i{ filter:brightness(1.35); transform:translateY(2px) }
body.pedals-left #horn{ left:auto; right:-58px }

#nitro:disabled{opacity:.32;filter:grayscale(.5)}
#nitro.on i{ filter:brightness(1.5); box-shadow:inset 0 3px 0 rgba(255,255,255,.6),
  0 0 22px rgba(95,240,216,.7), 0 4px 12px -3px #000 }

/* Left-handed moves the CLUSTER, it does not mirror the pedals. Accelerator is
   the right pedal and brake is the left pedal in every car ever built, so
   swapping them for a left-handed player is exactly wrong. Only the bottle,
   the horn and the box position move. */
body.pedals-left #pedals{ right:auto; left:calc(env(safe-area-inset-left,0px) + 10px) }
body.pedals-left #nitro{ right:auto; left:0 }

/* no touch, no pedals — a desktop showing them looks broken */
/* Desktop has a keyboard, so the thumb controls are dead weight and look
   broken. The GAUGES stay — they are instruments, not controls — and the
   dials drop to the bottom of the cluster since there is nothing beneath
   them any more. */
/* Hide the CONTROLS, not the container. `#pedals` is the bottle's parent, so
   hiding the box took the gauge with it and it measured zero on desktop. */
body.no-touch #gas,
body.no-touch #brake,
body.no-touch #horn,
body.no-touch #shifter{ display:none }
body.no-touch #pedals{ pointer-events:none }
/* The bottle is a GAUGE as much as a button — it is the nitrous level — so it
   stays on desktop, just not as something you press. */
body.no-touch #nitro{
  display:block;pointer-events:none;
  right:calc(env(safe-area-inset-right,0px) + 8px);
  bottom:calc(env(safe-area-inset-bottom,0px) + 86px * var(--ark-ui,1));
  left:auto;
}

body.no-touch #dials,
body.no-touch.manual /* ---- the wheel ----------------------------------------------------------
   Bottom-left, opposite the pedals. It ROTATES with the car and it FOLLOWS the
   thumb: press anywhere in its quadrant and the wheel re-centres under your
   finger, so you never have to find it. Steering is by how far you drag from
   where you first pressed, which means the grab point is wherever you happen
   to land rather than a fixed hit target.
   -------------------------------------------------------------------------- */
#wheel{
  position:absolute;z-index:12;
  left:calc(env(safe-area-inset-left,0px) + 10px);
  bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
  width:115px;height:115px;
  touch-action:none;
  transition:left .10s ease-out, bottom .10s ease-out;
}
body.no-touch #wheel{ display:none }

#dials{
  bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
}

/* ---- the shifter ---------------------------------------------------------
   A six-speed H-gate: two rails with three positions each, and reverse below.
   The knob is dragged between them. It sits above the pedals so the same
   thumb can reach it without leaving the wheel hand.
   -------------------------------------------------------------------------- */
/* ---- the instrument binnacle -------------------------------------------
   Two round dials side by side: revs on the left, road speed on the right,
   the way they sit in a car. The linear bar and the separate MPH text were
   two different idioms doing the same job in two different places.
   -------------------------------------------------------------------------- */
/* The cluster stacks bottom-up: pedals, bottle, then the shifter ONLY when the
   manual box is on, then the dials. The dials used to sit at a fixed height and
   the shifter was drawn over them; each now takes its place in the stack and
   the dials drop back down when there is no shifter to clear. */
/* ---- the wheel ----------------------------------------------------------
   Bottom-left, opposite the pedals. It ROTATES with the car and it FOLLOWS the
   thumb: press anywhere in its quadrant and the wheel re-centres under your
   finger, so you never have to find it. Steering is by how far you drag from
   where you first pressed, which means the grab point is wherever you happen
   to land rather than a fixed hit target.
   -------------------------------------------------------------------------- */
#wheel{
  position:absolute;z-index:12;
  left:calc(env(safe-area-inset-left,0px) + 10px);
  bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
  width:115px;height:115px;
  touch-action:none;
  transition:left .10s ease-out, bottom .10s ease-out;
}
body.no-touch #wheel{ display:none }

#dials{
  position:absolute;z-index:13;pointer-events:none;
  transform-origin:100% 100%;
  transform:scale(var(--ark-ui,1));
  right:calc(env(safe-area-inset-right,0px) + 8px);
  /* THE OFFSETS HAVE TO LIVE IN THE SAME SCALED SPACE. The bottle sits inside
     #pedals and is scaled by --ark-ui, so ITS distance off the bottom grows
     with the scale — while these were fixed pixels. At any scale above 1 the
     bottle rose into the dials and they covered a third of it. Multiplying the
     offsets by the same variable keeps the stack together at every size. */
  bottom:calc(env(safe-area-inset-bottom,0px) + 152px * var(--ark-ui,1));
  width:115px;height:59px;
  transition:bottom .18s ease-out;
}
body.manual /* ---- the wheel ----------------------------------------------------------
   Bottom-left, opposite the pedals. It ROTATES with the car and it FOLLOWS the
   thumb: press anywhere in its quadrant and the wheel re-centres under your
   finger, so you never have to find it. Steering is by how far you drag from
   where you first pressed, which means the grab point is wherever you happen
   to land rather than a fixed hit target.
   -------------------------------------------------------------------------- */
#wheel{
  position:absolute;z-index:12;
  left:calc(env(safe-area-inset-left,0px) + 10px);
  bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
  width:115px;height:115px;
  touch-action:none;
  transition:left .10s ease-out, bottom .10s ease-out;
}
body.no-touch #wheel{ display:none }

#dials{
  bottom:calc(env(safe-area-inset-bottom,0px) + 262px * var(--ark-ui,1));
}
#dials canvas{width:115px;height:59px;display:block}
body.pedals-left /* ---- the wheel ----------------------------------------------------------
   Bottom-left, opposite the pedals. It ROTATES with the car and it FOLLOWS the
   thumb: press anywhere in its quadrant and the wheel re-centres under your
   finger, so you never have to find it. Steering is by how far you drag from
   where you first pressed, which means the grab point is wherever you happen
   to land rather than a fixed hit target.
   -------------------------------------------------------------------------- */
#wheel{
  position:absolute;z-index:12;
  left:calc(env(safe-area-inset-left,0px) + 10px);
  bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
  width:115px;height:115px;
  touch-action:none;
  transition:left .10s ease-out, bottom .10s ease-out;
}
body.no-touch #wheel{ display:none }

/* This lost its `body.pedals-left` prefix in an earlier edit, so the LEFT-HANDED
   rule applied to everyone and the dials sat on the left for every player. */
body.pedals-left #dials{ right:auto; left:calc(env(safe-area-inset-left,0px) + 8px) }
/* and the wheel swaps to the other corner with them */
body.pedals-left #wheel{ left:auto; right:calc(env(safe-area-inset-right,0px) + 10px) }
#tachoOLD{
  position:absolute;z-index:13;display:none;
  border-radius:5px;background:#0d0f13;border:1px solid #333941;
  box-shadow:inset 0 2px 4px rgba(0,0,0,.8);
  overflow:hidden;
}
#tacho i{
  position:absolute;left:2px;top:2px;bottom:2px;width:2px;border-radius:2px;
  background:#5ff0d8;
  box-shadow:0 0 7px rgba(95,240,216,.85);
  transform:translateX(var(--rev,0px));
  transition:transform .05s linear;
}
/* the last fifth is the red zone, painted on the plate itself */
#tacho::after{
  content:"";position:absolute;right:2px;top:2px;bottom:2px;width:18%;
  background:repeating-linear-gradient(115deg,
    rgba(255,60,80,.30) 0 3px, rgba(255,60,80,.10) 3px 6px);
  border-left:1px solid rgba(255,60,80,.5);
}
#tacho b{
  position:absolute;left:5px;top:50%;transform:translateY(-50%);
  font-family:var(--disp);font-size:9px;font-weight:800;color:#5c6570;
  letter-spacing:.06em;
}
#tacho.red i{ background:#ff3b5c; box-shadow:0 0 9px rgba(255,59,92,.9) }
#tacho.red b{ color:#ff8fa0 }

#shifter{
  position:absolute;z-index:13;pointer-events:auto;
  transform-origin:100% 100%;
  transform:scale(var(--ark-ui,1));
  right:calc(env(safe-area-inset-right,0px) + 10px);
  bottom:calc(env(safe-area-inset-bottom,0px) + 152px * var(--ark-ui,1));
  width:86px;height:94px;touch-action:none;
}
#shifter[hidden]{ display:none }
#gate{
  position:absolute;inset:0;border-radius:9px;
  background:linear-gradient(to bottom,#1a1d22,#0d0f13);
  border:1px solid #333941;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.08), 0 6px 16px -6px #000;
}
/* the H itself, cut into the plate */
#gate::before, #gate::after{
  content:"";position:absolute;background:#05070a;border-radius:7px;
  box-shadow:inset 0 2px 3px rgba(0,0,0,.9);
}
#gate::before{ left:13px;right:13px;top:38px;height:10px }          /* the cross rail */
/* three rails, six slots */
#gate::after{ left:13px;width:10px;top:11px;bottom:11px;
  box-shadow:inset 0 2px 3px rgba(0,0,0,.9),
             23px 0 0 #05070a,
             46px 0 0 #05070a }
#knob{
  position:absolute;width:28px;height:28px;border-radius:50%;
  left:8px;top:4px;
  background:radial-gradient(circle at 36% 30%, #f4f6fa 0%, #c3ccd8 30%, #79818d 68%, #363b43 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.55), inset 0 -6px 9px rgba(0,0,0,.55),
             0 5px 12px -3px #000;
  border:1px solid #5a626d;
  display:grid;place-items:center;

}
#knob.grab{ transition:none; cursor:grabbing; filter:brightness(1.2) }

  position:absolute;font-family:var(--disp);font-size:9px;font-weight:800;

}
body.pedals-left #shifter{ right:auto; left:calc(env(safe-area-inset-left,0px) + 10px) }
body.pedals-left #tacho{ right:auto; left:calc(env(safe-area-inset-left,0px) + 10px) }
#nitro.hot{background:rgba(95,240,216,.3);color:#eafffb;box-shadow:0 0 26px rgba(95,240,216,.45)}
#nitro:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}

/* ------------ overlay ------------ */
/* Nothing in an overlay may reach past it. The title is set in a display
   face that may or may not have loaded — a fallback with wider metrics used
   to push the word off the side of the screen, and it is invisible on any
   machine where the real font is available. Cap everything and let long words

  background:radial-gradient(110% 70% at 50% 62%,rgba(20,8,24,.72),rgba(8,5,15,.96));
  text-align:center}

  letter-spacing:-.01em;margin-bottom:14px}

<body>
<div id="stage"><div id="frame">
  <canvas id="cv"></canvas>

  <div id="hud">
    <div>
      <div class="toprow">
        <!-- DISTANCE moved into the speedometer as a mechanical odometer. In
             RACE it comes back, because how far is left is the whole point. -->
        <div class="stat" id="distWrap" hidden><span>TO GO</span><b id="dist">0.0<i>MI</i></b></div>
        <div class="stat c" id="placeWrap" hidden><span>PLACE</span><b id="place">12/12</b></div>
        <div class="stat r"><span>SCORE</span><b id="score">0</b></div>
      </div>
      <div id="pursuit">PURSUIT</div>
    </div>
    <div class="botrow">
      <!-- speed now lives on the dial, where a car keeps it -->
      <div class="bars">
        <!-- The two bars lived down here under the pedals, where the controls
             covered them. Damage is smoke off the bonnet now and nitrous is the
             fill in the bottle, so both read where you are already looking. -->
      </div>
    </div>
  </div>

  <div id="warn"></div>
  <canvas id="wheel" width="230" height="230" aria-label="Steering"></canvas>
  <div id="pedals">
    <button id="nitro" disabled aria-label="Nitrous"><i></i><b>NOS</b></button>
    <button id="gas" aria-label="Accelerator"><i></i></button>
    <button id="brake" aria-label="Brake"><i></i></button>
    <button id="horn" aria-label="Horn"><i></i></button>
  </div>
  <div id="dials">
    <canvas id="gauges" width="230" height="118"></canvas>
  </div>
  <div id="shifter" hidden>
    <div id="gate"></div>
    <div id="knob" data-gear="1"><b>1</b></div>
  </div>
  <div id="veil"><div class="vw" id="veilBody"></div></div>
</div></div>

<script>
(function(){
"use strict";

/* =====================================================================
   SODIUM — a straight highway, a fast car, and a police force with
   an opinion about it. Pseudo-3D projection over a flat road.
   ===================================================================== */

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const frame = document.getElementById('frame');
const veil = document.getElementById('veil');
const veilBody = document.getElementById('veilBody');
const warnEl = document.getElementById('warn');
const nitroBtn = document.getElementById('nitro');
const brakeBtn = document.getElementById('brake');
const gasBtn   = document.getElementById('gas');
const hornBtn  = document.getElementById('horn');
let braking = false, gas = false;

/* ---------- road constants ---------- */
const SEG = 200;             // segment length
const RUMBLE = 3;            // segments per stripe
const ROAD = 1900;           // half-width of road
const LANES = 4;
const DRAW = 95;             // segments drawn
const CAM_H = 1050;
const FOV = 100;
const CAM_D = 1/Math.tan((FOV/2)*Math.PI/180);
const PLAYER_Z = CAM_H*CAM_D;
const LANE_X = [-0.75,-0.25,0.25,0.75];

const MAX_SPD = 15333;   /* 200 mph at the top of fourth */
/* NOS no longer raises the ceiling. With a real gearbox the limiter is the
   limiter — a bottle of nitrous cannot make fourth gear turn faster than it
   turns. What it does is get you THROUGH the gears, so it is pure acceleration
   now, and the top speed is the same with it or without. */
const NOS_SPD = MAX_SPD;
const OFF_SPD = 4200;

let W=360, H=640, dpr=1, horizon=0;
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- state ---------- */
let state='title';
let pos, playerX, camX, targetX, spd, dmg, nos, nosOn, nosTime;
let dist, score, combo, comboTime, heat, heatT;
let traffic, cops, blocks, crates, fx, shake, hitFlash, sirenPhase, lastKmh, iframe;
let bestScore=0, bestDist=0, runs=0;
const SV = AR && AR.save ? AR.save.get('highway') : null;
if(SV){ bestScore = SV.best || 0; bestDist = SV.bestMi || SV.bestKm || 0; }
let acc, last;

const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
const rint=(a,b)=>a+((Math.random()*(b-a+1))|0);

/* =====================================================================
   SOUND — an engine you can hear working, and sirens that get closer
   ===================================================================== */
var AR = window.Arcade;
var BASS = [55, 55, 65.41, 55, 73.42, 55, 82.41, 73.42];      // A C D E
var LEAD = [440, 523.25, 659.25, 523.25, 587.33, 493.88, 440, 392];

var snd = {
  eng:null, wind:null, siren:null, sirenPhase:0,

  armed:false,
  arm: function(){
    if (snd.armed || !AR.audio.onReset) return;
    snd.armed = true;
    AR.audio.onReset(function(){ snd.eng = null; snd.thrust = null;
      snd.sqA = snd.sqB = snd.sqC = snd.screechLow = null; snd.begin(); });
  },
  begin: function(){
    if (!AR) return;
    AR.audio.init();
    if (!AR.audio.ctx) return;  // no engine yet; a real gesture will call us back
    snd.arm();
    if (!snd.eng){
      snd.eng   = AR.sfx.hold({ freq:70, type:'sawtooth', cutoff:520, q:3.2 });
      snd.eng2  = AR.sfx.hold({ freq:70, type:'square',  cutoff:400, q:2, detune:14 });
      snd.wind  = AR.sfx.holdNoise({ freq:900, q:0.5 });
      snd.siren = AR.sfx.hold({ freq:700, type:'sine', cutoff:2600, q:1 });
      /* NOS: a wide bandpassed hiss, opened up while the bottle is live */
      snd.thrust = AR.sfx.holdNoise({ freq:1800, q:0.35 });
      /* A real car horn is TWO notes a third apart played together, with a
         buzzy edge — a single sine reads as a doorbell. */
      snd.horn1 = AR.sfx.hold ? AR.sfx.hold({ freq:440, type:'sawtooth', gain:0, cutoff:1500 }) : null;
      snd.horn2 = AR.sfx.hold ? AR.sfx.hold({ freq:554.4, type:'sawtooth', gain:0, cutoff:1700 }) : null;
      /* Brakes: a tight, high band that only sings while the tyres are losing
         speed. Held at a fixed pitch it would drone; it tracks the rate of
         deceleration instead, so it screeches on the stop and dies as you
         settle. */
      /* ---- what a tyre actually does -----------------------------------
         A squealing tyre is not noise. The contact patch grips, stretches,
         releases and grips again hundreds of times a second — STICK-SLIP —
         and that is a periodic oscillation, so it has a pitch and a stack of
         harmonics. Filtering noise can only ever give you a hiss, however
         many bands you use, because there is no periodicity in it to hear.

         So the squeal is now TONAL: a sawtooth fundamental around 700Hz with
         two harmonic partials above it, each detuned slightly so they beat
         against one another, run through a sharp resonant filter. Noise stays,
         but only as the scrub underneath — the roar of rubber abrading —
         rather than as the sound itself.
         ------------------------------------------------------------------- */
      snd.sqA = AR.sfx.hold({ freq:700,  type:'sawtooth', cutoff:2400, q:9 });
      snd.sqB = AR.sfx.hold({ freq:1057, type:'square',   cutoff:3000, q:7, detune:12 });
      snd.sqC = AR.sfx.hold({ freq:1412, type:'sawtooth', cutoff:3600, q:6, detune:-16 });
      snd.screechLow = AR.sfx.holdNoise({ freq:320, q:0.7 });   /* the scrub */
    }
    AR.music.start(152, 4, snd.bed);
  },

  shift: function(g){
    if(!AR) return;
    const t = AR.audio.now();
    const into = (g === undefined) ? gear : g;
    if(into < 1 || into > 4){
      /* NEUTRAL: the lever falls into the middle of the gate with nothing to
         engage, so it is softer, hollower and has no engagement thud. */
      AR.sfx.noise({ t, freq:900, to:420, dur:0.045, gain:0.048, filter:'bandpass' });
      AR.sfx.tone({ t:t+0.012, freq:150, to:112, dur:0.075, type:'triangle',
                    gain:0.042, cutoff:700 });
      return;
    }
    /* Into gear: three layers — the rod knocking through the gate, the collar
       engaging, and a short metallic ring off the linkage. */
    AR.sfx.noise({ t, freq:2100, to:700, dur:0.035, gain:0.070, filter:'bandpass' });
    AR.sfx.noise({ t:t+0.018, freq:420, to:140, dur:0.075, gain:0.090, filter:'lowpass' });
    AR.sfx.tone({ t:t+0.020, freq:196, to:124, dur:0.085, type:'square',
                  gain:0.062, cutoff:1100 });
    AR.sfx.tone({ t:t+0.026, freq:1560, to:1180, dur:0.055, type:'sine',
                  gain:0.030, verb:0.25 });
  },

  warnCop: function(){
    if(!AR) return;
    /* the loud-hailer: a short two-tone bark, unpleasant on purpose */
    AR.sfx.tone({ freq:660, to:520, dur:0.16, type:'square', gain:0.075, cutoff:1800 });
    AR.sfx.noise({ freq:1400, dur:0.10, gain:0.03, filter:'bandpass' });
  },

  honk: function(on){
    if(!AR) return;
    if(snd.horn1 && snd.horn1.set){
      /* set() is (freq, level, CUTOFF, glide) — passing the glide third was
         setting the filter to 0.012Hz, which silenced the horn completely. */
      snd.horn1.set(440,   on ? 0.085 : 0, 1500, on ? 0.008 : 0.04);
      if(snd.horn2) snd.horn2.set(554.4, on ? 0.070 : 0, 1700, on ? 0.008 : 0.04);
    } else if(on){
      /* no holdable voice: a short blast instead, still two notes */
      AR.sfx.tone({ freq:440,   dur:0.22, type:'sawtooth', gain:0.075, cutoff:1500 });
      AR.sfx.tone({ freq:554.4, dur:0.22, type:'sawtooth', gain:0.060, cutoff:1700 });
    }
  },

  /* ---- other cars' engines ------------------------------------------------
     A small pool of voices, handed to whichever vehicles are nearest. Each is
     PLACED in stereo by how far off your line it sits and pitched by its own
     revs, so a car you overtake sweeps across the ears and falls away behind
     you — the Doppler-ish parallax you get from the real thing without any
     Doppler maths.
     ------------------------------------------------------------------------- */
  voices: [],
  traffic: function(list){
    if(!AR || !AR.audio.ctx) return;
    if(!snd.voices.length){
      /* Four was a guess I never checked. Measured, 9 to 15 vehicles sit
         inside the 36,000 falloff on a busy road, so four voices meant most of
         the traffic was silently dropped and the road sounded emptier than it
         looked. Sixteen covers the worst case seen; each is one oscillator,
         one filter, one gain and one panner, which is nothing next to the
         per-frame canvas work. Voices past the audible set are held at zero
         gain rather than torn down, so nothing clicks as cars come and go. */
      for(var i=0;i<16;i++){
        snd.voices.push({
          a: AR.sfx.hold({ freq:90, type:'sawtooth', cutoff:600, q:2.4, pan:0 }),
          busy: null
        });
      }
    }
    var near = list.slice().sort(function(p,q){
      return Math.abs(p.z - pos) - Math.abs(q.z - pos);
    }).slice(0, snd.voices.length);

    /* ---- keep the traffic in its place ---------------------------------
       Web Audio has no fixed voice budget, so sixteen engines cost nothing
       and the master measured 0.35-0.41 either way — but the COMBINED level
       of the traffic still climbs with the count, and a crowded road should
       not drown out your own car, the sirens or the music.

       So the whole traffic bed is normalised: work out what it wants to be,
       and if that exceeds the ceiling, scale every voice down together. Ten
       cars nearby are then ten cars you can pick out individually, not ten
       cars that are each as loud as one car would have been.
       -------------------------------------------------------------------- */
    var want = 0, i2, cc, dd;
    for(i2=0;i2<near.length;i2++){
      cc = near[i2];
      dd = Math.abs(cc.z - pos);
      want += Math.pow(Math.max(0, 1 - dd/36000), 2);
    }
    var TRAFFIC_CEIL = 3.4;          /* in units of one voice at full level */
    snd.tScale = want > TRAFFIC_CEIL ? TRAFFIC_CEIL / want : 1;

    for(var v=0; v<snd.voices.length; v++){
      var vo = snd.voices[v], c = near[v];
      if(!vo.a) continue;
      if(!c){ vo.a.set(90, 0, 400, 0.12); continue; }
      var d = c.z - pos;
      var dist = Math.abs(d);
      /* fades out by about a hundred metres either way */
      /* THE SCALE WAS WRONG BY AN ORDER OF MAGNITUDE. I assumed a car in the
         middle distance sat a couple of thousand units away; measured, the
         nearest vehicle on a busy road is 20,000 to 35,000 out, because the
         road's z axis is far coarser than the lateral one. A 4,200 falloff
         could never reach anything, which is why every voice read silent no
         matter how much level I threw at it.

         36,000 is roughly the visible road, so a car appearing at the horizon
         fades in and is loudest as it draws alongside. */
      var fall = Math.max(0, 1 - dist / 36000);
      if(fall <= 0.01){ vo.a.set(90, 0, 400, 0.12); continue; }
      /* its own revs: speed against ITS top, through the same gearing */
      var rr = Math.min(1, (c.spd || c.cruise || 0) / AI_TOP);
      var hz = 54 + rr*rr*250 + rr*95;
      /* PLACEMENT: lateral offset, exaggerated as it gets close, because a
         car alongside is hard left or hard right and one far ahead is centred */
      var lateral = ((c.x || 0) - playerX);
      /* same correction: "close" is thousands of units, not hundreds */
      var closeness = 1 - Math.min(1, dist / 14000);
      vo.a.place(clamp(lateral * (0.9 + closeness*1.9), -1, 1), 0.07);
      vo.a.set(hz, 0.058 * fall * fall * snd.tScale, 300 + rr*900, 0.07);
    }
  },

  bed: function(step, t){
    if (!AR) return;
    var s = step % 16, bar = Math.floor(step/16) % 8;

    /* --- riff: E5 E5 G5 D5 over eight bars, with a turnaround --- */
    var ROOTS = [41.20, 41.20, 48.99, 36.71, 41.20, 41.20, 32.70, 36.71];
    var root = ROOTS[bar];

    /* --- double kick: straight eighths, doubled up on the last bar --- */
    if (s % 2 === 0 || (bar === 7 && s % 1 === 0))
      AR.sfx.drum('kick', t, s % 4 === 0 ? 0.86 : 0.60);

    /* --- backbeat, hard --- */
    if (s === 4 || s === 12){
      AR.sfx.drum('snare', t, 0.62);
      AR.sfx.noise({ t:t, freq:2200, dur:0.10, gain:0.10, filter:'bandpass', q:1.2, bus:'music' });
    }
    /* --- sixteenth hats, opening on the offbeat --- */
    AR.sfx.drum('hat', t, s % 2 ? 0.20 : 0.32);
    if (s === 14) AR.sfx.drum('open', t, 0.30);
    if (bar === 7 && (s === 8 || s === 10 || s === 12 || s === 14))
      AR.sfx.drum('tom', t, 0.42);

    /* --- palm-muted sixteenths on the root: the engine of the whole thing --- */
    var gallop = (s % 4 === 0) ? 1 : (s % 2 === 0 ? 0.82 : 0.6);
    AR.sfx.tone({ t:t, freq:root, dur:0.075, type:'square', gain:0.235*gallop,
                  bus:'music', cutoff:420 + gallop*260, q:6 });
    AR.sfx.tone({ t:t, freq:root*0.5, dur:0.09, type:'square', gain:0.125*gallop,
                  bus:'music', cutoff:260, q:3 });

    /* --- power chords: root and fifth, three detuned saws for the grind --- */
    if (s === 0 || s === 3 || s === 6 || s === 11){
      var stab = s === 0 ? 0.20 : 0.145;
      [1, 1.4983, 2].forEach(function(mul, i){
        AR.sfx.tone({ t:t, freq:root*2*mul, dur:0.20, type:'sawtooth',
                      gain:stab*(i===2?0.6:1), bus:'music', cutoff:1500, q:5 });
        AR.sfx.tone({ t:t+0.004, freq:root*2*mul*1.008, dur:0.19, type:'sawtooth',
                      gain:stab*0.55*(i===2?0.6:1), bus:'music', cutoff:1400, q:5 });
      });
    }

    /* --- lead: E minor pentatonic, shredding over the back half --- */
    var PENT = [329.63, 392.00, 440.00, 493.88, 587.33, 659.25];
    if (bar >= 4){
      var run = [0,2,3,5,4,3,2,0,3,5,4,2,5,4,3,2];
      if (s % 2 === 0 || bar >= 6){
        var lf = PENT[run[s] % PENT.length] * (bar >= 6 && s % 8 > 4 ? 2 : 1);
        AR.sfx.tone({ t:t, freq:lf, dur:0.14, type:'sawtooth', gain:0.105,
                      bus:'music', cutoff:3400, q:4, verb:0.22 });
        AR.sfx.tone({ t:t+0.006, freq:lf*1.006, dur:0.13, type:'square', gain:0.055,
                      bus:'music', cutoff:3000 });
      }
    }

    /* --- a held fifth underneath, so the bottom never drops out --- */
    if (s === 0)
      AR.sfx.tone({ t:t, freq:root*1.4983, dur:0.95, type:'sawtooth', gain:0.055,
                    bus:'music', cutoff:900, attack:0.02, verb:0.3 });
  },

  /* driven every frame from the game loop */
  drive: function(spd, top, off, nos, copNear, decel){
    if (!snd.eng) return;
    var r = spd / top;
    /* The note ran 62Hz to 230Hz — under two octaves for the whole rev range,
       so the top of a gear barely sounded different from the middle and an
       upshift was almost inaudible. It now spans 58Hz to 470Hz, better than
       three octaves, so the climb to the limiter is something you can hear
       coming and the drop on a shift is unmistakable. */
    var rpm = 58 + r * r * 300 + r * 112 + (nos ? 34 : 0);
    snd.eng.set(rpm, 0.050 + r*0.042, 380 + r*2400, 0.05);
    snd.eng2.set(rpm*0.5, 0.024 + r*0.021, 280 + r*1400, 0.05);
    snd.wind.set(600 + r*2100, (off ? 0.045 : 0.009) + r*0.016, 0.10);

    /* thruster: present the whole time the bottle is open, and it swells a
       little with speed so it sits on top of the engine rather than under it */
    if (snd.thrust){
      if (nos) snd.thrust.set(1500 + r*1900, 0.055 + r*0.030, 0.05);
      else     snd.thrust.set(1500, 0, 0.22);
    }

    /* screech: only while genuinely shedding speed. `decel` is 0-1, how hard
       the car is slowing right now, so once it settles at the brake floor the
       sound stops even though the pedal is still down. */
    if (snd.sqA){
      var sq = Math.max(0, Math.min(1, decel || 0));
      /* the slip rate is never steady, so the pitch shivers */
      snd.scrPhase = (snd.scrPhase || 0) + 0.94;
      var wob = 1 + Math.sin(snd.scrPhase) * 0.115;
      /* silent at a crawl: tyres do not sing at 46mph */
      if (sq > 0.14 && r > 46/200){
        /* The fundamental climbs with speed; the partials track it so the
           whole stack moves as one voice rather than three sounds. */
        var f0 = (620 + r*420) * wob;
        /* about a third of the level it was: it reads as a squeal without
           dominating the mix every time you touch the brakes */
        snd.sqA.set(f0,      0.018 + sq*0.052, f0*3.4, 0.018);
        if (snd.sqB) snd.sqB.set(f0*1.51, 0.010 + sq*0.030, f0*4.2, 0.018);
        if (snd.sqC) snd.sqC.set(f0*2.02, 0.006 + sq*0.018, f0*5.0, 0.018);
        if (snd.screechLow)
          snd.screechLow.set(260 + r*180, 0.018 + sq*0.042, 0.030);
      } else {
        snd.sqA.set(620, 0, 2000, 0.05);
        if (snd.sqB) snd.sqB.set(940, 0, 2600, 0.05);
        if (snd.sqC) snd.sqC.set(1260, 0, 3200, 0.05);
        if (snd.screechLow) snd.screechLow.set(280, 0, 0.08);
      }
    }

    if (copNear > 0){
      snd.sirenPhase += 0.055;
      var two = Math.sin(snd.sirenPhase) > 0 ? 760 : 560;
      snd.siren.set(two, 0.048 * copNear, 2600, 0.02);
    } else {
      snd.siren.set(undefined, 0, undefined, 0.15);
    }
  },
  quiet: function(){
    if (!snd.eng) return;
    snd.eng.set(60, 0.01, 300, 0.4);
    snd.eng2.set(30, 0, 260, 0.4);
    snd.wind.set(400, 0, 0.4);

/* ---------- sizing ---------- */
function resize(){
  const r = cv.getBoundingClientRect();
  if(!r.width||!r.height) return;
  dpr = Math.min(2, window.devicePixelRatio||1);
  W = r.width; H = r.height;
  cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  horizon = Math.round(H*0.40);
  skyline = null;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', ()=>setTimeout(resize,150));

/* ---------- projection ---------- */
/* ---- where the road sits on the glass ------------------------------------
   With touch controls the right-hand third of the screen is pedals, dials and
   the bottle, so a centred road puts the car under the furniture. Shifting the
   whole view LEFT centres it in the space actually left over. On desktop the
   controls are gone, so it re-centres.
   -------------------------------------------------------------------------- */
let viewShift = 0;
function updateViewShift(){
  const noTouch = document.body.classList.contains('no-touch');
  viewShift = noTouch ? 0 : -W * 0.085;
}
function proj(worldX, worldZ){
  const dz = worldZ - pos;
  const scale = CAM_D/dz;
  return {
    ok: dz > 30,
    scale,
    x: W/2 + viewShift + scale*(worldX - camX*ROAD)*W/2,
    y: horizon + scale*CAM_H*H/2,
    w: scale*ROAD*W/2
  };
}

/* ---------- sprites ---------- */
function rr(g,x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  g.beginPath();
  g.moveTo(x+r,y); g.lineTo(x+w-r,y); g.quadraticCurveTo(x+w,y,x+w,y+r);
  g.lineTo(x+w,y+h-r); g.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  g.lineTo(x+r,y+h); g.quadraticCurveTo(x,y+h,x,y+h-r);
  g.lineTo(x,y+r); g.quadraticCurveTo(x,y,x+r,y); g.closePath();
}
function sprite(w,h,paint){
  const c = document.createElement('canvas');
  c.width=w; c.height=h;
  paint(c.getContext('2d'), w, h);
  return c;
}

// generic rear-of-car painter
function paintCar(o){
  return (g,w,h)=>{
    const cy = h;
    // ground shadow
    g.fillStyle='rgba(0,0,0,.5)';
    g.beginPath(); g.ellipse(w/2, cy-6, w*0.47, h*0.055, 0, 0, 6.2832); g.fill();
    // wheels
    g.fillStyle='#0d0e12';
    rr(g, w*0.015, cy-h*0.30, w*0.13, h*0.27, 3); g.fill();
    rr(g, w-w*0.145, cy-h*0.30, w*0.13, h*0.27, 3); g.fill();
    // lower body
    const bg = g.createLinearGradient(0, h*o.bodyTop, 0, cy);
    bg.addColorStop(0, o.hi); bg.addColorStop(0.5, o.body); bg.addColorStop(1, o.lo);
    g.fillStyle = bg;
    rr(g, w*0.055, h*o.bodyTop, w*0.89, cy - h*o.bodyTop - h*0.035, w*0.06); g.fill();
    // cabin
    if(o.cabin){
      const cg = g.createLinearGradient(0, h*o.cabinTop, 0, h*o.bodyTop+4);
      cg.addColorStop(0, o.lo); cg.addColorStop(1, o.body);
      g.fillStyle=cg;
      rr(g, w*0.17, h*o.cabinTop, w*0.66, h*(o.bodyTop-o.cabinTop)+h*0.06, w*0.05); g.fill();
      // rear glass
      const gg = g.createLinearGradient(0, h*o.cabinTop, 0, h*o.bodyTop);
      gg.addColorStop(0,'#4a5a6e'); gg.addColorStop(0.35,'#141a24'); gg.addColorStop(1,'#0b0e14');
      g.fillStyle=gg;
      rr(g, w*0.215, h*o.cabinTop+h*0.035, w*0.57, h*(o.bodyTop-o.cabinTop)-h*0.02, w*0.035); g.fill();
    }
    if(o.spoiler){
      g.fillStyle=o.lo;
      rr(g, w*0.09, h*o.bodyTop-h*0.10, w*0.82, h*0.055, 3); g.fill();
      g.fillStyle=o.body;
      g.fillRect(w*0.20, h*o.bodyTop-h*0.06, w*0.05, h*0.07);
      g.fillRect(w*0.75, h*o.bodyTop-h*0.06, w*0.05, h*0.07);
    }
    // tail lights
    const ty = cy - h*0.34, th = h*0.11;
    for(const side of [0,1]){
      const tx = side ? w*0.60 : w*0.135;
      const lg = g.createLinearGradient(0,ty,0,ty+th);
      lg.addColorStop(0, o.lamp2||'#ff6a5a'); lg.addColorStop(1, o.lamp||'#c8102e');
      g.fillStyle=lg;
      rr(g, tx, ty, w*0.265, th, 3); g.fill();
      g.globalAlpha=.5; g.fillStyle=o.lamp2||'#ff8a7a';
      rr(g, tx+w*0.02, ty+th*0.18, w*0.225, th*0.32, 2); g.fill();
      g.globalAlpha=1;
    }
    // bumper + plate
    g.fillStyle='rgba(0,0,0,.42)';
    rr(g, w*0.055, cy-h*0.155, w*0.89, h*0.12, w*0.04); g.fill();
    g.fillStyle='rgba(240,235,220,.8)';
    g.fillRect(w*0.42, cy-h*0.125, w*0.16, h*0.055);
    // police livery + light bar
    if(o.police){
      g.fillStyle='#0c0f16';
      g.fillRect(w*0.055, h*o.bodyTop+h*0.02, w*0.89, h*0.10);
      g.fillStyle='#0c0f16';
      rr(g, w*0.30, h*o.cabinTop-h*0.075, w*0.40, h*0.075, 2); g.fill();
    }
  };
}

/* ---------- skyline ---------- */
let skyline = null;
/* Two layers: the buildings, and the windows on their own sheet. The windows
   are drawn over the top with an alpha that follows the clock, so the city
   lights up at dusk and goes dark by mid-morning — which is the whole reason
   to have a cycle rather than a fade. */
let skylineLit = null;
function buildSkyline(){
  const w = 1024, h = 220;
  const plan = [];
  let x = 0;
  while(x < w){
    const bw = rint(18,54), bh = rint(30,180);
    const wins = [];
    for(let k=0;k<bh/16;k++){
      if(Math.random() < 0.42)
        wins.push([x + rint(3, bw-6), h - bh + rint(4, bh-8)]);
    }
    plan.push({ x, bw, bh, wins });
    x += bw + rint(2,12);
  }
  skyline = sprite(w,h,(g)=>{
    g.clearRect(0,0,w,h);
    for(const b of plan){ g.fillStyle = '#150c22'; g.fillRect(b.x, h-b.bh, b.bw, b.bh); }
  });
  skylineLit = sprite(w,h,(g)=>{
    g.clearRect(0,0,w,h);
    for(const b of plan){
      for(const [wx,wy] of b.wins){
        g.fillStyle = Math.random() < 0.22 ? 'rgba(190,225,255,.95)' : 'rgba(255,190,110,.95)';
        g.fillRect(wx, wy, 2, 3);
      }
    }
  });
}

/* ---------- world spawning ---------- */
function laneFree(z, lane, gap){
  for(const c of traffic)
    if(c.lane===lane && Math.abs(c.z - z) < gap) return false;
  return true;
}

/* A wave never fills every lane, but cars run at different speeds, so given
   enough road a fast one drifts into the last free lane and the wall closes.
   This keeps a line open without deleting anything or slowing the road down:
   the car furthest from you in a blocked band eases off until it falls out of
   that band. You still have to find the gap; there is simply always one. */
function keepLaneOpen(dt, pz){
  const BAND = 1500;
  const bands = new Map();
  for(const c of traffic){
    if(c.z < pz - 2000 || c.z > pz + 26000) continue;   // only the road ahead
    const k = Math.round(c.z / BAND);
    if(!bands.has(k)) bands.set(k, []);
    bands.get(k).push(c);
  }
  for(const [, group] of bands){
    const lanes = new Set(group.map(c => c.lane));
    if(lanes.size < LANES) continue;                    // a way through already
    let worst = null, wd = -1;
    for(const c of group){
      const d = c.z - pz;
      if(d > wd){ wd = d; worst = c; }
    }
    if(worst){
      worst.cruise = Math.max(0.24 * MAX_SPD, worst.cruise - MAX_SPD * 0.55 * dt);
      worst.yielding = true;
    }
  }
}

/* Traffic overtaking from behind. Ahead-only spawning meant a slow or stopped
   car sat on an empty road: everything in front pulled away and nothing ever
   arrived. This drops a car back down the road doing a decent clip, so it
   catches you and goes past — which is what makes stopping feel exposed. */
function spawnBehind(){
  /* It was giving up after ONE blocked lane, and at a standstill the lane
     behind you is usually the one you are sitting in — so nothing ever
     arrived, which is exactly the case this exists for. Try every lane. */
  const order = [0,1,2,3].sort(()=>Math.random()-0.5);
  let lane = -1, z = 0;
  for(const L of order){
    const zz = pos - rnd(2600, 4200);
    if(laneFree(zz, L, 1500)){ lane = L; z = zz; break; }
  }
  if(lane < 0) return;
  const roll = Math.random();
  const t = roll<0.14 ? 'truck' : roll<0.44 ? 'coupe' : roll<0.72 ? 'sedan' : 'sedan2';
  traffic.push({
    z, lane, x: LANE_X[lane] + rnd(-0.03,0.03),
    /* it must actually be quicker than you or it will never arrive */
    spd: 0, cruise: Math.max(spd * 1.25, (t==='truck' ? 0.36 : 0.55) * MAX_SPD),
    type: t,
    w: t==='truck' ? 0.32 : t==='coupe' ? 0.26 : 0.275,
    len: t==='truck' ? 520 : 380,
    near:false, drift: rnd(-1,1)*0.0002, fromBehind:true
  });
}

function spawnWave(z){
  const n = rint(1, Math.min(3, LANES-1));
  const order = [0,1,2,3].sort(()=>Math.random()-0.5).slice(0,n);
  for(const lane of order){
    if(!laneFree(z, lane, 2200)) continue;
    // keep a roadblock's opening clear so it is always threadable
    let inGap = false;
    for(const b of blocks)
      if(Math.abs(LANE_X[lane] - b.gapX) < 0.34 && Math.abs(z - b.z) < 9000) inGap = true;
    if(inGap) continue;
    const roll = Math.random();
    const t = roll<0.16 ? 'truck' : roll<0.42 ? 'coupe' : roll<0.7 ? 'sedan' : 'sedan2';
    traffic.push({
      z: z + rnd(-600,600), lane,
      x: LANE_X[lane] + rnd(-0.03,0.03),
      spd: 0, cruise: (t==='truck' ? rnd(0.30,0.38) : rnd(0.42,0.60)) * MAX_SPD,
      type: t,
      w: t==='truck' ? 0.32 : t==='coupe' ? 0.26 : 0.275,
      len: t==='truck' ? 520 : 380,
      near: false, drift: rnd(-1,1)*0.0002
    });
    traffic[traffic.length-1].spd = traffic[traffic.length-1].cruise;
  }
}

function spawnCop(){
  const z = pos - rnd(3200,4200);
  let lane = rint(0,3), tries = 0;
  while(tries++ < 8 && !laneFree(z, lane, 1800)) lane = rint(0,3);
  cops.push({
    z, x: LANE_X[lane],
    spd: spd*0.95 + 1800,
    wreck:0, ang:0, grace:1.1, cool:0, side:1,
    w:0.27, len:400, phase: Math.random()*6.28
  });
}

function spawnRoadblock(){
  // Panels are tiled across the road with one deliberate opening. Spacing is
  // chosen so no two panels can be squeezed between, and the opening leaves
  // the car GAP_SLACK of room either side of dead centre.
  const SEG  = 0.34;                       // one barrier panel, world units
  const HIT  = (SEG + 0.26)/2;             // centre distance that blocks the car
  const SLACK = 0.15;                      // wiggle room inside the opening
  const gx = clamp(LANE_X[rint(0,3)], -0.58, 0.58);
  const b = { z: pos + 34000, gapX: gx, hit:false, parts:[] };

  for(let x = gx - (HIT + SLACK); x > -1.12; x -= SEG) b.parts.push({ x, w:SEG });
  for(let x = gx + (HIT + SLACK); x <  1.12; x += SEG) b.parts.push({ x, w:SEG });

  // a cruiser parked well clear of the opening, on the far shoulder
  b.parts.push({ x: gx > 0 ? -1.06 : 1.06, w:0, cop:true, off:0 });

  // nothing may be sitting in the opening when the player arrives
  for(let i=traffic.length-1;i>=0;i--){
    const c = traffic[i];
    if(Math.abs(c.x - gx) < 0.34 && c.z > b.z - 9000 && c.z < b.z + 2000) traffic.splice(i,1);
  }

  blocks.push(b);
  flashWarn('ROADBLOCK AHEAD');
}

// widest run of road the car's centre can occupy — used to prove passability
function blockClearance(b){
  let best = 0, run = 0;
  for(let x = -1.0; x <= 1.0; x += 0.01){
    let ok = true;
    for(const p of b.parts){
      if(p.cop) continue;
      if(Math.abs(p.x - x) < (p.w + 0.26)/2){ ok = false; break; }
    }
    if(ok){ run += 0.01; if(run > best) best = run; } else run = 0;
  }
  return best;
}

function flashWarn(t){
  if (t.indexOf('ROADBLOCK') === 0) snd.warn();
  warnEl.textContent = t;
  warnEl.classList.remove('on'); void warnEl.offsetWidth; warnEl.classList.add('on');
}

/* ---------- lifecycle ---------- */
function reset(){
  /* You start PARKED, in first, with the engine idling. A run that begins at
     60mph gives away the launch, and now that first gear pulls properly off
     the line the launch is worth having. */
  pos=0; playerX=0; camX=0; targetX=0; spd=0;
  gear=1; idleRev=IDLE; autoHold=0; autoDownT=0;
  if(typeof knobRail !== 'undefined'){ knobRail=0; knobY=TOP_Y; }
  dmg=0; nos=40; nosOn=false; nosTime=0; bustT=0;
  racers=[]; place=12; finished=false; hasMoved=false;
  if(mode === 'race') buildField();
  const pw = document.getElementById('placeWrap');
  if(pw) pw.hidden = (mode !== 'race');
  dist=0; score=0; combo=0; comboTime=0; heat=1; heatT=0;
  /* dayClock deliberately NOT reset: the sky keeps its own time across runs */
  traffic=[]; cops=[]; blocks=[]; crates=[]; fx=[];
  shake=0; hitFlash=0; sirenPhase=0; lastKmh=0; iframe=0;
  acc=0;

/* Brake. Not just a way to avoid a crash — it is how you drop back alongside a
   cruiser instead of blowing past it, which is what makes the PIT a decision
   rather than an accident. */
function setBrake(on){
  brakeBtn.classList.toggle('on', on);
  braking = on;
