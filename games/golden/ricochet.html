<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0e14">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ricochet</title>
<meta name="arcade-home" content="../../index.html#golden">
<meta name="arcade-title" content="Ricochet">
<meta name="arcade-accent" content="#00e5ff">
<script src="../../audio.js"></script>
<script src="../../arcade.js"></script>
<style>
@font-face{font-family:"Chivo Mono";font-style:normal;font-weight:100 900;font-display:swap;src:url("../../fonts/chivomono-var.woff2") format("woff2")}
@font-face{font-family:"Syne";font-style:normal;font-weight:400 800;font-display:swap;src:url("../../fonts/syne-var.woff2") format("woff2")}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0a0e14;
  font-family:"Chivo Mono",ui-monospace,monospace;color:#e6e9ef;
  user-select:none;-webkit-user-select:none}
#stage{position:fixed;inset:0;display:flex;flex-direction:column;
  padding-top:var(--safe-top,0px)}
#head{flex:none;display:flex;justify-content:space-between;align-items:baseline;
  padding:9px 14px 5px;font-size:9px;letter-spacing:.20em;color:#6a7284}
#head b{font-size:17px;color:#e6e9ef;font-weight:700;font-variant-numeric:tabular-nums;
  letter-spacing:.02em}
#wrap{flex:1;position:relative;display:grid;place-items:center;min-height:0;
  padding:0 8px calc(8px + var(--safe-bot,0px))}
#scope{display:block;touch-action:none;border-radius:2px;
  box-shadow:0 0 0 1px #1c2230, 0 18px 50px -20px #000}
#veil{position:fixed;inset:0;background:rgba(6,9,14,.94);display:grid;place-items:center;
  padding:26px;text-align:center;z-index:40}
#veil.hidden{display:none}
#veilBody{max-width:330px;width:100%}
.eyebrow{font-size:9px;letter-spacing:.26em;color:#00e5ff;margin-bottom:9px}
h1{font-family:"Syne",sans-serif;font-size:40px;font-weight:800;margin:0;
  letter-spacing:-.02em;line-height:1;color:#e6e9ef}
h1 em{display:block;font-family:"Chivo Mono",monospace;font-size:9.5px;font-style:normal;
  font-weight:400;letter-spacing:.24em;color:#6a7284;margin-top:9px}
.tmenu{display:flex;flex-direction:column;gap:8px;max-width:240px;margin:24px auto 0}
.btn{padding:14px 0;width:100%;border:0;border-radius:4px;cursor:pointer;font:inherit;
  font-size:11.5px;letter-spacing:.18em;background:#00e5ff;color:#02181d}
.btn.ghost{background:transparent;color:#00e5ff;border:1px solid rgba(0,229,255,.38)}
.btn:active{opacity:.85}
.ctrls{margin:16px auto 0;max-width:290px}
.crow{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:7px 2px;
  border-bottom:1px solid rgba(255,255,255,.07);font-size:12px;text-align:left;color:#cfd6e4}
.crow b{font-weight:600;white-space:nowrap}
.crow i{font-style:normal;color:#8b93a6;text-align:right}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
.gc{border:1px solid #1f2634;border-radius:4px;padding:9px}
.gc span{display:block;font-size:8px;letter-spacing:.18em;color:#6a7284}
.gc b{display:block;font-size:17px;margin-top:3px;color:#e6e9ef;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div id="stage">
  <div id="head">
    <div>SCORE <b id="sc">0</b></div>
    <div>LEVEL <b id="lv">1</b></div>
    <div>BALLS <b id="bl">3</b></div>
  </div>
  <div id="wrap"><canvas id="scope"></canvas></div>
</div>
<div id="veil"><div id="veilBody"></div></div>
<script>
(function(){
"use strict";
const AR = window.Arcade, $ = id => document.getElementById(id);
const cv = $('scope'), g = cv.getContext('2d');
const veil = $('veil'), veilBody = $('veilBody');

/* Logical space: 400 wide, height derived. Everything below is in these
   units, so the same numbers behave on any screen. */
const W = 400;
let H = 560, S = 1, OX = 0, OY = 0;

const COLS = 9;
/* Row colours, so a brick reads by where it sits rather than by a count you
   have to decode. Same beveled solid as Soviet Blocks. */
const ROWCOL = ['#e8484f','#e8963f','#e8d23f','#5ccf6a','#3fd6e0','#4f7ce8','#a86bff'];
let bricks, paddle, balls, drops, bolts, state, score, lives, level, best, rally, runs = 0;
let shake = 0, flashes = [];

/* ---- audio ------------------------------------------------------------- */
const snd = {
  paddle(pos){ if(AR) AR.sfx.tone({ freq:300 + pos*260, dur:0.055, type:'square', gain:0.06, cutoff:2200 }); },
  brick(row){ if(AR) AR.sfx.tone({ freq:520 + (5-row)*90, dur:0.06, type:'square', gain:0.055, cutoff:2600 }); },
  wall(){ if(AR) AR.sfx.tone({ freq:220, dur:0.04, type:'triangle', gain:0.045 }); },
  hard(){ if(AR) AR.sfx.noise({ freq:1800, dur:0.05, gain:0.05, filter:'bandpass' }); },
  chime(){ if(AR) AR.sfx.tone({ freq:880, to:1320, dur:0.22, type:'sine', gain:0.07, verb:0.4 }); },
  bad(){ if(AR) AR.sfx.tone({ freq:300, to:110, dur:0.30, type:'sawtooth', gain:0.07, cutoff:1000 }); },
  lost(){ if(AR) AR.sfx.tone({ freq:260, to:60, dur:0.7, type:'sawtooth', gain:0.09, cutoff:800 }); },
  clear(){ if(!AR) return; [0,1,2,3].forEach(i =>
    AR.sfx.tone({ t:AR.audio.ctx.currentTime + i*0.08, freq:440*Math.pow(1.26,i),
                  dur:0.26, type:'sine', gain:0.07, verb:0.5 })); },
  launch(){ if(AR) AR.sfx.tone({ freq:180, to:520, dur:0.16, type:'square', gain:0.06, cutoff:2400 }); },
  drop(){ if(AR) AR.sfx.tone({ freq:1200, dur:0.03, type:'sine', gain:0.025 }); }
};

/* ================================================================
   MUSIC
   The spec asked for a bed that ADDS layers as bricks clear, so the
   room empties out audibly. Four layers keyed to how much of the wall
   is gone: pulse, bass, arpeggio, and a high line that only arrives
   for the last few bricks. Nothing is a tune — it is a room tone that
   gets more anxious the closer you are to finishing.
   ================================================================ */
const RB = 110;                       /* A2 */
const rhz = n => RB * Math.pow(2, n/12);
const ARP = [0,7,12,15,12,7,15,19];

let startBricks = 1;
function clearedFrac(){
  const soft = bricks.filter(b => !b.hard).length;
  return Math.max(0, Math.min(1, 1 - soft / Math.max(1, startBricks)));
}

function musicTick(step, t){
  if(!AR || state !== 'play') return;
  const f = clearedFrac();
  const s16 = step % 16;

  /* 1. the pulse, always there */
  if(s16 % 4 === 0)
    AR.sfx.tone({ t, freq:rhz(0), dur:0.20, type:'triangle', gain:0.044,
                  attack:0.004, cutoff:420, bus:'music' });

  /* 2. bass answers on the off-beat once a quarter is gone */
  if(f > 0.25 && s16 % 8 === 6)
    AR.sfx.tone({ t, freq:rhz(-5), dur:0.26, type:'triangle', gain:0.085,
                  attack:0.006, cutoff:380, bus:'music' });

  /* 3. an arpeggio from halfway, sixteenths, rising */
  if(f > 0.50)
    AR.sfx.tone({ t, freq:rhz(ARP[step % ARP.length] + 12), dur:0.09,
                  type:'square', gain:0.048 + f*0.040, attack:0.004,
                  cutoff:2600, bus:'music' });

  /* 4. the last stretch: a high sustained fifth, thin and tense */
  if(f > 0.72 && s16 % 4 === 2)
    AR.sfx.tone({ t, freq:rhz(ARP[(step*3) % ARP.length] + 19), dur:0.07,
                  type:'square', gain:0.034, attack:0.003, cutoff:3000, bus:'music' });

  if(f > 0.80 && s16 === 0)
    AR.sfx.tone({ t, freq:rhz(31), dur:1.6, type:'sine', gain:0.075,
                  attack:0.35, verb:0.6, bus:'music' });
}

function startMusic(){
  if(!AR || !AR.music) return;
  AR.music.stop();
  AR.music.start(132, 4, musicTick);
}

/* ---- layouts -----------------------------------------------------------
   Hand-authored. '.' empty, 1-3 hit counts, '#' indestructible. */
const LAYOUTS = [
  ['111111111','111111111','111111111'],
  ['.1111111.','.2222222.','..11111..','...111...'],
  ['11.111.11','22.222.22','11.111.11','.#.....#.'],
  ['221111122','122222221','112222211','...###...'],
  ['1#1#1#1#1','222222222','1#1#1#1#1','111111111'],
  ['333333333','.2222222.','..11111..','....1....'],
  ['1.1.1.1.1','.2.2.2.2.','1.1.1.1.1','.3.3.3.3.'],
  ['##11111##','.2222222.','..33333..','...111...'],
  ['122222221','213333312','221111122','..#####..'],
  ['333333333','3#3#3#3#3','333333333','.1111111.']
];

function buildLevel(n){
  const rows = (n <= LAYOUTS.length)
    ? LAYOUTS[n-1]
    : procedural(n);
  bricks = [];
  const bw = W / COLS, bh = 20, top = 62;
  rows.forEach((row, r) => {
    for(let c=0;c<COLS;c++){
      const ch = row[c] || '.';
      if(ch === '.') continue;
      bricks.push({
        x: c*bw, y: top + r*bh, w: bw, h: bh, row: r,
        hard: ch === '#',
        hp: ch === '#' ? 99 : (+ch || 1),
        flash: 0
      });
    }
  });
}

function procedural(n){
  /* Beyond the authored set, weight toward tougher bricks with depth but keep
     a guaranteed soft row so a level is never a wall of threes. */
  const rows = [], depth = Math.min(6, 3 + Math.floor(n/6));
  for(let r=0;r<depth;r++){
    let s = '';
    for(let c=0;c<COLS;c++){
      const roll = Math.random() + n*0.006;
      if(roll > 1.25 && r < depth-1) s += '#';
      else if(roll > 0.92) s += '3';
      else if(roll > 0.62) s += '2';
      else if(roll > 0.18) s += '1';
      else s += '.';
    }
    rows.push(s);
  }
  rows.push('1'.repeat(COLS));
  return rows;
}

/* ---- entities ---------------------------------------------------------- */
function newBall(stuck){
  return { x: paddle.x, y: H - 46, vx:0, vy:0, r:4, stuck:!!stuck, trail:[], pierce:0, bomb:0 };
}
function launch(){
  for(const b of balls){
    if(b.stuck){
      b.stuck = false;
      snd.launch();
      const sp = speedFor();
      b.vx = sp * 0.42 * (Math.random() < 0.5 ? -1 : 1);
      b.vy = -sp;
    }
  }
}
function speedFor(){
  /* speed steps up with rally length and level, capped so it stays readable */
  return Math.min(5.4, 2.5 + level*0.10 + rally*0.02);
}

/* ---- pickups -----------------------------------------------------------
   Weighted, so the strong ones are rare and the bad ones are common enough to
   make catching a real decision rather than a reflex. `bad:true` colours the
   capsule red — you should always be able to CHOOSE to dodge one, which means
   never disguising a curse as a gift.
   -------------------------------------------------------------------------- */
const POWERS = {
  wide:    { w:10, ch:'W', bad:false, note:'paddle wider' },
  shrink:  { w:9,  ch:'S', bad:true,  note:'paddle narrower' },
  quick:   { w:8,  ch:'Q', bad:false, note:'paddle answers faster' },
  sludge:  { w:7,  ch:'L', bad:true,  note:'paddle answers slower' },
  multi:   { w:6,  ch:'M', bad:false, note:'two more balls' },
  slow:    { w:8,  ch:'O', bad:false, note:'ball slows' },
  fast:    { w:6,  ch:'F', bad:true,  note:'ball speeds up' },
  sticky:  { w:7,  ch:'C', bad:false, note:'catch and re-aim' },
  laser:   { w:6,  ch:'|', bad:false, note:'the paddle shoots' },
  pierce:  { w:4,  ch:'P', bad:false, note:'ball tears straight through' },
  bomb:    { w:5,  ch:'B', bad:false, note:'next hit takes the neighbours' },
  net:     { w:4,  ch:'N', bad:false, note:'one free save at the floor' },
  life:    { w:2,  ch:'+', bad:false, note:'a spare ball' },
  invert:  { w:5,  ch:'X', bad:true,  note:'steering reverses, briefly' }
};
const PKEYS = Object.keys(POWERS);
const PTOTAL = PKEYS.reduce((a,k)=>a+POWERS[k].w, 0);

function pickPower(){
  let r = Math.random() * PTOTAL;
  for(const k of PKEYS){ r -= POWERS[k].w; if(r <= 0) return k; }
  return 'wide';
}
function maybeDrop(x, y){
  if(Math.random() > 0.16) return;
  drops.push({ x, y, kind: pickPower(), vy: 1.5, spin: 0 });
}

function applyPower(kind){
  const def = POWERS[kind];
  switch(kind){
    case 'wide':   paddle.w = Math.min(130, paddle.w + 22); break;
    case 'shrink': paddle.w = Math.max(34,  paddle.w - 22); break;
    case 'quick':  paddle.gain = Math.min(2.0, paddle.gain + 0.35); break;
    case 'sludge': paddle.gain = Math.max(0.45, paddle.gain - 0.30); break;
    case 'slow':   for(const b of balls){ b.vx *= 0.74; b.vy *= 0.74; } break;
    case 'fast':   for(const b of balls){ b.vx *= 1.26; b.vy *= 1.26; } break;
    case 'sticky': paddle.sticky = 6; break;
    case 'laser':  paddle.laser = 9; break;
    case 'pierce': for(const b of balls) b.pierce = 6; break;
    case 'bomb':   for(const b of balls) b.bomb = 3; break;
    case 'net':    paddle.net = 1; break;
    case 'life':   lives++; paintHud(); break;
    case 'invert': paddle.invert = 6.5; break;
    case 'multi': {
      const src = balls[0];
      if(src && balls.length < 5){
        for(let i=0;i<2;i++){
          const a = Math.atan2(src.vy, src.vx) + (i ? 0.5 : -0.5);
          const sp = Math.hypot(src.vx, src.vy);
          balls.push({ x:src.x, y:src.y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
                       r:4, stuck:false, trail:[], pierce:0, bomb:0 });
        }
      }
      break;
    }
  }
  toast(def ? def.note : kind, def && def.bad);
  if(def && def.bad) snd.bad(); else snd.chime();
}

/* A line of text under the bricks for a second and a bit — without it a player
   catches a letter and has no idea what it did. */
let toastMsg = null, toastT = 0, toastBad = false;
function toast(msg, bad){ toastMsg = msg; toastT = 1.6; toastBad = !!bad; }

/* ---- step -------------------------------------------------------------- */
function step(dt){
  if(state !== 'play') return;
  const k = Math.min(2.2, dt * 60);

  for(const d of drops){ d.y += d.vy * k; }
  for(let i=drops.length-1;i>=0;i--){
    const d = drops[i];
    if(d.y > H){ drops.splice(i,1); continue; }
    if(d.y > H - 34 && d.y < H - 18 && Math.abs(d.x - paddle.x) < paddle.w/2 + 8){
      applyPower(d.kind); drops.splice(i,1);
    }
  }

  for(let bi=balls.length-1;bi>=0;bi--){
    const b = balls[bi];
    if(b.stuck){ b.x = paddle.x; b.y = H - 46; continue; }

    b.trail.push({x:b.x,y:b.y});
    if(b.trail.length > 9) b.trail.shift();

    b.x += b.vx * k;
    b.y += b.vy * k;

    if(b.x < b.r){ b.x = b.r; b.vx = Math.abs(b.vx); snd.wall(); }
    if(b.x > W - b.r){ b.x = W - b.r; b.vx = -Math.abs(b.vx); snd.wall(); }
    if(b.y < 40 + b.r){ b.y = 40 + b.r; b.vy = Math.abs(b.vy); snd.wall(); }

    /* paddle: the angle is a function of WHERE it lands, which is the whole
       game — a reflex test becomes an aiming one. */
    if(b.vy > 0 && b.y > H - 40 - b.r && b.y < H - 26 &&
       Math.abs(b.x - paddle.x) < paddle.w/2 + b.r){
      const pos = (b.x - paddle.x) / (paddle.w/2);      /* -1 .. 1 */
      const sp = speedFor();
      const ang = pos * 1.05;                            /* up to ~60 deg */
      b.vx = Math.sin(ang) * sp;
      b.vy = -Math.cos(ang) * sp;
      b.y = H - 40 - b.r;
      rally++;
      snd.paddle((pos+1)/2);
      if(paddle.sticky > 0){ b.stuck = true; paddle.sticky--; }
      clampAngle(b);
    }

    if(b.y > H - 12 && paddle.net > 0 && b.vy > 0){
      /* the safety net: one free save, then it is spent */
      paddle.net = 0;
      b.y = H - 14; b.vy = -Math.abs(b.vy);
      toast('the net catches it \u2014 that was your one', false);
      snd.chime();
      clampAngle(b);
    }
    if(b.y > H + 10){
      balls.splice(bi,1);
      if(!balls.length) loseBall();
      continue;
    }

    /* bricks */
    for(let i=bricks.length-1;i>=0;i--){
      const br = bricks[i];
      if(b.x + b.r < br.x || b.x - b.r > br.x + br.w ||
         b.y + b.r < br.y || b.y - b.r > br.y + br.h) continue;
      /* which face did it come through? compare overlap depths */
      const ox = Math.min(b.x + b.r - br.x, br.x + br.w - (b.x - b.r));
      const oy = Math.min(b.y + b.r - br.y, br.y + br.h - (b.y - b.r));
      /* a piercing ball keeps its line; everything else bounces */
      if(b.pierce > 0 && !br.hard){ b.pierce--; }
      else if(ox < oy) b.vx = -b.vx; else b.vy = -b.vy;
      br.flash = 1;
      if(br.hard){ snd.hard(); shake = Math.max(shake, 2); }
      else {
        br.hp--;
        snd.brick(br.row);
        score += 10 * level;
        if(br.hp <= 0){
          maybeDrop(br.x + br.w/2, br.y + br.h/2);
          flashes.push({ x:br.x, y:br.y, w:br.w, h:br.h, t:1 });
          const bx = br.x + br.w/2, by = br.y + br.h/2;
          bricks.splice(i,1);
          score += 25 * level;
          shake = Math.max(shake, 1.5);
          if(b.bomb > 0){
            /* takes the neighbours with it */
            b.bomb--;
            for(let j=bricks.length-1;j>=0;j--){
              const n = bricks[j];
              if(n.hard) continue;
              if(Math.abs(n.x + n.w/2 - bx) > n.w*1.2 || Math.abs(n.y + n.h/2 - by) > n.h*1.2) continue;
              flashes.push({ x:n.x, y:n.y, w:n.w, h:n.h, t:1 });
              bricks.splice(j,1);
              score += 25 * level;
            }
            shake = Math.max(shake, 4);
            snd.bad();
          }
        }
      }
      clampAngle(b);
      break;
    }
  }

  for(const br of bricks) if(br.flash > 0) br.flash -= 0.08 * k;
  for(let i=flashes.length-1;i>=0;i--){ flashes[i].t -= 0.06*k; if(flashes[i].t <= 0) flashes.splice(i,1); }
  if(shake > 0) shake -= 0.12 * k;
  if(paddle.laser > 0) paddle.laser -= 0.016 * k;
  if(paddle.invert > 0) paddle.invert -= 0.016 * k;
  if(toastT > 0) toastT -= 0.016 * k;

  /* the laser actually fires now: a bolt from each shoulder on a cadence */
  if(paddle.laser > 0){
    paddle.lt = (paddle.lt || 0) + 0.016 * k;
    if(paddle.lt > 0.22){
      paddle.lt = 0;
      bolts.push({ x: paddle.x - paddle.w/2 + 6, y: H - 40 });
      bolts.push({ x: paddle.x + paddle.w/2 - 6, y: H - 40 });
      snd.drop();
    }
  }
  for(let i=bolts.length-1;i>=0;i--){
    const bo = bolts[i];
    bo.y -= 7 * k;
    if(bo.y < 40){ bolts.splice(i,1); continue; }
    let hit = false;
    for(let j=bricks.length-1;j>=0;j--){
      const br = bricks[j];
      if(bo.x < br.x || bo.x > br.x + br.w || bo.y < br.y || bo.y > br.y + br.h) continue;
      if(!br.hard){
        br.hp--; br.flash = 1; score += 10 * level;
        if(br.hp <= 0){
          flashes.push({ x:br.x, y:br.y, w:br.w, h:br.h, t:1 });
          bricks.splice(j,1); score += 25 * level;
        }
        snd.brick(br.row);
      } else snd.hard();
      hit = true; break;
    }
    if(hit) bolts.splice(i,1);
  }

  if(!bricks.some(b => !b.hard)) nextLevel();
  paintHud();
}

/* The classic frustration is a ball creeping along nearly horizontal. Never
   let the vertical component fall below a fifth of the speed. */
function clampAngle(b){
  const sp = Math.hypot(b.vx, b.vy) || 1;
  const minY = sp * 0.34;
  if(Math.abs(b.vy) < minY){
    b.vy = (b.vy < 0 ? -1 : 1) * minY;
    const rem = Math.sqrt(Math.max(0.01, sp*sp - b.vy*b.vy));
    b.vx = (b.vx < 0 ? -1 : 1) * rem;
  }
}

function loseBall(){
  lives--;
  rally = 0;
  snd.lost();
  if(lives <= 0){ gameOver(); return; }
  paddle = { x: paddle.x, w:74, sticky:0, laser:0, gain:1, net:0, invert:0, lt:0 };
  drops = []; bolts = [];
  balls = [newBall(true)];
  paintHud();
}

function nextLevel(){
  level++;
  snd.clear();
  score += 200 * level;
  drops = []; bolts = [];
  paddle.w = 74; paddle.gain = 1; paddle.net = 0; paddle.invert = 0;
  buildLevel(level);
  balls = [newBall(true)];
  rally = 0;
  startBricks = bricks.filter(b => !b.hard).length || 1;
  paintHud();
}

/* ---- draw -------------------------------------------------------------- */
function fit(){
  const wrap = $('wrap');
  const availW = wrap.clientWidth - 4;
  const availH = wrap.clientHeight - 4;
  /* keep a 400x560 field; scale to whichever axis binds */
  S = Math.min(availW / W, availH / 560);
  H = 560;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(W * S * dpr);
  cv.height = Math.round(H * S * dpr);
  cv.style.width = (W*S) + 'px';
  cv.style.height = (H*S) + 'px';
  g.setTransform(dpr*S, 0, 0, dpr*S, 0, 0);
  draw();
}

/* Same lesson as Soviet Blocks: the first fit() runs before the flex layout
   has settled, so #wrap reports a width it will not keep and the field ends up
   wider than the phone. Size it, measure the real overflow, shrink, repeat. */
function fitTight(){
  fit();
  for(let i=0;i<6;i++){
    const r = cv.getBoundingClientRect();
    const over = Math.max(r.right - window.innerWidth, -r.left, 0);
    const under = r.bottom - $('wrap').getBoundingClientRect().bottom;
    if(over <= 0 && under <= 0) break;
    S *= 0.97;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(W * S * dpr);
    cv.height = Math.round(H * S * dpr);
    cv.style.width = (W*S) + 'px';
    cv.style.height = (H*S) + 'px';
    g.setTransform(dpr*S, 0, 0, dpr*S, 0, 0);
  }
  draw();
}

/* lighten or darken a hex by a fraction */
function shade(hex, amt){
  const n = parseInt(hex.slice(1),16);
  let r = (n>>16)&255, gg = (n>>8)&255, b = n&255;
  const f = v => Math.max(0, Math.min(255, Math.round(amt < 0 ? v*(1+amt) : v + (255-v)*amt)));
  return 'rgb(' + f(r) + ',' + f(gg) + ',' + f(b) + ')';
}

function draw(){
  g.save();
  if(shake > 0) g.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
  g.fillStyle = '#0d1119';
  g.fillRect(-6,-6,W+12,H+12);
  g.strokeStyle = 'rgba(255,255,255,.035)';
  g.lineWidth = 1;
  for(let x=0;x<=W;x+=40){ g.beginPath(); g.moveTo(x,40); g.lineTo(x,H); g.stroke(); }
  for(let y=40;y<=H;y+=40){ g.beginPath(); g.moveTo(0,y); g.lineTo(W,y); g.stroke(); }
  g.strokeStyle = 'rgba(255,255,255,.14)';
  g.strokeRect(0.5, 40.5, W-1, H-41);

  /* Solid, beveled — a lit top and left, a shadowed base and right. The same
     block language as Soviet Blocks, so the two cabinets look related. */
  for(const b of bricks){
    const lit = b.flash > 0 ? b.flash : 0;
    const x = b.x+1, y = b.y+1, w = b.w-2, h = b.h-2;
    const bev = Math.max(2, h*0.22);
    let col = b.hard ? '#8a93a3' : (ROWCOL[b.row % ROWCOL.length]);
    /* a two-hit brick sits darker until it is chipped, so damage reads */
    if(!b.hard && b.hp > 1) col = shade(col, -0.30 + (b.hp>2 ? -0.12 : 0));
    g.fillStyle = col;
    g.fillRect(x, y, w, h);
    g.fillStyle = 'rgba(255,255,255,' + (b.hard ? 0.30 : 0.26) + ')';
    g.fillRect(x, y, w, bev);
    g.fillRect(x, y, bev*0.7, h);
    g.fillStyle = 'rgba(0,0,0,.34)';
    g.fillRect(x, y+h-bev, w, bev);
    g.fillRect(x+w-bev*0.7, y, bev*0.7, h);
    if(b.hard){
      /* hatched, so it reads as "not going anywhere" at a glance */
      g.strokeStyle = 'rgba(0,0,0,.28)'; g.lineWidth = 1.4;
      for(let i=-h;i<w;i+=5){
        g.beginPath(); g.moveTo(x+i, y+h); g.lineTo(x+i+h, y); g.stroke();
      }
    }
    if(lit > 0){
      g.fillStyle = 'rgba(255,255,255,' + (lit*0.7) + ')';
      g.fillRect(x, y, w, h);
    }
  }
  for(const f of flashes){
    g.strokeStyle = 'rgba(255,255,255,' + f.t + ')';
    g.lineWidth = 2;
    const grow = (1-f.t) * 7;
    g.strokeRect(f.x+2.5-grow, f.y+2.5-grow, f.w-5+grow*2, f.h-5+grow*2);
  }

  /* falling power-ups */
  for(const d of drops){
    const def = POWERS[d.kind] || {};
    const base = def.bad ? '#e8484f' : '#5ccf6a';
    g.fillStyle = base;
    g.fillRect(d.x-8, d.y-6, 16, 12);
    g.fillStyle = 'rgba(255,255,255,.34)';
    g.fillRect(d.x-8, d.y-6, 16, 3);
    g.fillStyle = 'rgba(0,0,0,.38)';
    g.fillRect(d.x-8, d.y+3, 16, 3);
    g.fillStyle = def.bad ? '#2a0508' : '#062a0c';
    g.font = 'bold 8px "Chivo Mono", monospace';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(def.ch || '?', d.x, d.y);
    g.textBaseline = 'alphabetic';
  }
  for(const bo of bolts){
    g.fillStyle = '#ffe066';
    g.fillRect(bo.x-1, bo.y-7, 2, 9);
  }

  /* paddle: a bright segment, brighter at the shoulders so the aiming zones
     are visible rather than something you have to be told about */
  /* Brushed steel: a vertical gradient for the roll of the metal, plus warm
     caps at the shoulders so the aiming zones are still readable. */
  const px = paddle.x, pw = paddle.w, ph = 9, py = H - 36;
  const steel = g.createLinearGradient(0, py, 0, py+ph);
  steel.addColorStop(0,    '#f2f5fa');
  steel.addColorStop(0.28, '#c3ccda');
  steel.addColorStop(0.52, '#78829a');
  steel.addColorStop(0.75, '#9aa5b8');
  steel.addColorStop(1,    '#4a5265');
  g.fillStyle = steel;
  g.fillRect(px-pw/2, py, pw, ph);
  /* the shoulders, where the angle comes from */
  const cap = Math.min(15, pw*0.22);
  const capg = g.createLinearGradient(0, py, 0, py+ph);
  capg.addColorStop(0, '#7fe9ff'); capg.addColorStop(0.5, '#00b8d4'); capg.addColorStop(1, '#00627a');
  g.fillStyle = capg;
  g.fillRect(px-pw/2, py, cap, ph);
  g.fillRect(px+pw/2-cap, py, cap, ph);
  g.fillStyle = 'rgba(255,255,255,.55)';
  g.fillRect(px-pw/2, py, pw, 1.4);
  g.fillStyle = 'rgba(0,0,0,.45)';
  g.fillRect(px-pw/2, py+ph-1.6, pw, 1.6);
  if(paddle.sticky > 0){
    g.fillStyle = 'rgba(255,224,102,.85)';
    g.fillRect(px-pw/2, py-2.5, pw, 2);
  }
  if(paddle.laser > 0){
    g.fillStyle = '#ffe066';
    g.fillRect(px-pw/2+4, py-4, 4, 4);
    g.fillRect(px+pw/2-8, py-4, 4, 4);
  }
  /* the net stretched across the floor, obviously spendable */
  if(paddle.net > 0){
    g.strokeStyle = 'rgba(92,207,106,.55)';
    g.lineWidth = 1.5; g.setLineDash([5,5]);
    g.beginPath(); g.moveTo(2, H-10); g.lineTo(W-2, H-10); g.stroke();
    g.setLineDash([]);
  }
  if(paddle.invert > 0){
    g.fillStyle = 'rgba(232,72,79,.85)';
    g.font = '8px "Chivo Mono", monospace'; g.textAlign = 'center';
    g.fillText('STEERING REVERSED', W/2, H-52);
  }

  /* ball, with beam persistence */
  for(const b of balls){
    for(let i=0;i<b.trail.length;i++){
      const t = b.trail[i], a = (i/b.trail.length) * 0.5;
      g.fillStyle = 'rgba(180,200,225,' + (a*0.55) + ')';
      g.beginPath(); g.arc(t.x, t.y, b.r*0.75, 0, 6.2832); g.fill();
    }
    /* a sphere, lit from the upper left: highlight, body, terminator */
    const sg = g.createRadialGradient(b.x - b.r*0.38, b.y - b.r*0.42, b.r*0.10,
                                      b.x, b.y, b.r*1.12);
    if(b.bomb > 0){
      sg.addColorStop(0,'#fff'); sg.addColorStop(0.30,'#ffd9a0');
      sg.addColorStop(0.68,'#e8963f'); sg.addColorStop(1,'#6b3a10');
    } else if(b.pierce > 0){
      sg.addColorStop(0,'#fff'); sg.addColorStop(0.30,'#d8f0ff');
      sg.addColorStop(0.68,'#5cc8ff'); sg.addColorStop(1,'#0d3a55');
    } else {
      sg.addColorStop(0,'#ffffff'); sg.addColorStop(0.30,'#e4ecf7');
      sg.addColorStop(0.68,'#9aa8bd'); sg.addColorStop(1,'#3d465a');
    }
    g.fillStyle = sg;
    g.beginPath(); g.arc(b.x, b.y, b.r, 0, 6.2832); g.fill();
    g.fillStyle = 'rgba(255,255,255,.9)';
    g.beginPath(); g.arc(b.x - b.r*0.34, b.y - b.r*0.38, b.r*0.24, 0, 6.2832); g.fill();
  }

  if(toastT > 0 && toastMsg){
    g.globalAlpha = Math.min(1, toastT);
    g.fillStyle = toastBad ? '#e8484f' : '#5ccf6a';
    g.font = '9px "Chivo Mono", monospace'; g.textAlign = 'center';
    g.fillText(toastMsg.toUpperCase(), W/2, 200);
    g.globalAlpha = 1;
  }
  if(balls.some(b => b.stuck)){
    g.fillStyle = 'rgba(200,212,230,.6)';
    g.font = '9px "Chivo Mono", monospace';
    g.textAlign = 'center';
    g.fillText('TAP TO LAUNCH', W/2, H-70);
  }
  g.restore();
}

function paintHud(){
  $('sc').textContent = score.toLocaleString();
  $('lv').textContent = level;
  $('bl').textContent = lives;
}

let last = 0;
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now-last)/1000) || 0;
  last = now;
  step(dt);
  draw();
}

/* ---- state ------------------------------------------------------------- */
function reset(){
  score = 0; lives = 3; level = 1; rally = 0;
  paddle = { x: W/2, w: 74, sticky:0, laser:0, gain:1, net:0, invert:0, lt:0 };
  drops = []; bolts = []; flashes = [];
  toastMsg = null; toastT = 0;
  buildLevel(1);
  startBricks = bricks.filter(b => !b.hard).length || 1;
  balls = [newBall(true)];
  paintHud();
}
function start(){ runs++; reset(); state = 'play'; veil.classList.add('hidden'); fitTight(); startMusic(); }
function gameOver(){
  state = 'over';
  if(AR && AR.music) AR.music.stop();
  const sv = AR && AR.save ? AR.save.get('ricochet') : null;
  best = Math.max((sv && sv.best) || 0, score);
  if(AR && AR.save) AR.save.merge('ricochet', { best, label:'BEST ' + best.toLocaleString() });
  showOver();
}

/* ---- panels ------------------------------------------------------------ */
function openVeil(html, acts){
  veilBody.innerHTML = html;
  veil.classList.remove('hidden');
  veilBody.querySelectorAll('[data-act]').forEach(b =>
    b.addEventListener('click', () => { const fn = acts && acts[b.dataset.act]; if(fn) fn(); }));
}
function showTitle(){
  state = 'title';
  openVeil('<h1>Ricochet</h1>' +
    '<div class="tmenu">' +
      '<button class="btn" data-act="play">PLAY</button>' +
      '<button class="btn ghost" data-act="opts">OPTIONS</button>' +
      '<button class="btn ghost" data-act="quit">QUIT</button>' +
    '</div>',
    { play:start, opts:showOptions, quit:()=>{ if(AR && AR.home) AR.home(); } });
}
function showOptions(){
  openVeil('<div class="eyebrow">RICOCHET</div><h1>Options</h1>' +
    '<div class="tmenu">' +
      '<button class="btn ghost" data-act="ctrl">CONTROLS</button>' +
      '<button class="btn" data-act="back">BACK</button>' +
    '</div>', { ctrl:showControls, back:showTitle });
}
function showControls(){
  const touch = !!(AR && AR.touch);
  const v = touch ? 'Drag anywhere' : 'Drag, or arrow keys';
  const rows = [
    [v, 'slide the paddle'],
    [touch ? 'Tap' : 'Tap, or space', 'launch the ball'],
    ['Where it lands', 'decides the angle'],
    ['Catch the falling letters', 'not all of them help'],
    ['Pause, top right', 'options']
  ];
  openVeil('<div class="eyebrow">' + (touch ? 'TOUCH' : 'POINTER') + '</div><h1>Controls</h1>' +
    '<div class="ctrls">' + rows.map(r=>'<div class="crow"><b>'+r[0]+'</b><i>'+r[1]+'</i></div>').join('') + '</div>' +
    '<button class="btn" data-act="back" style="margin-top:16px">BACK</button>',
    { back:showOptions });
}
function showOver(){
  openVeil('<div class="eyebrow">NO BALLS LEFT</div>' +
    '<h1>' + score.toLocaleString() + '<em>FINAL SCORE</em></h1>' +
    '<div class="grid2">' +
      '<div class="gc"><span>LEVEL</span><b>' + level + '</b></div>' +
      '<div class="gc"><span>BEST</span><b>' + best.toLocaleString() + '</b></div>' +
    '</div>' +
    '<div class="tmenu">' +
      '<button class="btn" data-act="again">PLAY AGAIN</button>' +
      '<button class="btn ghost" data-act="title">TITLE</button>' +
    '</div>', { again:start, title:showTitle });
}

/* ---- input --------------------------------------------------------------
   Relative drag: the paddle moves BY how far the thumb moved, so the thumb
   never has to sit on top of the thing it is steering. */
let px0 = 0, pad0 = 0, dragging = false, moved = false;
function toLogical(clientX){
  const r = cv.getBoundingClientRect();
  return (clientX - r.left) / S;
}
cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId);
  dragging = true; moved = false;
  px0 = toLogical(e.clientX); pad0 = paddle.x;
});
cv.addEventListener('pointermove', e => {
  if(!dragging || state !== 'play') return;
  let d = (toLogical(e.clientX) - px0) * (paddle.gain || 1);
  if(paddle.invert > 0) d = -d;          /* briefly, and it is signposted */
  if(Math.abs(d) > 2) moved = true;
  paddle.x = Math.max(paddle.w/2, Math.min(W - paddle.w/2, pad0 + d));
});
cv.addEventListener('pointerup', () => {
  if(dragging && !moved && state === 'play') launch();
  dragging = false;
});

window.addEventListener('keydown', e => {
  if(state !== 'play'){
    if(e.key === 'Enter' || e.key === ' '){
      const b = veilBody.querySelector('.btn'); if(b){ e.preventDefault(); b.click(); }
    }
    return;
  }
  const sgn = paddle.invert > 0 ? -1 : 1, stepX = 22 * (paddle.gain || 1);
  if(e.key === 'ArrowLeft'){ e.preventDefault(); paddle.x = Math.max(paddle.w/2, Math.min(W-paddle.w/2, paddle.x - sgn*stepX)); }
  else if(e.key === 'ArrowRight'){ e.preventDefault(); paddle.x = Math.max(paddle.w/2, Math.min(W - paddle.w/2, paddle.x + sgn*stepX)); }
  else if(e.key === ' '){ e.preventDefault(); launch(); }
});

if(AR && AR.pad) AR.pad.onPress(name => {
  if(AR.paused && AR.paused()) return;
  if(state !== 'play'){
    if(name === 'a' || name === 'start'){ const b = veilBody.querySelector('.btn'); if(b) b.click(); }
    return;
  }
  if(name === 'left') paddle.x = Math.max(paddle.w/2, paddle.x - 22);
  else if(name === 'right') paddle.x = Math.min(W - paddle.w/2, paddle.x + 22);
  else if(name === 'a') launch();
});

if(AR && AR.onRestart) AR.onRestart(start);
window.addEventListener('resize', fitTight);
if(window.ResizeObserver) new ResizeObserver(fitTight).observe($('wrap'));

const sv0 = AR && AR.save ? AR.save.get('ricochet') : null;
best = (sv0 && sv0.best) || 0;
reset();
fit();
showTitle();
requestAnimationFrame(()=>{ fitTight(); setTimeout(fitTight, 200); });
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
