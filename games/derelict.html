/* ---------------- keyboard & gamepad ----------------
   Bump into something to hit it, which is how a crawler should read. */
function adjacentMob(){
  if(sel && sel.alive && adjacent(sel)) return sel;
  for(const m of mobs) if(m.alive && adjacent(m)) return m;
  return null;
}

/* what the equipped weapon can actually reach right now */
function targetMob(){
  if(wep().kind === 'ranged'){
    if(sel && sel.alive && inShotRange(sel)) return sel;
    let best = null, bd = 1e9;
    for(const m of mobs){
      if(!m.alive || !inShotRange(m)) continue;
      const d = Math.max(Math.abs(m.x-P.x), Math.abs(m.y-P.y));
      if(d < bd){ bd = d; best = m; }
    }
    if(best) return best;
  }
  return adjacentMob();
}

function nudge(dx, dy){
  if(busy || dead || veilOpen()) return;
  const nx = P.x + dx, ny = P.y + dy;
  if(!inB(nx, ny)) return;
  const t = at(nx, ny);
  const m = mobAt(nx, ny);
  if(m && m.alive){ sel = m; render(); strike(m); return; }
  if(t.wall) return;
  if(t.door && !t.door.open && !hasKey(t.door.colour)){
    snd.denied();
    say('SEALED. ' + DOOR_NAME[t.door.colour] + ' KEYCARD REQUIRED.');
    render();
    return;
  }
  sel = null;
  walk([idx(nx, ny)]);
}

const KEYMAP = {
  ArrowUp:[0,-1], ArrowDown:[0,1], ArrowLeft:[-1,0], ArrowRight:[1,0],
  w:[0,-1], s:[0,1], a:[-1,0], d:[1,0],
  W:[0,-1], S:[0,1], A:[-1,0], D:[1,0],
  q:[-1,-1], e:[1,-1], z:[-1,1], c:[1,1],
  Q:[-1,-1], E:[1,-1], Z:[-1,1], C:[1,1]
};

window.addEventListener('keydown', ev => {
  if(veilOpen()){
    if(ev.key === 'Enter' || ev.key === ' '){
      const b = veilBody.querySelector('.vbtn');
      if(b){ ev.preventDefault(); b.click(); }
    }
    return;
  }
  if(busy || dead) return;
  const d = KEYMAP[ev.key];
  if(d){ ev.preventDefault(); nudge(d[0], d[1]); return; }
  if(ev.key === '1'){ const m = targetMob(); if(m){ sel = m; arc(m); } }
  else if(ev.key === '2') patch();
  else if(ev.key === '3') surge();
  else if(ev.key === 'i' || ev.key === 'I' || ev.key === 'Tab'){ ev.preventDefault(); showKit(); }
  else if(ev.key === ' ' || ev.key === 'Enter'){
    const m = targetMob(); if(m){ sel = m; attack(m); }
  }
});

if(AR && AR.pad) AR.pad.onPress(name => {
  if(AR.paused && AR.paused()) return;
  if(veilOpen()){
    if(name === 'a' || name === 'start'){
      const b = veilBody.querySelector('.vbtn');
      if(b) b.click();
    }
    return;
  }
  if(busy || dead) return;
  const d = { up:[0,-1], down:[0,1], left:[-1,0], right:[1,0] }[name];
  if(d){ nudge(d[0], d[1]); return; }
  if(name === 'a'){ const m = targetMob(); if(m){ sel = m; attack(m); } }
  else if(name === 'x'){ const m = adjacentMob(); if(m){ sel = m; arc(m); } }
  else if(name === 'y') patch();
  else if(name === 'rb') surge();
  else if(name === 'back' || name === 'lb') showKit();
});

/* ================================================================
   FIT
   ================================================================ */
function fit(){
  const wrap = $('gridwrap');
  const w = wrap.clientWidth, h = wrap.clientHeight;
  if(!w || !h) return;
  CELL = Math.max(14, Math.floor(Math.min(w/COLS, h/ROWS)));
  BDPR = Math.min(2, window.devicePixelRatio || 1);
  board.style.width  = (COLS*CELL) + 'px';
  board.style.height = (ROWS*CELL) + 'px';
  board.width  = Math.round(COLS*CELL*BDPR);
  board.height = Math.round(ROWS*CELL*BDPR);
  if(map) drawBoard();
}
window.addEventListener('resize', fit);
window.addEventListener('orientationchange', ()=>setTimeout(fit,150));

/* ================================================================
   OVERLAYS
   ================================================================ */
function openVeil(html, go){
  veilBody.innerHTML = html;
  veil.classList.remove('hidden');
  const acts = typeof go === 'function' ? { go } : (go || {});
  veilBody.querySelectorAll('.vbtn').forEach(b => {
    const key = b.getAttribute('data-act') || 'go';
    b.addEventListener('click', () => {
      veil.classList.add('hidden');
      const f = acts[key];
      if(f) f();
    });
  });
}
const veilOpen = () => !veil.classList.contains('hidden');

function systemsList(){
  if(!installed.length) return '<div class="vflavor">No systems recovered yet.</div>';
  return '<div class="syslist">' + installed.map(c =>
    '<div><b>'+c.name+'</b><span>'+c.desc+'</span></div>').join('') + '</div>';
}

function showKit(){
  const KIND = { melee:'MELEE', tool:'TOOL', ranged:'RANGED' };
  let html =
    '<div class="veyebrow">SUIT MANIFEST \u00B7 DECK ' + String(deck).padStart(2,'0') + '</div>' +
    '<div class="vtitle ice">Gear</div>' +
    '<div class="kit">' +
      '<div class="kstats">' +
        '<div><span>INTEGRITY</span><b>' + P.hp + '/' + P.maxHp + '</b></div>' +
        '<div><span>CHARGE</span><b>' + P.charge + '/' + P.maxCharge + '</b></div>' +
        '<div><span>CALIBRATION</span><b>LV ' + P.lvl + '</b></div>' +
        '<div><span>DATA</span><b>' + P.xp + '/' + P.xpNeed + '</b></div>' +
        '<div><span>BASE DAMAGE</span><b>' + Math.round(P.dmg * P.dmgMul) + '</b></div>' +
        '<div><span>RESIST</span><b>' + Math.round((P.resist + (P.buff.res>0?0.35:0))*100) + '%</b></div>' +
      '</div>';

  if(P.buff.dmg > 0 || P.buff.res > 0 || P.corroded){
    html += '<div class="kithead">ACTIVE</div>';
    if(P.buff.dmg > 0) html += '<div class="krow"><div class="kmid"><b>STIM</b><i>+60% damage \u00B7 ' + P.buff.dmg + ' turns left</i></div></div>';
    if(P.buff.res > 0) html += '<div class="krow"><div class="kmid"><b>CARAPACE</b><i>\u221235% incoming \u00B7 ' + P.buff.res + ' turns left</i></div></div>';
    if(P.corroded)     html += '<div class="krow"><div class="kmid"><b>SUIT SEARED</b><i>Scan repair cut to a third until purged</i></div></div>';
  }

  html += '<div class="kithead">WEAPONS</div>';
  const order = P.weapons.slice().sort((a,b) => (WEAPONS[a].tier||0) - (WEAPONS[b].tier||0));
  for(const id of order){
    const k = WEAPONS[id];
    const dmg = wepDmg(id, null);
    const spec = k.kind === 'ranged'
      ? dmg + ' \u00B7 ' + k.range + 'sq' + (k.shots > 1 ? ' \u00B7 x' + k.shots : '')
      : dmg + ' \u00B7 ' + KIND[k.kind].toLowerCase();
    const feed = k.ammo ? (k.cost||1) + ' ' + AMMO[k.ammo].name.toLowerCase() + ' (' + (P.ammo[k.ammo]||0) + ')' : 'no ammunition';
    const dry = k.ammo && !canFire(id);
    html +=
      '<div class="krow">' +
        '<div class="kmid"><b>' + k.name + (dry ? ' \u00B7 DRY' : '') + '</b>' +
          '<i>' + k.note + '<br>' + feed + '</i></div>' +
        '<div class="kdmg">' + spec + '</div>' +
        '<button class="kbtn' + (id === P.weapon ? ' on' : '') + '" data-eq="' + id + '">' +
          (id === P.weapon ? 'HELD' : 'HOLD') + '</button>' +
      '</div>';
  }

  html += '<div class="kithead">CARRIED</div>';
  let any = false;
  for(const id in USABLE){
    const n = P.items[id] || 0;
    if(!n) continue;
    any = true;
    html +=
      '<div class="krow">' +
        '<div class="kmid"><b>' + USABLE[id].name + ' \u00D7' + n + '</b><i>' + USABLE[id].note + '</i></div>' +
        '<button class="kbtn" data-use="' + id + '">USE</button>' +
      '</div>';
  }
  if(!any) html += '<div class="krow"><div class="kmid"><i>Pockets empty.</i></div></div>';

  html += '<div class="kithead">AMMUNITION</div><div class="krow"><div class="kmid"><i>';
  html += Object.keys(AMMO).map(a => AMMO[a].name + ' ' + (P.ammo[a]||0)).join(' \u00B7 ');
  html += '</i></div></div>';

  if(P.keys.length)
    html += '<div class="kithead">KEYCARDS</div><div class="krow"><div class="kmid"><i>' +
            P.keys.map(k => DOOR_NAME[k]).join(' \u00B7 ') + '</i></div></div>';

  html += '<div class="kithead">SYSTEMS</div>';
  if(!installed.length) html += '<div class="krow"><div class="kmid"><i>Nothing recovered yet.</i></div></div>';
  for(const c of installed)
    html += '<div class="krow"><div class="kmid"><b>' + c.name + '</b><i>' + c.desc + '</i></div></div>';

  html += '</div><div class="kend"><button class="vbtn" data-act="close">BACK TO THE DECK</button></div>';

  openVeil(html, { close: ()=>{ render(); } });
  veilBody.querySelectorAll('[data-eq]').forEach(b => {
    b.addEventListener('click', e => { e.stopPropagation(); equip(b.getAttribute('data-eq')); showKit(); });
  });
  veilBody.querySelectorAll('[data-use]').forEach(b => {
    b.addEventListener('click', e => {
      e.stopPropagation();
      veil.classList.add('hidden');
      useItem(b.getAttribute('data-use'));
    });
  });
}

function showTitle(){
  openVeil(
    '<div class="veyebrow">SALVAGE LOG \u00B7 VESSEL "ORISON"</div>' +
    '<div class="vtitle">Derelict</div>' +
    '<div class="vflavor">One suit, and the ship keeps going down. Scanning empty sectors is the only thing that repairs you \u2014 the map is your medkit, and you only get to spend it once.</div>' +
    '<div class="legend">' +
      '<b>Tap</b> a tile to move. <b>Tap</b> a hostile to read it, again to strike.<br>' +
      'Sealed doors need the matching <i class="c-key k-blue">keycard</i> \u2014 they are always aboard.<br>' +
      '<i class="c-apex">\u03A9</i> guards a <i class="c-core">salvage core</i>. Take it and the hatch releases.<br>' +
      'Every ship carries a different core. They stack for the whole run.' +
    '</div>' +
    (savedRun()
      ? '<button class="vbtn" data-act="resume" style="margin-top:22px">CONTINUE \u00B7 DECK ' +
          String(savedRun().run.deck).padStart(2,'0') + '</button>' +
        '<button class="vbtn ghost" data-act="fresh" style="margin-top:10px">START A NEW RUN</button>'
      : '<button class="vbtn" data-act="fresh" style="margin-top:22px">BOARD</button>'),
    {
      resume: ()=>{ if(!loadRun()){ dropSave(); newRun(); live = true; } fit(); showDeckCard(); },
      fresh:  ()=>{ dropSave(); newRun(); live = true; fit(); showDeckCard(); }
    });
}

function showDeckCard(){
  const info = deckInfo();
  const hostiles = mobs.filter(m=>m.alive && !m.boss).length;
  const apex = mobs.find(m=>m.boss);
  const locks = map.filter(t=>t.door).length;
  openVeil(
    '<div class="veyebrow">DECK ' + String(deck).padStart(2,'0') + ' \u00B7 PRESSURE OK</div>' +
    '<div class="vtitle ice">' + info[0] + '</div>' +
    '<div class="vflavor">' + info[1] + '</div>' +
    '<div class="vgrid">' +
      '<div class="vcell"><span>HOSTILES</span><b>' + hostiles + '</b></div>' +
      '<div class="vcell"><span>APEX</span><b>LV ' + (apex?apex.lvl:'?') + '</b></div>' +
      '<div class="vcell"><span>SEALED DOORS</span><b>' + locks + '</b></div>' +
      '<div class="vcell"><span>INTEGRITY</span><b>' + P.hp + '/' + P.maxHp + '</b></div>' +
    '</div>' +
    systemsList() +
    '<button class="vbtn" style="margin-top:18px">CYCLE HATCH</button>');
}

function showCore(core){
  openVeil(
    '<div class="veyebrow">SALVAGE CORE \u00B7 DECK ' + String(deck).padStart(2,'0') + '</div>' +
    '<div class="vtitle amberT">' + core.name + '</div>' +
    '<div class="vflavor">' + core.desc + '</div>' +
    '<div class="vflavor" style="color:var(--dim)">The hatch below you unseals.</div>' +
    '<button class="vbtn amberB">INSTALL</button>');
}

function showDeath(){
  openVeil(
    '<div class="veyebrow">BIOSIGN \u2014 FLAT</div>' +
    '<div class="vtitle">Signal Lost</div>' +
    '<div class="vflavor">The suit keeps transmitting for a while after you stop.</div>' +
    '<div class="vgrid">' +
      '<div class="vcell"><span>REACHED</span><b>DECK ' + String(deck).padStart(2,'0') + '</b></div>' +
      '<div class="vcell"><span>CALIBRATION</span><b>LV ' + P.lvl + '</b></div>' +
      '<div class="vcell"><span>KILLS</span><b>' + P.kills + '</b></div>' +
      '<div class="vcell"><span>DEEPEST</span><b>DECK ' + String(best).padStart(2,'0') + '</b></div>' +
    '</div>' +
    systemsList() +
    '<button class="vbtn red" data-act="go" style="margin-top:18px">BOARD AGAIN</button>' +
    '<div class="vsub">ATTEMPT ' + (runDeaths+1) + '</div>',
    ()=>{ dropSave(); newRun(); live = true; fit(); showDeckCard(); });
}

/* ================================================================
   BOOT
   ================================================================ */
fit();
window.addEventListener('load', fit);
newRun();
fit();
showTitle();
})();
</script>
